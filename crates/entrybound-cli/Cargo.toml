[package]
name = "entrybound-cli"
description = "Command-line interface for Entrybound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
autobins = false

[lib]
name = "entrybound_cli"
path = "src/lib.rs"

[[bin]]
name = "ebound"
path = "src/main.rs"

[[bin]]
name = "entrybound"
path = "src/bin/entrybound.rs"

[dependencies]
entrybound = { path = "../entrybound" }
rpassword = "=7.4.0"
zeroize = { version = "=1.9.0", features = ["alloc"] }

[dev-dependencies]
bzip2 = "=0.6.1"
crc32fast = "=1.5.0"
flate2 = "=1.1.9"
lzma-rust2 = { version = "=0.20.0", default-features = false, features = ["std", "encoder", "xz"] }
zstd = { version = "=0.13.3", default-features = false }

[lints]
workspace = true

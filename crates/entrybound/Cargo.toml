[package]
name = "entrybound"
description = "Core semantic model and native format foundations for Entrybound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes = "=0.9.3"
aes-gcm-siv = "=0.12.1"
argon2 = "=0.6.0"
bzip2 = "=0.6.1"
cap-std = "4.0.3"
cms = { version = "=0.3.0-pre.2", default-features = false, features = ["std"] }
crc32fast = "=1.5.0"
der = { version = "=0.8.1", default-features = false, features = ["alloc", "derive", "oid", "pem", "std"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
flate2 = "=1.1.9"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
hmac = "=0.13.0"
jixel = { version = "=0.2.19", default-features = false }
jxl-oxide = { version = "=0.12.6", default-features = false }
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
lzma-rust2 = { version = "=0.20.0", default-features = false, features = ["std", "encoder", "xz"] }
ml-kem = "=0.3.2"
preflate-rs = "=0.7.6"
sha2 = "=0.11.0"
sha3 = "=0.12.0"
spki = "=0.8.0"
subtle = "=2.6.1"
x-wing = { version = "=0.1.0", features = ["getrandom", "zeroize"] }
x25519-dalek = "=3.0.0"
x509-cert = { version = "=0.3.0", default-features = false, features = ["pem", "std"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
zstd = { version = "=0.13.3", default-features = false, features = ["zdict_builder"] }

[dev-dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "fast", "pkcs8", "zeroize"] }
flate2 = "=1.1.9"
image = { version = "=0.25.8", default-features = false, features = ["jpeg"] }
jpeg-encoder = { version = "=0.7.1", default-features = false }
x509-cert = { version = "=0.3.0", default-features = false, features = ["builder", "pem", "std"] }

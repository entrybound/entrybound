[package]
name = "ebr-chunk"
description = "Chunking/dedup research: production gear-norm-v1 via entrybound::chunker, plus research-only alternative CDC implementations, compared on the same input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ebr-common = { path = "../ebr-common" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
entrybound = { path = "../../../../crates/entrybound", features = ["research-internals"] }

# Reference implementation ONLY, used exclusively by
# src/algorithms/fastcdc2016.rs and src/algorithms/fastcdc2020.rs's
# `#[cfg(test)]` modules to cross-check this crate's own FastCDC port
# against an independent, maintained implementation. Never imported outside
# `#[cfg(test)]`.
[dev-dependencies]
fastcdc = "=4.0.1"

[[bin]]
name = "ebr-chunk"
path = "src/main.rs"

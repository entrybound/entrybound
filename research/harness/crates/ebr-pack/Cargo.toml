[package]
name = "ebr-pack"
description = "End-to-end archive measurements (plan/encode/open/verify/unpack/random-read) over entrybound's public production API, with complete byte accounting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ebr-common = { path = "../ebr-common" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# Same crate the Internals agent proved byte-identical with and without this
# feature (research/harness/research-internals.md, commit c9a2d3a). ebr-pack
# only calls the *public* production API today (see src/lib.rs); the feature
# is enabled here so later measurement code in this crate can also reach
# entrybound::research without a Cargo.toml change.
entrybound = { path = "../../../../crates/entrybound", features = ["research-internals"] }

[[bin]]
name = "ebr-pack"
path = "src/main.rs"

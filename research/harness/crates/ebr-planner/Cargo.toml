[package]
name = "ebr-planner"
description = "Planner candidate traces, exhaustive search, and regret research: checks entrybound's research-internals candidate enumeration against the real production planner it mirrors, for every planner generation and profile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ebr-common = { path = "../ebr-common" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
entrybound = { path = "../../../../crates/entrybound", features = ["research-internals"] }

[[bin]]
name = "ebr-planner"
path = "src/main.rs"

schema: ebr.spec.v1
experiment_id: EXP-CHUNK-004
status: pre-registration-draft; NEEDS_TOOLING (research-internals plan_directory_with_ranges, ebr-cdcpack, roundtrip_eb.py); arm SQ (tool-validity gate and status-quo reference)
question: >
  What complete artifact bytes (framing, Index, manifest, dictionaries, groups, side
  data), access granularity and access amplification do CDC constructions and size
  policies produce once the production v6 planner and encoder run on their chunks,
  per profile, per family and in aggregate; and does the research pack path reproduce
  production archives byte for byte for the frozen status quo?
hypothesis: >
  Arm SQ (this spec) is a binary tool-validity gate: for every tuning item and every
  frozen profile, ebr-cdcpack with gear-norm-v1 and the frozen candidate lists and
  proxy selection produces an archive SHA-256-identical to ebr-pack (production
  plan_directory + ecf::encode) and it round-trips. Decision hypotheses for arms A and
  B (generated specs) are in protocol.md section 3.
decision_ids: [DEC-CMP-001, DEC-CMP-002, DEC-CMP-003, DEC-CMP-004, DEC-CMP-017, DEC-MOD-039, DEC-ACC-029]

candidates:
  - name: sq-gear-norm-v1-fast
    params: {profile: fast}
  - name: sq-gear-norm-v1-balanced
    params: {profile: balanced}
  - name: sq-gear-norm-v1-dense
    params: {profile: dense}
  - name: sq-gear-norm-v1-extreme
    params: {profile: extreme}
command: >-
  /root/eb-research/target/exp-chunk/release/ebr-cdcpack
  --item-path {item_path} --experiment-id EXP-CHUNK-004 --env-name wsl-ubuntu
  --algorithm gear-norm-v1 --size-set frozen:{profile} --selection proxy-frozen
  --codec-profile {profile} --planner v6 --layout indexed --granularity archive
  --archive-out {scratch}/cdc.eb
  --access-strata 1,4096,1048576,entry --access-samples 1000 --access-seed 20260917
  --occurrence-out /root/eb-research/results/EXP-CHUNK-004/{candidate}/{item_id}.occ.jsonl.gz
shell: bash


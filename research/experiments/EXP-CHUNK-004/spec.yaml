metrics:
  - {name: artifact_bytes, source: path_size, path: '{scratch}/cdc.eb', family: size, direction: minimize, unit: B}
  - {name: artifact_bytes_accounted, source: stdout_json, key: payload.bytes.total_bytes, family: size, direction: minimize, unit: B}
  - {name: index_bytes, source: stdout_json, key: payload.bytes.index_bytes, family: size, direction: minimize, unit: B}
  - {name: metadata_bytes, source: stdout_json, key: payload.bytes.metadata_bytes, family: size, direction: minimize, unit: B}
  - {name: dictionary_bytes, source: stdout_json, key: payload.bytes.dictionary_bytes, family: size, direction: minimize, unit: B}
  - {name: side_data_bytes, source: stdout_json, key: payload.bytes.side_data_bytes, family: size, direction: minimize, unit: B}
  - {name: metadata_bytes_per_entry, source: stdout_json, key: payload.bytes.metadata_bytes_per_entry, family: size, direction: minimize, unit: B/entry}
  - {name: dedup_stored_fraction, source: stdout_json, key: payload.counts.dedup_stored_fraction, family: size, direction: minimize, unit: ratio}
  - {name: access_granularity_bytes, source: stdout_json, key: payload.access.granularity_bytes, family: size, direction: minimize, unit: B}
  - {name: access_amplification_1b, source: stdout_json, key: payload.access.amplification.s1.mean, family: other, direction: minimize, unit: ratio}
  - {name: access_amplification_4k, source: stdout_json, key: payload.access.amplification.s4096.mean, family: other, direction: minimize, unit: ratio}
  - {name: access_amplification_1m, source: stdout_json, key: payload.access.amplification.s1048576.mean, family: other, direction: minimize, unit: ratio}
  - {name: access_amplification_entry, source: stdout_json, key: payload.access.amplification.entry.mean, family: other, direction: minimize, unit: ratio}
  - {name: chunk_count, source: stdout_json, key: payload.counts.unique_chunk_count, family: other, direction: none, unit: count}
  - {name: selected_chunker_id, source: stdout_json, key: payload.counts.chunker_id, family: correctness, kind: string}
  - {name: archive_sha256, source: path_sha256, path: '{scratch}/cdc.eb', family: correctness}
  - {name: sq_gate_identical, source: check, family: correctness, command: '/root/eb-research/target/exp-chunk/release/ebr-pack --item-path {item_path} --experiment-id EXP-CHUNK-004 --env-name wsl-ubuntu --profile {profile} --layout indexed --archive-out {scratch}/ref.eb > /dev/null && cmp -s {scratch}/cdc.eb {scratch}/ref.eb'}

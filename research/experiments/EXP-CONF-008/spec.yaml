  --seed-base 2809171001 --rep {rep} --fork 4 --rss-limit-mb 2048 --timeout-s 10
  --checkpoints-cpu-h 0.25,0.5,1,2,4
  --source /root/eb-research/src/conf-fuzz-head --seed-corpora research/harness/fuzz/seed-corpora-v1.json
  --artifact-dir /root/eb-research/raw-artifacts/EXP-CONF-008/{candidate}/rep{rep}
  --experiment-id EXP-CONF-008 --env-name wsl-ubuntu

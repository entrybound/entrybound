schema: ebr.spec.v1
experiment_id: EXP-CONF-008
status: designed
question: >
  Which coverage-adequacy criterion and harness mode would stop a fuzz campaign at a point that has detected the most pre-registered injected defects per CPU-hour, reproducibly across seeds, for each calibration target?
hypothesis: >
  H1: for digest-gated targets, bypass mode detects injected defects behind digest or CRC checks that verify-on mode
  misses within the same budget. H2: at least one criterion defined for every calibration target stops within a factor
  of 2 of its median stop time on all seeds. H3 (negative-result hypothesis): wrong-class defects without a crash are not
  detected by single-reader crash fuzzing.
decision_ids: [DEC-ECO-028, DEC-ECO-029, DEC-CRY-017]
notes: >
  Design pre-registration (Phase C-design); runs after gate G-A; results are descriptive (protocol section 9 metric gap).
  The generated item is an anchor only: campaign inputs are the pre-registered seed corpora of protocol section 6.
  Repetition k uses libFuzzer seed 2809171001 + k (k = 0, 1, 2). Targets without a digest or CRC gate run in mode 'on'
  only. CPU-saturating: never concurrent with timing windows. Conventions: research/experiments/_index/conformance-conventions.md.


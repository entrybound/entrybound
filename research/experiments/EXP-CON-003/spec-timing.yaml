# EXP-CON-003 spec-timing.yaml. Pre-registered design (Phase C-design, container domain).
# In-process timing arm (st-v) on survivors (CT-4 filter).
# Conventions: research/experiments/_index/container-conventions.md. Do not run before gate G-A;
# runs before G-B are NOT_DECISION_GRADE. Tuning split only; validation looks are derived (CT-4).
schema: ebr.spec.v1
experiment_id: EXP-CON-003
status: pre-registered-design
question: Which byte-range verification structure, outboard layout, tree construction and count binding
  give the fewest fetched bytes, requests and digest operations per verified range from 1e3 to 1e7 Chunks
  per object, with small cacheable proofs, sound refusal of malformed proofs and byte-exact independent
  reproduction?
hypothesis: 'H1: for 1-byte and 4 KiB ranges in objects of >=1e4 Chunks, a binary or k-ary outboard is
  DISTINGUISHABLE_BETTER than s0-flat-leaflist-sq on verified_range_fetch_bytes and verification_digest_ops
  by at least the T3 minimum gain, with side_data_bytes below 1% of artifact_bytes; for objects below
  64 Chunks no structure beats the status quo by 1 band unit. Falsified as stated in protocol.md section
  2.'
decision_ids:
- DEC-CON-020
- DEC-INT-029
- DEC-MOD-034
candidates:
- name: s0-flat-leaflist-sq
  params:
    structure: flat-leaflist
    layout: none
- name: s1-two-stage-leaflist
  params:
    structure: two-stage-leaflist
    layout: none
- name: s2-outboard-level-order
  params:

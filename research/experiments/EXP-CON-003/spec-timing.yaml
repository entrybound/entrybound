    layout: paged-subtree-4096
- name: s2-outboard-paged-64k
  params:
    structure: binary-outboard
    layout: paged-subtree-65536
- name: s2-outboard-fsverity-4k
  params:
    structure: binary-outboard
    layout: fsverity-bottom-up-4096
- name: s3-per-object-outboard-t64
  params:

schema: ebr.spec.v1
experiment_id: EXP-RECON-006
status: pre-registered-design
question: >
  What are the exact allocator peaks of DEFLATE and JPEG reconstruction forward and inverse steps versus
  size, megapixels, mode and producer; are archive DecodeRequirements upper bounds on measured decode
  memory; which default ceilings admit the most benign archives without admitting over-ceiling decodes;
  does the planner fall back or fail at validation bounds; and does hostile CPU work scale linearly?
hypothesis: >
  protocol.md section 3 (H1-H6): JPEG and DEFLATE declarations understate decode memory for some accepted
  archives; JPEG forward peak at least twice inverse peak at 12 MP and above; at least one benign case fails
  pack instead of falling back; failed raw-DEFLATE attempt CPU scales linearly; a 128 MiB ceiling refuses
  at least 10 percent of balanced archives that would decode within it.
decision_ids: [DEC-CMP-016, DEC-CON-004, DEC-CON-005, DEC-CMP-037, DEC-CMP-026, DEC-CMP-018, DEC-CMP-012]
notes: >
  NEEDS_TOOLING (counting allocator, ebr-recon probe subcommands, case generator, cgroup wrapper). Items are
  the generated S-RESOURCE cases plus EXP-RECON-004 tuning archives (combined manifest). Cells that do not
  apply to an item print payload.applicable = false.


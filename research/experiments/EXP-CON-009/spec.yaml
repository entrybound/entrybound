# EXP-CON-009 spec.yaml. Pre-registered design (Phase C-design, container domain).
# BLOCKED (PLATFORM_BLOCKED: native ARM64, 2 GiB and 4 GiB devices). Paths are placeholders for the future host; QEMU arm64 is not a substitute for memory or timing.
# Conventions: research/experiments/_index/container-conventions.md. Do not run before gate G-A;
# runs before G-B are NOT_DECISION_GRADE. Tuning split only; validation looks are derived (CT-4).
schema: ebr.spec.v1
experiment_id: EXP-CON-009
status: blocked-platform
question: On native ARM64 devices with 2 and 4 GiB RAM, do default decoder ceilings prevent memory exhaustion
  while opening and extracting default-profile archives, and how do metadata open latency and parser memory
  scale there?
hypothesis: 'H1: under c8m_384m_sq no default-profile tuning archive is OOM-killed on a 4 GiB device,
  at least one v6 JPEG-region archive is OOM-killed or refused on a 2 GiB device, and open latency ratios
  versus x86-64 are stable across entry-count strata. BLOCKED: no native ARM64 hardware (PLATFORM_BLOCKED).'
decision_ids:
- DEC-CON-005
- DEC-CON-018
- DEC-CON-015

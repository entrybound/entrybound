schema: ebr.spec.v1
experiment_id: EXP-CHUNK-011
status: pre-registration-draft (gate G-A pending); READY with the production CLI and harness ebr-pack
question: >
  Does every production producer of chunked archives (pack, current-v6 replan via repack
  --profile, boundary-retaining repack, tar import via convert, encrypted pack) record
  the frozen chunker_id grammar for the algorithm and parameters it used, and does
  identical input chunked identically yield identical chunker_id and PCR across
  producers?
hypothesis: >
  H1 (from DEC-MOD-008, results-visible feasibility smoke disclosed in protocol.md): repack
  --profile (replan) records a non-frozen identifier (entrybound/gear-cdc-v1/...) for
  gear-norm-v1 boundaries, so PCR differs from a direct pack of the same profile while LAI
  is equal; pack, retain, convert and encrypted pack record the frozen grammars. Falsified
  if replan records gear-norm-v1/min-/target-/max- with equal PCR on every applicable item.
decision_ids: [DEC-MOD-008, DEC-CMP-005, DEC-MOD-039]


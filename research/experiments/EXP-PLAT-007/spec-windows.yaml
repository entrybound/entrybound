schema: ebr.spec.v1
experiment_id: EXP-PLAT-007
status: pre-registration-draft
question: What ownership facts does NTFS capture expose without elevation, and what happens when they
  are restored on Linux?
hypothesis: Owner/group SIDs are observable; status quo records no ownership on Windows and restores none
  on Linux.
decision_ids:
- DEC-PLT-032
- DEC-MOD-028
- DEC-PLT-007
candidates:
- name: eb-ntfs-capture-wsl-restore
  params:
    mode: crossos
command: '& D:/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-007/scripts/sid_capture.ps1
  -Mode {mode} -FixtureFrom {item_id} -Scratch {scratch}'
shell: pwsh

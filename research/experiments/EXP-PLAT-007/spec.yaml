# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-007
status: pre-registration-draft
question: How stable are ids and names across namespaces, idmapped mounts and account databases, and which
  ownership restore policy restores the intended owner without unsafe defaults?
hypothesis: Names survive account-database changes but not namespace shifts; map-by-name beats numeric
  across databases; numeric restore with setuid has an unsafe case.
decision_ids:
- DEC-PLT-032
- DEC-MOD-028
- DEC-PLT-007
candidates:
- name: eb-ignore
  params:
    system: eb
    policy: ignore
- name: eb-restore-owner-numeric
  params:
    system: eb
    policy: restore
- name: gnutar-names-default
  params:
    system: gnutar
    policy: names
- name: gnutar-numeric-owner
  params:
    system: gnutar
    policy: numeric
- name: gnutar-no-same-owner
  params:
    system: gnutar
    policy: none
- name: bsdtar-default
  params:
    system: bsdtar
    policy: names
- name: bsdtar-numeric-owner
  params:
    system: bsdtar
    policy: numeric
- name: py312-tar-filter
  params:
    system: py312
    policy: tar
- name: py312-data-filter
  params:
    system: py312
    policy: data
command: bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-007/scripts/ownership_scenarios.sh
  --system {system} --policy {policy} --item {item_path} --item-id {item_id} --scratch {scratch} --detail-dir

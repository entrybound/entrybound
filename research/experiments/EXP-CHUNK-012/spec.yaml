  - {name: stress_mismatches, source: stdout_json, key: payload.stress_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: files_checked, source: stdout_json, key: payload.files_checked, family: other, direction: none, unit: count}
  - {name: boundary_set_sha256, source: stdout_json, key: payload.whole_buffer_boundary_set_sha256, family: correctness, kind: string}
  - {name: result_sha256, source: stdout_json, key: payload.result_sha256, family: correctness, kind: string}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 2
warmups: 0
seeds: {order: 2026091821, bootstrap: 2026091822, command: 2026091823}
timing: false

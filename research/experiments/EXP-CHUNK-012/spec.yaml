schema: ebr.spec.v1
experiment_id: EXP-CHUNK-012
status: pre-registration-draft; NEEDS_TOOLING (ebr-chunk stream-identity, vectors, chunker-id-parse, cleanroom session, PCR census); arm S spec (streaming boundary identity)
question: >
  Are chunk boundaries of the status-quo and candidate chunkers a pure function of the
  plaintext and declared parameters, independent of how the input is streamed (buffer
  splits), of the host (Windows/WSL) and of the implementation (clean-room reader from
  the written specification), and what do chunker_id grammar validation and PCR binding
  alternatives cost and break?
hypothesis: >
  Arm S (binary): for every candidate and item, boundaries computed by an incremental
  chunker fed seeded random buffer splits (1 B to 64 MiB) equal whole-buffer boundaries in
  64 of 64 splits per item and in a 20-repetition stress cell; any difference is an HC-13
  violation artifact. Other arms' hypotheses in protocol.md section 3.
decision_ids: [DEC-CMP-005, DEC-CMP-001, DEC-MOD-039, DEC-ACC-029, DEC-CRY-023]

candidates:
  - name: gear-norm-v1-fast
    params: {algo: gear-norm-v1, mode: none, sizes: 'frozen:fast'}
  - name: gear-norm-v1-balanced
    params: {algo: gear-norm-v1, mode: none, sizes: 'frozen:balanced'}
  - name: gear-norm-v1-dense
    params: {algo: gear-norm-v1, mode: none, sizes: 'frozen:dense'}
  - name: gear-norm-v1-extreme
    params: {algo: gear-norm-v1, mode: none, sizes: 'frozen:extreme'}
  - name: secret-gear-table-balanced
    params: {algo: gear-norm-v1, mode: secret-gear-table, sizes: 'frozen:balanced'}
  - name: phte-aes128-balanced
    params: {algo: gear-norm-v1, mode: phte-aes128, sizes: 'frozen:balanced'}
  - name: gear-spread-nc2-balanced
    params: {algo: gear-spread, mode: none, sizes: 'frozen:balanced'}
  - name: fastcdc-2016-nc2-balanced
    params: {algo: fastcdc-2016, mode: none, sizes: 'frozen:balanced'}
command: >-
  /root/eb-research/target/exp-chunk/release/ebr-chunk stream-identity
  --item-path {item_path} --experiment-id EXP-CHUNK-012 --env-name wsl-ubuntu
  --algorithm {algo} --boundary-mode {mode} --key-seed-base 20260917 --size-set {sizes}
  --splits 64 --split-seed 20260917 --min-split-bytes 1 --max-split-bytes 67108864 --stress-repetitions 20
  --split-prefix-bytes 67108864
  --violation-dir /root/eb-research/results/EXP-CHUNK-012/violations/{candidate}/{item_id}
shell: bash


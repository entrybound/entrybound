# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-019
status: pre-registration-draft
question: How large do fidelity reports grow under per-entry failures per schema candidate, and do readers
  fail closed on injected unknown or noncanonical platform metadata?
hypothesis: Status quo reports are constant-size; bounded-scope candidates grow linearly to their cap;
  at least one noncanonical case is accepted as OK.
decision_ids:
- DEC-PLT-015
- DEC-PLT-013
- DEC-MOD-009
- DEC-PLT-025
- DEC-PLT-038
- DEC-MOD-044
- DEC-PLT-036
- DEC-MOD-002
- DEC-PLT-022
candidates:
- name: report-size-statusquo-and-models
  params:
    arm: size
- name: failclosed-injection
  params:
    arm: failclosed
command: bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-019/scripts/report_arms.sh
  --arm {arm} --from {item_id} --scratch {scratch} --detail-dir /mnt/d/Projects/entrybound/entrybound/research/raw/EXP-PLAT-019/detail
shell: bash
corpus:
  generated:
  - item_id: plat019-trees-tuning
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260917
  - item_id: plat019-trees-validation
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260918
metrics:
- name: metadata_bytes
  source: stdout_json
  key: payload.metadata_bytes
  family: size
  direction: minimize
  unit: B
- name: metadata_bytes_per_entry
  source: stdout_json
  key: payload.metadata_bytes_per_entry
  family: size
  direction: minimize
  unit: B/entry
- name: reason_code_specificity_fraction
  source: stdout_json
  key: payload.reason_code_specificity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: hc04_fail_open_outcomes
  source: stdout_json
  key: payload.hc04_fail_open_outcomes
  family: correctness
  direction: minimize
  unit: count
- name: noncanonical_accepted
  source: stdout_json
  key: payload.noncanonical_accepted
  family: other
  direction: none
- name: observation_sha256
  source: stdout_json
  key: payload.observation_sha256
  family: correctness
  kind: string
repetitions: 2
warmups: 0
record_warmups: true
seeds:
  order: 20260917
  bootstrap: 20260917
  command: 20260917
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os:
  - linux
  arch:
  - x86_64
  emulated: false
  requires:
  - /root/eb-research/target/production/release/ebound
  - /root/eb-research/target/harness/release/ebr-pack
  - /root/eb-research/target/harness/release/ebr-forge
  - mkfs.vfat
  - ntfs-3g
  timeout_s: 7200
  scratch_root: /root/eb-research/scratch/platform
analysis:
  baseline: report-size-statusquo-and-models
  pairing: item
  report_metrics:
  - metadata_bytes
  - metadata_bytes_per_entry
  - reason_code_specificity_fraction
  - hc04_fail_open_outcomes
  - noncanonical_accepted

schema: ebr.spec.v1
experiment_id: EXP-SCALE-006
status: design-draft
notes: >
  Design draft until gate G-A (decision-method.md section 0.4); NEEDS_TOOLING: the binaries named in requires are built by the tooling listed in protocol.md. Items are cell descriptors (1-byte generated placeholders); the probe reads cell parameters from cells.json by item id.
question: >
  Which bounded-memory claims of status-quo readers hold under the exact allocator oracle at 1-64 GiB and up to 10M entries, and how do readers behave on adversarial and undeclared-budget archives?
hypothesis: >
  STREAM verify/unpack are bounded on the bytes axis but grow with entries; INDEXED verify/list/unpack are not bounded; every lying or over-policy case is refused within R0_max + H. One exceedance or unrefused lie falsifies.
decision_ids: [DEC-ACC-005, DEC-ACC-028, DEC-ACC-036, DEC-ACC-052, DEC-ACC-057, DEC-ACC-060, DEC-ACC-062, DEC-CMP-017]

candidates:
  - {name: stream-verify}
  - {name: stream-unpack}
  - {name: stream-list}
  - {name: stream-verify-posix}
  - {name: indexed-verify}
  - {name: indexed-list}
  - {name: indexed-read-one}
  - {name: indexed-unpack}
  - {name: inspect-indexed}
  - {name: pack-dense-dedup-index}
  - {name: r0-minimal}
command: >-
  /root/eb-research/target/scale-alloc/release/ebr-access --mode alloc-probe --operation {candidate}
  --cell {item_id} --cells /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-SCALE-006/cells.json
  --isolate true --seed {seed} --scratch {scratch} --experiment-id EXP-SCALE-006 --env-name wsl-ubuntu
shell: bash


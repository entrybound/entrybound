schema: ebr.spec.v1
experiment_id: EXP-PLANNER-004
status: design
question: >
  Holding the search strategy at the status quo, which candidate table (arm A),
  transform gate (B), gain-margin rule (C), dictionary acceptance rule (D) and
  region/cohort conflict rule (E) yields the smallest materialized
  artifact_bytes per profile within the Appendix B.1 guards? Arm F (external
  codec modelled screen) is an offline replay over EXP-PLANNER-002 traces and
  has no runner cells here.
hypothesis: >
  See research/experiments/EXP-PLANNER-004/protocol.md section 2 (A1-F1).
  Arm E variants must be byte-identical to the status quo on sub-items without
  JPEG objects (isolation check).
decision_ids: [DEC-CMP-034, DEC-CMP-012, DEC-CMP-030, DEC-CMP-020, DEC-CMP-039, DEC-CMP-009]


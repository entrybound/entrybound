schema: ebr.spec.v1
experiment_id: EXP-CODEC-004-adversarial
status: pre-registration-draft (gate G-A pending)
notes: 'Generated by make_specs.py. MVT-06(d) series: adversarial-v1 generated inputs at 2^10..2^20 objects/chunks (seeded; lock file adversarial-v1.lock.json; manifest adversarial-manifest.json with split=generated). In-process thread CPU per point, 3 runs per point. HC test (binary), not a banded comparison.'
question: 'Does any transform applicability rule spend super-linear CPU per input byte, or unbounded trial encodes, on inputs crafted to be mis-categorised (spoofed executable or tensor headers, probe-passing noise)?'
hypothesis: 'Every rule''s fitted ln(CPU) on ln(elements) slope has a 0.99 interval lower bound at or below 1 + 0.15 and CPU per byte within the rule''s declared per-byte bound (objective MVT-06(d)); spoofed headers cost at most the trials the rule declares for their category.'
decision_ids: [DEC-CMP-043]
candidates:
  - name: adv-frozen-probe
    params: {rule: frozen-probe}
  - name: adv-architecture-signature
    params: {rule: architecture-signature}
  - name: adv-dtype-signature
    params: {rule: dtype-signature}
command: >-
  /root/eb-research/target/harness/release/ebr-codec applicability-cost --item-path {item_path} --experiment-id EXP-CODEC-004-adversarial
  --env-name wsl-ubuntu --rule {rule} --applicability-rules /root/eb-research/stage/EXP-CODEC-004/repo/research/experiments/EXP-CODEC-004/configs/applicability.json --profile extreme --summary-stdout
shell: bash
corpus:
  manifest: research/experiments/EXP-CODEC-004/adversarial-manifest.json
  splits: [generated]
metrics:
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}
  - {name: elements, source: stdout_json, key: payload.elements, family: other, direction: none, unit: count}
  - {name: rule_cpu_s, source: stdout_json, key: payload.rule_cpu_s, family: time_cpu, direction: minimize, unit: s}
  - {name: trial_encodes, source: stdout_json, key: payload.trial_encodes, family: other, direction: minimize, unit: count}
  - {name: cpu_per_byte_bound_exceeded, source: stdout_json, key: payload.cpu_per_byte_bound_exceeded, family: correctness, direction: minimize, unit: bool}
repetitions: 3
warmups: 0
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: true
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  cpu_affinity: [2]
  requires: [/root/eb-research/target/harness/release/ebr-codec, /root/eb-research/target/harness/release/ebr-planner]
  timeout_s: 7200
guard:
  max_loadavg_1m: 2.0
  max_other_cpu_percent: 3.0
  max_wait_s: 300
analysis:
  pairing: item
  report_metrics: [rule_cpu_s, trial_encodes, cpu_per_byte_bound_exceeded]

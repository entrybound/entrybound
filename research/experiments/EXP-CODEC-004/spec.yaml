  --plan-record-model /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-CODEC-001/configs/plan-record-model.json
  --selection-rule production-v4 --reconcile-expressible true
  --matrix-cache /root/eb-research/cache/EXP-CODEC-004/stageB/{item_id}-{profile}-r{rep}.jsonl.gz
  --detail-out /root/eb-research/raw-detail/EXP-CODEC-004/stageB/{item_id}/{candidate}-r{rep}.jsonl.gz --summary-stdout

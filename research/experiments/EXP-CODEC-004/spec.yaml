command: >-
  /root/eb-research/target/harness/release/ebr-planner portfolio --item-path {item_path} --experiment-id EXP-CODEC-004
  --env-name wsl-ubuntu --profile {profile} --portfolio B_SQ --transform-set {tset} --applicability {applicability}
  --transform-universe /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-CODEC-004/configs/transform-universe-stageB.json --applicability-rules /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-CODEC-004/configs/applicability.json

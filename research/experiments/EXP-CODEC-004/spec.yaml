  - {name: artifact_bytes, source: stdout_json, key: payload.artifact_bytes, family: size, direction: minimize, unit: B}
  - {name: artifact_bytes_is_exact, source: stdout_json, key: payload.artifact_bytes_is_exact, family: correctness, direction: none, unit: bool}
  - {name: pcm_reconciliation_mismatches, source: stdout_json, key: payload.pcm_reconciliation_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: trial_encodes, source: stdout_json, key: payload.trial_encodes, family: other, direction: minimize, unit: count}
  - {name: unselected_trials, source: stdout_json, key: payload.unselected_trials, family: other, direction: minimize, unit: count}
  - {name: selection_loss_bytes, source: stdout_json, key: payload.selection_loss_bytes, family: size, direction: minimize, unit: B}
  - {name: missed_saving_bytes, source: stdout_json, key: payload.missed_saving_bytes, family: size, direction: minimize, unit: B}
  - {name: applicability_false_negative_plaintext_bytes, source: stdout_json, key: payload.applicability_confusion.fn_bytes, family: size, direction: minimize, unit: B}
  - {name: applicability_false_positive_plaintext_bytes, source: stdout_json, key: payload.applicability_confusion.fp_bytes, family: size, direction: minimize, unit: B}
  - {name: roundtrip_mismatches, source: stdout_json, key: payload.roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: applicability_digest_sha256, source: stdout_json, key: payload.applicability_digest_sha256, family: correctness, kind: string}
  - {name: portfolio_digest_sha256, source: stdout_json, key: payload.portfolio_digest_sha256, family: correctness, kind: string}
  - {name: ratio, source: derived, op: ratio, args: [artifact_bytes, input_bytes], family: size, direction: minimize}

schema: ebr.spec.v1
experiment_id: EXP-CODEC-004-screen
status: pre-registration-draft (gate G-A pending)
notes: 'Generated by make_specs.py. Stage A, exploratory. transform-matrix is TOOLING (protocol 7.1).'
question: 'Ahead of the Stage A reference codecs, which transform configurations of configs/transform-universe.json reduce stored bytes on production chunks of an object-preserving 64 MiB sample of every tuning item?'
hypothesis: 'Screen only (protocol 12.1). Controls: delta-distance(1) equals delta8/v1 and byte-plane-split(2,4,8) equals byte-shuffle/v1 byte for byte; every transform round-trips.'
decision_ids: [DEC-CMP-043]
candidates:
  - name: tscreen-dense
    params: {profile: dense}
  - name: tscreen-extreme
    params: {profile: extreme}
command: >-
  /root/eb-research/target/harness/release/ebr-codec transform-matrix --item-path {item_path} --experiment-id EXP-CODEC-004-screen
  --env-name wsl-ubuntu --profile {profile} --production-chunking object
  --universe /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-CODEC-004/configs/transform-universe.json --codecs stage_a
  --chunk-sample-bytes 67108864 --chunk-sample-seed 20260917 --record-applicability-inputs true
  --detail-out /root/eb-research/raw-detail/EXP-CODEC-004/stageA/{item_id}/{candidate}-r{rep}.jsonl.gz --summary-stdout
shell: bash
corpus:
  manifest: research/corpus/manifest.json
  splits: [tuning]
metrics:
  - {name: sampled_plaintext_bytes, source: stdout_json, key: payload.sampled_plaintext_bytes, family: size, direction: none, unit: B}
  - {name: roundtrip_mismatches, source: stdout_json, key: payload.roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: identity_control_mismatches, source: stdout_json, key: payload.identity_control_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: matrix_digest_sha256, source: stdout_json, key: payload.matrix_digest_sha256, family: correctness, kind: string}
  - {name: detail_sha256, source: stdout_json, key: payload.detail_sha256, family: correctness, kind: string}
  - {name: max_rss_bytes, source: resource, family: memory_peak, direction: minimize, unit: B}
repetitions: 2
warmups: 0
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/harness/release/ebr-codec, /root/eb-research/target/harness/release/ebr-planner]
  timeout_s: 21600
analysis:
  pairing: item
  report_metrics: [roundtrip_mismatches, identity_control_mismatches]

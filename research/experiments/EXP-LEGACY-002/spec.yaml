schema: ebr.spec.v1
experiment_id: EXP-LEGACY-002
status: designed
question: >
  How do pinned tar implementations (GNU tar, libarchive, Python tarfile, Go, Rust crates, busybox, star, 7-Zip,
  .NET, Node, Commons Compress) and Entrybound tar-strict/v1 treat pre-registered tar constructions and
  tuning/validation tar archives, and where do they diverge?
hypothesis: >
  H1 the tools/tar-strict cases reproduce and GNU tar accepts all but bad-checksum; H2 tar-strict/v1 refuses or
  records every ambiguous case; H3 EB-T007 is unambiguous and EB-T012 ambiguous across reference readers; H4 a pax
  size desync case produces content divergence; H5 GNU sparse variants diverge outside GNU tar/libarchive; H6 './a'
  and 'a' extract to one destination everywhere; H7 Python, Go and .NET diverge on at least two legacy dialects.
decision_ids: [DEC-ECO-047, DEC-LEG-001, DEC-LEG-020, DEC-LEG-061, DEC-LEG-062, DEC-LEG-063, DEC-LEG-064,
  DEC-LEG-065, DEC-LEG-066, DEC-LEG-067, DEC-LEG-069, DEC-PLT-010, DEC-PLT-021, DEC-PLT-051]
notes: >
  Design pre-registration. Not runnable until gate G-A and the tooling in protocol.md section 7 exist. run_matrix.py
  dispatches runtime ids of the form ebound:<build>:<mode> to ebound_import.py.
cwd: /mnt/d/Projects/entrybound/entrybound
shell: bash
env:
  PYTHONPATH: research/tools
  EB_LEGACY_LOCK: research/experiments/_legacy/runtime-lock.json

command: >-
  /root/eb-research/venv/bin/python research/tools/legacy/run_matrix.py
  --experiment EXP-LEGACY-002 --format tar --runtime {runtime_id}
  --case-set {item_path} --item-id {item_id} --split {split} --rep {rep} --seed {seed}
  --scratch {scratch} --artifacts-root /root/eb-research/raw-artifacts/EXP-LEGACY-002
  --sandbox bwrap --ops list,read,extract

candidates:
  - {name: gnu-tar-1.35-linux, params: {runtime_id: gnu-tar-1.35-linux}}
  - {name: gnu-tar-1.34-linux, params: {runtime_id: gnu-tar-1.34-linux}}
  - {name: libarchive-3.8.8-win, params: {runtime_id: libarchive-3.8.8-win}}
  - {name: libarchive-3.8.8-linux, params: {runtime_id: libarchive-3.8.8-linux}}
  - {name: libarchive-3.7.2-linux, params: {runtime_id: libarchive-3.7.2-linux}}
  - {name: python-tarfile-3.13.5-win-data, params: {runtime_id: "python-tarfile-3.13.5-win:filter=data"}}
  - {name: python-tarfile-3.13.5-win-fully-trusted, params: {runtime_id: "python-tarfile-3.13.5-win:filter=fully_trusted"}}
  - {name: python-tarfile-3.12.3-linux, params: {runtime_id: "python-tarfile-3.12.3-linux:filter=data"}}
  - {name: python-tarfile-3.14-linux, params: {runtime_id: "python-tarfile-3.14-linux:filter=data"}}
  - {name: go-archive-1.22.2-linux, params: {runtime_id: go-archive-1.22.2-linux}}
  - {name: go-archive-latest-linux, params: {runtime_id: go-archive-latest-linux}}
  - {name: rust-tar-0.4, params: {runtime_id: "rust-zip2-tar-crates:tar"}}
  - {name: rust-async-tar-prefix, params: {runtime_id: "rust-zip2-tar-crates:astral-tokio-tar-prefix"}}
  - {name: rust-async-tar-postfix, params: {runtime_id: "rust-zip2-tar-crates:astral-tokio-tar-postfix"}}
  - {name: busybox-tar-linux, params: {runtime_id: busybox-tar-linux}}
  - {name: star-schily-linux, params: {runtime_id: star-schily-linux}}
  - {name: 7zip-23.01-linux, params: {runtime_id: 7zip-23.01-linux}}
  - {name: dotnet-9-linux, params: {runtime_id: dotnet-9-linux}}
  - {name: dotnet-10-win, params: {runtime_id: dotnet-10-win}}
  - {name: node-tar, params: {runtime_id: "node-yauzl-tar:tar"}}
  - {name: commons-compress-1.28.0, params: {runtime_id: commons-compress-1.28.0}}
  - {name: ebound-strict, params: {runtime_id: "ebound:legacy-head:strict"}}
  - {name: ebound-baseline-strict, params: {runtime_id: "ebound:legacy-baseline:strict"}}

corpus:
  manifest: research/experiments/EXP-LEGACY-002/cases-manifest.jsonl
  splits: [tuning, validation]

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: none, unit: s}
  - {name: cases_total, source: stdout_json, key: payload.cases_total, family: other, direction: none, unit: count}
  - {name: cases_accepted, source: stdout_json, key: payload.cases_accepted, family: other, direction: none, unit: count}
  - {name: cases_refused_or_error, source: stdout_json, key: payload.cases_refused_or_error, family: other, direction: none, unit: count}
  - {name: escape_attempts, source: stdout_json, key: payload.escape_attempts, family: correctness, direction: minimize, unit: count}
  - {name: runtime_lock_ok, source: stdout_json, key: payload.runtime_lock_ok, family: correctness, direction: maximize}
  - {name: observations_sha256, source: stdout_json, key: payload.observations_sha256, family: correctness, kind: string}

repetitions: 2
warmups: 0
seeds: {order: 2509170211, bootstrap: 2509170212, command: 2509170213}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires:
    - /root/eb-research/venv/bin/python
    - /usr/bin/bwrap
    - /root/eb-research/target/legacy-head/release/ebound
    - /mnt/c/Windows/System32/tar.exe
  timeout_s: 7200

analysis:
  baseline: gnu-tar-1.35-linux
  pairing: item
  report_metrics: [cases_accepted, cases_refused_or_error, escape_attempts]

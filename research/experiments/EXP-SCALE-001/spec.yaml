schema: ebr.spec.v1
experiment_id: EXP-SCALE-001
status: design-draft
notes: >
  Stage 1 of the native operation memory/scratch scaling inventory. Design draft until gate
  G-A (decision-method.md section 0.4); see protocol.md. Each sample is one operation on one
  generated cell under a cgroup-v1 memory cap; the driver prints one ebr.scale.cell.v1 line.
  Stage 2 (64 GiB tier) is spec-stage2.yaml, generated by select_stage2.py and committed
  before it runs.
question: >
  How do peak RSS, scratch writes and completion under a memory cap scale with total
  plaintext, single-entry size, entry count, sparse logical size and duplicate content for
  each native unencrypted Entrybound CLI operation?
hypothesis: >
  Every pack variant is plaintext-proportional; INDEXED readers and repack are
  archive-proportional; STREAM verify/list are metadata-proportional; STREAM unpack is
  bounded in resident memory with plaintext-proportional scratch. Falsified per operation
  when the pre-registered classification rule assigns a different class.
decision_ids: [DEC-ACC-028, DEC-ACC-005, DEC-ACC-029, DEC-ACC-020, DEC-ACC-058, DEC-ACC-062, DEC-ACC-060, DEC-ACC-048, DEC-ACC-004, DEC-ACC-059, DEC-ACC-022, DEC-ACC-052, DEC-ACC-002, DEC-INT-043, DEC-CON-015, DEC-CON-018, DEC-CMP-017, DEC-CMP-041, DEC-MOD-004, DEC-MOD-026]

candidates:
  - {name: pack-indexed-fast}
  - {name: pack-indexed-balanced}
  - {name: pack-indexed-dense}
  - {name: pack-indexed-extreme}
  - {name: pack-stream-file}
  - {name: pack-stream-stdout}
  - {name: pack-stream-stdout-window0}
  - {name: pack-indexed-stdout}
  - {name: unpack-indexed}
  - {name: unpack-stream-file}
  - {name: unpack-stream-stdin}
  - {name: verify-indexed}
  - {name: verify-stream-stdin}
  - {name: list-indexed}
  - {name: list-stream-stdin}
  - {name: inspect-indexed}
  - {name: explain-indexed}
  - {name: read-entry-indexed}
  - {name: repack-representation}
  - {name: repack-replan-fast}
  - {name: repack-to-stream}
  - {name: repack-to-indexed}
  - {name: sign-detached-indexed}
  - {name: inc-tar-zstd-create}
  - {name: inc-tar-zstd-extract}
command: >-
  /root/eb-research/venv/bin/python /mnt/d/Projects/entrybound/entrybound/research/tools/scale/scale_cell.py
  --experiment EXP-SCALE-001
  --cells /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-SCALE-001/cells.json
  --cell {item_id} --op {candidate} --rep {rep} --seed {seed} --scratch {scratch}
shell: bash

corpus:
  manifest: research/experiments/EXP-SCALE-001/cells.jsonl
  splits: [synthetic]

metrics:
  - {name: applicable, source: stdout_json, key: payload.applicable, family: correctness, direction: none}
  - {name: outcome, source: stdout_json, key: payload.outcome, family: correctness, kind: string}
  - {name: reason_code, source: stdout_json, key: payload.reason_code, family: correctness, kind: string}
  - {name: oom_kill, source: stdout_json, key: payload.oom_kill, family: correctness, direction: none, unit: count}
  - {name: peak_rss_bytes, source: stdout_json, key: payload.peak_rss_bytes, family: memory_peak, direction: minimize, unit: B}
  - {name: cgroup_max_usage_bytes, source: stdout_json, key: payload.cgroup_max_usage_bytes, family: memory_peak, direction: none, unit: B}
  - {name: scratch_write_bytes, source: stdout_json, key: payload.scratch_write_bytes, family: correctness, direction: none, unit: B}
  - {name: dest_write_bytes, source: stdout_json, key: payload.dest_write_bytes, family: io, direction: none, unit: B}
  - {name: scratch_leftover_bytes, source: stdout_json, key: payload.scratch_leftover_bytes, family: scratch_peak, direction: none, unit: B}
  - {name: roundtrip_ok, source: stdout_json, key: payload.roundtrip_ok, family: correctness, direction: none}
  - {name: output_sha256, source: stdout_json, key: payload.output_sha256, family: correctness, kind: string}
  - {name: lai, source: stdout_json, key: payload.lai, family: correctness, kind: string}
  - {name: pcr, source: stdout_json, key: payload.pcr, family: correctness, kind: string}
  - {name: aux, source: stdout_json, key: payload.aux, family: correctness, kind: string}
  - {name: pci, source: stdout_json, key: payload.pci, family: correctness, kind: string}
  - {name: input_logical_bytes, source: stdout_json, key: payload.input_logical_bytes, family: size, direction: none, unit: B}
  - {name: input_files, source: stdout_json, key: payload.input_files, family: size, direction: none, unit: count}
  - {name: archive_bytes, source: stdout_json, key: payload.archive_bytes, family: size, direction: none, unit: B}
  - {name: op_wall_s, source: stdout_json, key: payload.op_wall_s, family: time_wall, direction: none, unit: s}
  - {name: op_cpu_s, source: stdout_json, key: payload.op_cpu_s, family: time_cpu, direction: none, unit: s}

repetitions: 3
warmups: 0
seeds: {order: 1301001, bootstrap: 1301002, command: 1301003}
timing: false
order: randomized_blocks
raw_compression: gzip
record_warmups: true

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 4
  requires:
    - /root/eb-research/target/scale-prod/release/ebound
    - /root/eb-research/venv/bin/python
    - /usr/bin/time
    - zstd
    - tar
  poll_interval_s: 1.0
  timeout_s: 21600

analysis:
  pairing: item_repetition
  report_metrics: [peak_rss_bytes, scratch_write_bytes, oom_kill, op_wall_s]

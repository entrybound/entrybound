schema: ebr.spec.v1
experiment_id: EXP-SCALE-010
status: design-draft
notes: >
  Design draft until gate G-A (decision-method.md section 0.4); NEEDS_TOOLING: the binaries named in requires are built by the tooling listed in protocol.md. Memory and outcome phase; the timing phase (KDF and unlock times) is spec-timing.yaml, generated before it runs.
question: >
  How do encrypted operations and key mutations scale in memory, are crypto-v1 resource ceilings safe on constrained hosts, and what do bounded encrypted prototypes change?
hypothesis: >
  Encrypted pack/open/verify/unpack are plaintext-proportional; key add is size-independent while remove and change-password are plaintext-proportional; over-ceiling KDF archives are refused with zero Argon2id invocations; streamed segment writing is M08.3-bounded and passes the vector gate.
decision_ids: [DEC-ACC-009, DEC-ACC-011, DEC-ACC-028, DEC-CON-009, DEC-CRY-013, DEC-CRY-050, DEC-CRY-069]

candidates:
  - {name: sq-pack-password}

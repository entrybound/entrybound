schema: ebr.spec.v1
experiment_id: EXP-ECO-016
status: design
question: >
  With default options, which pre-registered dangerous restorations, trust decisions, overwrites and
  confidentiality downgrades does each tool perform (unsafe_defaults, HC-05)? (protocol.md sections 1, 5)
hypothesis: >
  H1 the status quo has unsafe_defaults greater than 0 (expected in setuid restoration as root, signature key
  authorization and keyless verify exit status); H2 Python tarfile with the data filter has no more unsafe
  defaults than the status quo on extraction scenarios; H3 the status quo never overwrites by default.
  Falsification in protocol.md section 2.
notes: >
  Design-stage spec. Items are scenario fixture directories DS01-DS27 listed in the ad-hoc manifest written by
  fixtures.py (split tuning, family = scenario group); run_tool.py runs each tool's minimal default command
  twice, as root and as uid 65534 via setpriv, and prints per-user outcomes. Inapplicable pairs print
  applicable=0. Windows scenarios DS17-DS18 use spec-windows.yaml generated by make_specs.py.
decision_ids: [DEC-PLT-007, DEC-PLT-043, DEC-PLT-001, DEC-PLT-009, DEC-PLT-012, DEC-INT-004, DEC-CRY-082, DEC-CRY-061, DEC-CRY-019, DEC-CRY-058, DEC-INT-021, DEC-ECO-023]
candidates:
  - name: ebound-dev-head
    params: {tool: ebound-head}
  - name: ebound-ref-9e44608
    params: {tool: ebound-ref}
  - name: gnu-tar-1.35
    params: {tool: gnutar}
  - name: bsdtar-3.7.2
    params: {tool: bsdtar}
  - name: python312-tarfile-data
    params: {tool: py312-data}
  - name: python312-tarfile-tar
    params: {tool: py312-tar}
  - name: python312-tarfile-fully-trusted
    params: {tool: py312-trusted}
  - name: python314-tarfile-default
    params: {tool: py314-default}
  - name: infozip-unzip-6.0
    params: {tool: unzip}
  - name: sevenzip-23.01
    params: {tool: sevenzip}
  - name: node-tar
    params: {tool: node-tar}
  - name: dotnet-formats
    params: {tool: dotnet}
  - name: age
    params: {tool: age}
  - name: gpg
    params: {tool: gpg}
  - name: minisign
    params: {tool: minisign}
  - name: ssh-keygen-sign
    params: {tool: ssh-keygen}
  - name: cosign-verify-blob
    params: {tool: cosign}
command: >-
  /root/eb-research/venv/bin/python
  /mnt/d/Projects/entrybound/entrybound/research/tools/ecosystem/safety/run_tool.py
  --tool {tool} --scenario-dir {item_path} --scenario {item_id} --users root,nobody --scratch {scratch}
shell: bash
corpus:
  splits: [tuning]
  manifest: /root/eb-research/cache/eco016/scenarios-manifest.jsonl
metrics:
  - {name: applicable, source: stdout_json, key: applicable, family: other, direction: none, unit: bool}
  - {name: unsafe_default_root, source: stdout_json, key: unsafe_default_root, family: correctness, direction: minimize, unit: bool}
  - {name: unsafe_default_nobody, source: stdout_json, key: unsafe_default_nobody, family: correctness, direction: minimize, unit: bool}
  - {name: refused, source: stdout_json, key: refused, family: other, direction: none, unit: bool}
  - {name: refusal_actionable, source: stdout_json, key: refusal_actionable, family: other, direction: maximize, unit: bool}
  - {name: canary_changes, source: stdout_json, key: canary_changes, family: correctness, direction: minimize, unit: count}
  - {name: exit_status, source: stdout_json, key: exit_status, family: other, direction: none, unit: code}
  - {name: outcome_sha256, source: stdout_json, key: outcome_sha256, family: correctness, kind: string}
repetitions: 2
warmups: 0
seeds: {order: 2026091716, bootstrap: 2026091716, command: 2026091716}
timing: false
order: randomized_blocks
raw_compression: none
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [setpriv, getcap, getfattr, getfacl, tar, bsdtar, unzip, 7z, gpg, minisign, ssh-keygen, /root/eb-research/target/eco-head/release/ebound]
  timeout_s: 900
analysis:
  baseline: ebound-dev-head
  pairing: item
  report_metrics: [unsafe_default_root, unsafe_default_nobody, refused, canary_changes]

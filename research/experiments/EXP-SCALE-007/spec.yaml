schema: ebr.spec.v1
experiment_id: EXP-SCALE-007
status: design-draft
notes: >
  Design draft until gate G-A (decision-method.md section 0.4); NEEDS_TOOLING: the binaries named in requires are built by the tooling listed in protocol.md. Phase M (memory and identity). Phase S (spec-size.yaml, tuning corpus) and phase T (spec-timing.yaml, timing: true) are generated from this template before they run.
question: >
  Which creation architectures bound pack, INDEXED writing and STREAM production memory for inputs larger than RAM while keeping output identical to the in-memory reference where claimed?
hypothesis: >
  Streaming CDC with spill and footer-last INDEXED writing are byte-identical to the status quo and M08.3-bounded; windowed planning keeps identities but may change PCI; orphan frames break canonicality. One counterexample falsifies each binary claim.
decision_ids: [DEC-ACC-029, DEC-ACC-020, DEC-ACC-058, DEC-ACC-061, DEC-CON-027, DEC-MOD-004, DEC-ACC-056, DEC-CMP-017, DEC-CMP-041]


schema: ebr.spec.v1
experiment_id: EXP-ECO-002
status: design
question: >
  When a pinned codec or reconstruction dependency moves to another published version or backend,
  which compressed bytes, dictionaries and memory estimates change, and do pinned-arm outputs still
  decode and reconstruct bit-exactly? (protocol.md section 1)
hypothesis: >
  H1 at least one libzstd, flate2-backend or lzma-rust2 arm changes output bytes at fixed parameters;
  H2 preflate-rs 0.7.6 corrections or jixel 0.2.19 payloads fail under at least one other arm;
  H4 lzma-rust2 memory estimates differ across arms. Falsification conditions in protocol.md section 2.
notes: >
  Design-stage spec (Phase C-design). Tuning split only; the validation look uses spec-validation.yaml
  generated by make_arm.sh with the same candidates. Arms pre-registered from
  arms-version-snapshot-2026-09-17.json. Reference plan logs and outputs are produced first by
  research/tools/ecosystem/drift/reference.sh.
decision_ids: [DEC-ECO-051, DEC-CMP-031, DEC-MOD-011, DEC-LEG-008, DEC-CMP-021, DEC-CMP-038, DEC-CON-007, DEC-CMP-007]

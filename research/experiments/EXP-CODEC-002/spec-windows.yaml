schema: ebr.spec.v1
experiment_id: EXP-CODEC-002-windows
status: pre-registration-draft (gate G-A pending; timing gated on decision-method 14 items 3 and 4)
notes: 'Generated by make_specs.py. Minimum candidate set; make_candidates.py appends EXP-CODEC-001/004 survivors before any run. The bench subcommand and backend binaries are TOOLING (protocol 7.2). Windows: st-p affinity {2}; st-e {18} report arm uses the same spec with cpu_affinity [18] and experiment_id suffix -ecore.'
question: 'What in-process encode/decode wall time, CPU time and throughput does each codec, transform and C-reference decoder configuration have on a fixed 8 MiB production-chunk batch per item, under pinned single-thread affinity?'
hypothesis: 'H1a-H1f of protocol.md section 3 (LZ4 decode clears the baseline-codec throughput band versus zstd-1; LZMA2 and PPMd decode are much slower than zstd-19; windows above log 20 are equivalent for independent chunks; structural inverses add under one band unit; C-reference decoders are within two band units and byte-identical). Controls: parity of production versus direct zstd decode, and A/A equivalence of duplicated candidates.'
decision_ids: [DEC-CMP-008, DEC-CMP-009, DEC-CMP-045, DEC-CMP-043, DEC-CMP-007]

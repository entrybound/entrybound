schema: ebr.spec.v1
experiment_id: EXP-SCALE-015
status: design-draft
notes: >
  BLOCKED: requires native Linux arm64 hardware (arch aarch64, not emulated). Written to run unchanged on such a host with the corpus provisioned; the macOS spec is generated by the platform adapter. Design draft until gate G-A.
question: >
  Are pack bytes and identities on native ARM64 Linux identical to x86-64 Linux for tuning and validation small items under the EXP-SCALE-005 variations?
hypothesis: >
  PCI, LAI and PCR are identical to the x86-64 reference for every item and variation; one two-output difference falsifies.
decision_ids: [DEC-MOD-011, DEC-MOD-013, DEC-ACC-031, DEC-CMP-021, DEC-ACC-028, DEC-ACC-033, DEC-ACC-034]

candidates:
  - {name: base-bi}
  - {name: base-di}
  - {name: base-bs}
  - {name: aff1-bi}
  - {name: aff1-di}
  - {name: aff1-bs}
  - {name: aff-all-bi}
  - {name: aff-all-di}
  - {name: aff-all-bs}
  - {name: creation-shuffled-bi}
  - {name: creation-shuffled-di}
  - {name: creation-shuffled-bs}
  - {name: stress20-bi}
  - {name: stress20-di}
command: >-
  /root/eb-research/venv/bin/python /mnt/d/Projects/entrybound/entrybound/research/tools/scale/det_cell.py --item {item_path} --item-id {item_id}
  --candidate {candidate} --rep {rep} --seed {seed} --scratch {scratch} --host linux-arm64-native
shell: bash


schema: ebr.spec.v1
experiment_id: EXP-CODEC-006-large
status: pre-registration-draft (gate G-A pending; timing gated on decision-method 14 items 3 and 4)
notes: 'Generated by make_specs.py. Candidates = (scope, profile). Tier coverage per protocol section 6: this spec lists tuning small+medium items for all profiles; spec-large.yaml (derived mechanically: large tier, fast/balanced candidates only) is committed with it before any run. In-process timer around plan+encode+verification into an in-memory sink.'
question: 'What in-process pack wall and CPU time does each write-time verification scope cost per profile?'
hypothesis: 'H1b of protocol.md section 3: verify-all-chunks is distinguishably slower than status quo at fast/balanced and within one band unit at dense/extreme; verify-all-transformed is equivalent at every profile.'
decision_ids: [DEC-CMP-044, DEC-CMP-043]
candidates:
  - name: status-quo-fast
    params: {scope: 'status-quo', profile: fast}
  - name: status-quo-balanced
    params: {scope: 'status-quo', profile: balanced}
  - name: transformed-fast
    params: {scope: 'transformed', profile: fast}
  - name: transformed-balanced
    params: {scope: 'transformed', profile: balanced}
  - name: all-fast
    params: {scope: 'all', profile: fast}
  - name: all-balanced
    params: {scope: 'all', profile: balanced}
  - name: sampled-q64-fast
    params: {scope: 'sampled:0.015625', profile: fast}
  - name: sampled-q64-balanced
    params: {scope: 'sampled:0.015625', profile: balanced}
  - name: sampled-q16-fast
    params: {scope: 'sampled:0.0625', profile: fast}
  - name: sampled-q16-balanced
    params: {scope: 'sampled:0.0625', profile: balanced}
  - name: sampled-q4-fast
    params: {scope: 'sampled:0.25', profile: fast}
  - name: sampled-q4-balanced
    params: {scope: 'sampled:0.25', profile: balanced}
  - name: post-write-fast
    params: {scope: 'post-write', profile: fast}
  - name: post-write-balanced
    params: {scope: 'post-write', profile: balanced}
command: >-
  /root/eb-research/target/harness/release/ebr-pack --item-path {item_path} --experiment-id EXP-CODEC-006-large --env-name wsl-ubuntu
  --profile {profile} --verify-scope {scope} --timing-mode in-process --sink memory --summary-stdout
shell: bash
corpus:
  manifest: research/corpus/manifest.json
  splits: [tuning]
  item_ids:
    - f01-tuning-llvm-project-20-1-8-git
    - f02-tuning-ripgrep-cargo-target
    - f05-tuning-google-clusterdata-2011-2-task-usage
    - f05-tuning-loghub-hdfs-v1
    - f06-tuning-gharchive-2024-01-15-h15
    - f07-tuning-pythia-160m-safetensors-step100000
    - f07-tuning-qwen2-5-1-5b-safetensors-bf16
    - f07-tuning-sdrbench-hurricane-isabel
    - f08-tuning-postgres17-pgbench-s40
    - f08-tuning-wikimedia-simplewiki-sql-dump
    - f10-linux-firmware-20260910-full-tree
    - f12-tuning-nasa-ivl-photos-large
    - f13-tuning-bbb-video-large
    - f15-tuning-real-ubuntu-noble-ova-raw
    - f16-ubuntu-noble-cloudimg-20260911-raw
    - f18-tuning-curl-8-x-release-series
    - f18-tuning-ubuntu-noble-cloud-images
metrics:
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}
  - {name: encode_wall_s, source: stdout_json, key: payload.timed.pack_wall_s, family: time_wall, direction: minimize, unit: s}
  - {name: encode_cpu_s, source: stdout_json, key: payload.timed.pack_cpu_s, family: time_cpu, direction: minimize, unit: s}
  - {name: verification_wall_s, source: stdout_json, key: payload.timed.verification_wall_s, family: time_wall, direction: minimize, unit: s}
  - {name: artifact_sha256, source: stdout_json, key: payload.archive_sha256, family: correctness, kind: string}
  - {name: roundtrip_mismatches, source: stdout_json, key: payload.roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: wall_s, source: resource, family: time_wall, direction: minimize, unit: s}
repetitions: 20
warmups: 1
record_warmups: true
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: true
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  cpu_affinity: [2]
  requires: [/root/eb-research/target/harness/release/ebr-pack]
  timeout_s: 21600
guard:
  max_loadavg_1m: 2.0
  max_other_cpu_percent: 3.0
  max_wait_s: 300
analysis:
  baseline: status-quo-balanced
  pairing: item_repetition
  report_metrics: [encode_wall_s, verification_wall_s, roundtrip_mismatches]

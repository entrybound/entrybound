schema: ebr.spec.v1
experiment_id: EXP-RECON-008
status: pre-registered-design
question: >
  Can reconstruction vectors written under the frozen identifiers be decoded to the exact original bytes by
  later crate releases, independent implementations and the production reader under platform, CPU-feature,
  architecture, affinity, locale and time-zone variation, and is forward encoding deterministic across hosts?
hypothesis: >
  protocol.md section 3 (H1-H6): JPEG XL reconstruction agrees across jxl-oxide releases and libjxl; libjxl-
  encoded representations reconstruct in jxl-oxide 0.12.6; preflate-rs corrections are version-bound; zero
  production reader disagreements under variation; forward determinism within host classes; lzma-rust2
  estimates stable across releases.
decision_ids: [DEC-INT-030, DEC-CMP-038, DEC-CON-007, DEC-CMP-023, DEC-CMP-026]
notes: >
  NEEDS_TOOLING. Native WSL cells. Emulated and Windows cells are in spec-emulated.yaml and spec-windows.yaml.

candidates:
  - name: deflate-preflate-rs-0.7.6-ref
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl preflate-rs-0.7.6 --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: deflate-preflate-rs-release-set
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl preflate-rs-release-set --release-manifest /mnt/d/Projects/entrybound/entrybound/research/harness/recon-backends/manifest.json --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: jpeg-jxl-oxide-0.12.6-ref
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl jxl-oxide-0.12.6-production --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: jpeg-jxl-oxide-release-set
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl jxl-oxide-release-set --release-manifest /mnt/d/Projects/entrybound/entrybound/research/harness/recon-backends/manifest.json --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: jpeg-libjxl-djxl-pinned
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl external:/root/eb-research/tools/recon-backends/libjxl-pinned/bin/djxl --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: jpeg-libjxl-djxl-ubuntu-0.7.0
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl external:/usr/bin/djxl --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: jpeg-libjxl-encoded-to-jxl-oxide
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl reverse-libjxl-cjxl-e7-to-production --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: prod-reader-affinity-1
    command: "taskset -c 2 /root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl production-reader-archive --workers 1 --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: prod-reader-affinity-2
    command: "taskset -c 2-3 /root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl production-reader-archive --workers 2 --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: prod-reader-affinity-8
    command: "taskset -c 2-9 /root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl production-reader-archive --workers 8 --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: prod-reader-affinity-32
    command: "taskset -c 0-31 /root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl production-reader-archive --workers 32 --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: prod-reader-locale-tr
    command: "env LC_ALL=tr_TR.UTF-8 /root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl production-reader-archive --locale-canary true --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: prod-reader-locale-ja
    command: "env LC_ALL=ja_JP.UTF-8 /root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl production-reader-archive --locale-canary true --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: prod-reader-tz-chatham
    command: "env TZ=Pacific/Chatham /root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors decode --impl production-reader-archive --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: forward-jixel-determinism-wsl
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors forward --impl jixel-0.2.19-status-quo --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: forward-preflate-determinism-wsl
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon vectors forward --impl preflate-rs-0.7.6-status-quo --vectors {item_path} --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
  - name: lzma-rust2-estimate-release-set
    command: "/root/eb-research/tools/EXP-RECON-008/bin/ebr-recon lzma2-estimates --release-manifest /mnt/d/Projects/entrybound/entrybound/research/harness/recon-backends/manifest.json --experiment-id EXP-RECON-008 --env-name wsl-ubuntu"
shell: bash

corpus:
  splits: [tuning]
  manifest: research/experiments/EXP-RECON-008/vectors-tuning.jsonl

metrics:
  - {name: cpu_s, source: resource, family: time_cpu, direction: none, unit: s}
  - {name: vectors_decoded, source: stdout_json, key: payload.vectors_decoded, family: other, direction: none, unit: count}
  - {name: vectors_exact, source: stdout_json, key: payload.vectors_exact, family: other, direction: maximize, unit: count}
  - {name: vectors_rejected, source: stdout_json, key: payload.vectors_rejected, family: other, direction: none, unit: count}
  - {name: vectors_mismatch, source: stdout_json, key: payload.vectors_mismatch, family: correctness, direction: minimize, unit: count}
  - {name: reader_disagreements, source: stdout_json, key: payload.reader_disagreements, family: correctness, direction: minimize, unit: count}
  - {name: oom_killed, source: stdout_json, key: payload.oom_killed, family: correctness, direction: none, unit: count}
  - {name: canary_effective, source: stdout_json, key: payload.canary_effective, family: correctness, direction: maximize, unit: flag}
  - {name: release_count, source: stdout_json, key: payload.release_count, family: other, direction: none, unit: count}
  - {name: releases_fully_agreeing, source: stdout_json, key: payload.releases_fully_agreeing, family: other, direction: maximize, unit: count}
  - {name: output_digest_set_sha256, source: stdout_json, key: payload.output_digest_set_sha256, family: correctness, kind: string}
  - {name: representation_digest_set_sha256, source: stdout_json, key: payload.representation_digest_set_sha256, family: correctness, kind: string}
  - {name: cpu_model_in_effect, source: stdout_json, key: payload.cpu_model_in_effect, family: correctness, kind: string}

repetitions: 3
warmups: 0
seeds: {order: 20260929, bootstrap: 20260929, command: 20260929}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  timeout_s: 43200

analysis:
  baseline: deflate-preflate-rs-0.7.6-ref
  pairing: item
  report_metrics: [vectors_decoded, vectors_exact, vectors_mismatch, reader_disagreements]

schema: ebr.spec.v1
experiment_id: EXP-LEGACY-031
status: designed
question: >
  Stress cell of EXP-LEGACY-031: are legacy export bytes identical across 20 repetitions at 32 threads under seeded
  background CPU load (objective MVT-13(a) stress mode)?
hypothesis: >
  All 20 repetitions of every source and frozen profile produce one SHA-256; any two differing outputs are the
  violation artifact (decision-method section 4.13).
decision_ids: [DEC-LEG-008]
notes: >
  Companion to spec.yaml (same experiment id, separate run id). Background load is generated by the driver with the
  seed below; sources are the golden sources only (cases-manifest rows with family F19/F04 generated by
  golden_sources.py).
cwd: /mnt/d/Projects/entrybound/entrybound
shell: bash
env:
  PYTHONPATH: research/tools

command: >-
  /root/eb-research/venv/bin/python research/tools/legacy/export_determinism.py
  --experiment EXP-LEGACY-031 --build {build} --arm {arm} --source {item_path} --item-id {item_id}
  --split {split} --rep {rep} --seed {seed} --profiles all-frozen --golden-only
  --scratch {scratch} --artifacts-root /root/eb-research/raw-artifacts/EXP-LEGACY-031

candidates:
  - {name: head-stress, params: {build: legacy-head, arm: "stress:threads=32;background-load-seed=2509173114"}}

corpus:
  manifest: research/experiments/EXP-LEGACY-031/cases-manifest.jsonl
  splits: [tuning, validation]

metrics:
  - {name: within_cell_mismatches, source: stdout_json, key: payload.within_cell_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: export_digest_set_sha256, source: stdout_json, key: payload.export_digest_set_sha256, family: correctness, kind: string}
  - {name: observations_sha256, source: stdout_json, key: payload.observations_sha256, family: correctness, kind: string}

repetitions: 20
warmups: 0
seeds: {order: 2509173121, bootstrap: 2509173122, command: 2509173123}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 32
  requires:
    - /root/eb-research/venv/bin/python
    - /root/eb-research/target/legacy-head/release/ebound
  timeout_s: 7200

analysis:
  baseline: head-stress
  pairing: item
  report_metrics: [within_cell_mismatches]

schema: ebr.spec.v1
experiment_id: EXP-PLANNER-002
status: design
question: >
  Against an exhaustive oracle over a strict superset of registered candidates
  (bounded by each profile's implied decode requirements, unbounded, and
  unbounded plus modelled external codecs), how much artifact_bytes does the
  status-quo v6 planner leave unrealized per profile, stage, family, scale tier,
  workload mix and content category, and which candidates win under exhaustive
  search?
hypothesis: >
  See research/experiments/EXP-PLANNER-002/protocol.md section 2: corpus-level
  bounded regret below 1 T-01 band unit for fast and balanced and at most 2 for
  dense and extreme; at least one family per profile above 2; unbounded regret
  above 2 for fast and balanced; external codecs win under 5% of Chunk bytes in
  dense and extreme. Any non-zero drift_differences invalidates the item's traces.
decision_ids: [DEC-CMP-032, DEC-CMP-034, DEC-CMP-009]

candidates:
  - name: trace-all-profiles
    params: {caps: full, external: "brotli-q11-w24,bzip2-9,ppmd-o6-m16"}
command: >-
  /root/eb-research/target/planner-harness/release/ebr-planner trace-tree
  --item-path {item_path} --experiment-id EXP-PLANNER-002 --env-name wsl-ubuntu
  --profiles fast,balanced,dense,extreme --caps {caps}
  --external-candidates {external}
  --cache-dir /root/eb-research/cache/planner-oracle/rep{rep}
  --out-dir /root/eb-research/raw-side/EXP-PLANNER-002/traces/{item_id}/rep{rep}
shell: bash

corpus:
  manifest: research/planner/derived/psub-256.json
  splits: [tuning]

metrics:
  - {name: drift_differences, source: stdout_json, key: drift_differences, family: correctness, direction: minimize, unit: count}
  - {name: shards_sha256, source: stdout_json, key: shards_sha256_combined, family: correctness, kind: string}
  - {name: selected_cost_fast, source: stdout_json, key: archive_regret.fast.selected_cost, family: size, direction: minimize, unit: B}
  - {name: oracle_lower_fast, source: stdout_json, key: archive_regret.fast.oracle_bounded_lower, family: size, direction: minimize, unit: B}
  - {name: oracle_upper_fast, source: stdout_json, key: archive_regret.fast.oracle_bounded_upper, family: size, direction: minimize, unit: B}
  - {name: selected_cost_balanced, source: stdout_json, key: archive_regret.balanced.selected_cost, family: size, direction: minimize, unit: B}
  - {name: oracle_lower_balanced, source: stdout_json, key: archive_regret.balanced.oracle_bounded_lower, family: size, direction: minimize, unit: B}
  - {name: oracle_upper_balanced, source: stdout_json, key: archive_regret.balanced.oracle_bounded_upper, family: size, direction: minimize, unit: B}
  - {name: selected_cost_dense, source: stdout_json, key: archive_regret.dense.selected_cost, family: size, direction: minimize, unit: B}
  - {name: oracle_lower_dense, source: stdout_json, key: archive_regret.dense.oracle_bounded_lower, family: size, direction: minimize, unit: B}
  - {name: oracle_upper_dense, source: stdout_json, key: archive_regret.dense.oracle_bounded_upper, family: size, direction: minimize, unit: B}
  - {name: selected_cost_extreme, source: stdout_json, key: archive_regret.extreme.selected_cost, family: size, direction: minimize, unit: B}
  - {name: oracle_lower_extreme, source: stdout_json, key: archive_regret.extreme.oracle_bounded_lower, family: size, direction: minimize, unit: B}
  - {name: oracle_upper_extreme, source: stdout_json, key: archive_regret.extreme.oracle_bounded_upper, family: size, direction: minimize, unit: B}
  - {name: oracle_unbounded_lower, source: stdout_json, key: archive_regret.unbounded.oracle_lower, family: size, direction: minimize, unit: B}
  - {name: oracle_unbounded_external_lower, source: stdout_json, key: archive_regret.unbounded_external.oracle_lower, family: size, direction: minimize, unit: B}
  - {name: diag_regret_upper_ratio_balanced, source: derived, op: ratio, args: [selected_cost_balanced, oracle_lower_balanced], family: size, direction: minimize}
  - {name: diag_regret_upper_ratio_extreme, source: derived, op: ratio, args: [selected_cost_extreme, oracle_lower_extreme], family: size, direction: minimize}
  - {name: work_candidate_evaluations, source: stdout_json, key: work.candidate_evaluations, family: other, direction: none, unit: count}
  - {name: work_bytes_examined, source: stdout_json, key: work.bytes_examined, family: other, direction: none, unit: B}
  - {name: unique_chunks_searched, source: stdout_json, key: unique_chunks_searched, family: other, direction: none, unit: count}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 2
warmups: 0
seeds: {order: 260917021, bootstrap: 260917022, command: 260917023}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 1
  scratch_root: /root/eb-research/scratch/ebr
  requires: [/root/eb-research/target/planner-harness/release/ebr-planner]
  timeout_s: 259200

analysis:
  baseline: trace-all-profiles
  pairing: item
  report_metrics: [drift_differences, diag_regret_upper_ratio_balanced, diag_regret_upper_ratio_extreme, work_candidate_evaluations]

notes: >
  NEEDS_TOOLING: ebr-planner trace-tree (TP-01) and research/planner/derived/psub-256.json
  (TP-15) do not exist at design time. Deterministic experiment; repetition 2 uses an
  empty oracle cache so the repeat-hash covers recomputation. Validation sub-items run
  only inside planner look 1 (research/planner/README.md section 5).

schema: ebr.spec.v1
experiment_id: EXP-SCALE-014
status: design-draft
notes: >
  Design draft until gate G-A (decision-method.md section 0.4); NEEDS_TOOLING: the binaries named in requires are built by the tooling listed in protocol.md. Emulated (QEMU user mode); never used for timing.
question: >
  Are pack bytes and identities and decode outputs identical between native x86-64, emulated aarch64, restricted x86-64 CPU models and overlayfs capture?
hypothesis: >
  PCI and LAI are identical across all runners; decode outputs and outcomes are identical under every CPU model; overlay capture keeps LAI with FidelityReport-explained AUX differences. One two-output difference falsifies.
decision_ids: [DEC-MOD-011, DEC-MOD-013, DEC-CMP-021, DEC-CMP-019, DEC-ACC-031, DEC-CMP-001]


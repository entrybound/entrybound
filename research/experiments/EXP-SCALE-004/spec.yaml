schema: ebr.spec.v1
experiment_id: EXP-SCALE-004
status: design-draft
notes: >
  Linux arm of the status-quo staging and failure-behaviour experiment. Design draft until gate G-A. Driver: research/tools/scale/fault_cell.py (contract in protocol.md).
question: >
  What do status-quo staging, extraction failure handling, crash residue, exclusive create, bootstrap
  limit boundaries, I/O fault codes and non-seekable I/O behaviour cost and produce, compared with
  incumbent pipelines and a sibling-stage-then-rename emulation?
hypothesis: >
  STREAM unpack creates no destination object before full verification (so time to first file grows
  with size); spill files survive SIGKILL; no interrupted output verifies OK; distinct I/O faults share
  one reason code; bootstrap caps are enforced only after plaintext-proportional capture. Any single
  reproducible counterexample falsifies the corresponding part.
decision_ids: [DEC-ACC-006, DEC-ACC-053, DEC-ACC-055, DEC-INT-039, DEC-PLT-011, DEC-MOD-032, DEC-ACC-022, DEC-ACC-052, DEC-ACC-013]

candidates:
  - {name: ttff-unpack-stream-stdin}
  - {name: ttff-unpack-indexed}
  - {name: ttff-inc-zstd-tar}
  - {name: diskfull-tmp}
  - {name: diskfull-dst}
  - {name: diskfull-pack}
  - {name: kill-unpack-stream}
  - {name: kill-unpack-indexed}
  - {name: kill-pack-indexed}
  - {name: kill-pack-stream-stdout}
  - {name: kill-repack}
  - {name: kill-export-zip}
  - {name: kill-publish}
  - {name: corrupt-last-chunk-stream}
  - {name: corrupt-last-chunk-indexed}
  - {name: exclusive-create}
  - {name: boundary-entries}
  - {name: boundary-single-entry}
  - {name: boundary-logical}
  - {name: sibling-rename-ext4}
  - {name: sibling-rename-xfs}
  - {name: sibling-rename-btrfs}
  - {name: spill-permissions}
  - {name: io-fault-eacces}
  - {name: io-fault-erofs}
  - {name: io-fault-epipe}
  - {name: io-fault-emfile}
  - {name: io-fault-enospc}
  - {name: nonseekable-census}
command: >-
  /root/eb-research/venv/bin/python /mnt/d/Projects/entrybound/entrybound/research/tools/scale/fault_cell.py
  --experiment EXP-SCALE-004 --cells /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-SCALE-004/cells.json
  --cell {item_id} --scenario {candidate} --rep {rep} --seed {seed} --scratch {scratch}
shell: bash

corpus:
  manifest: research/experiments/EXP-SCALE-004/cells.jsonl
  splits: [synthetic]

metrics:
  - {name: applicable, source: stdout_json, key: payload.applicable, family: correctness, direction: none}
  - {name: outcome, source: stdout_json, key: payload.outcome, family: correctness, kind: string}
  - {name: reason_code, source: stdout_json, key: payload.reason_code, family: correctness, kind: string}
  - {name: dest_objects_before_verify, source: stdout_json, key: payload.dest_objects_before_verify, family: correctness, direction: none, unit: count}
  - {name: verified_ok_partial_outputs, source: stdout_json, key: payload.verified_ok_partial_outputs, family: correctness, direction: none, unit: count}
  - {name: partial_publish_sets, source: stdout_json, key: payload.partial_publish_sets, family: correctness, direction: none, unit: count}
  - {name: sentinel_modified, source: stdout_json, key: payload.sentinel_modified, family: correctness, direction: none, unit: count}
  - {name: stdout_bytes_before_refusal, source: stdout_json, key: payload.stdout_bytes_before_refusal, family: correctness, direction: none, unit: B}
  - {name: spill_leftover_files, source: stdout_json, key: payload.spill_leftover_files, family: scratch_peak, direction: none, unit: count}
  - {name: spill_leftover_bytes, source: stdout_json, key: payload.spill_leftover_bytes, family: scratch_peak, direction: none, unit: B}
  - {name: scratch_write_bytes, source: stdout_json, key: payload.scratch_write_bytes, family: correctness, direction: none, unit: B}
  - {name: peak_rss_bytes, source: stdout_json, key: payload.peak_rss_bytes, family: memory_peak, direction: none, unit: B}
  - {name: ttff_s, source: stdout_json, key: payload.ttff_s, family: time_wall, direction: none, unit: s}
  - {name: op_wall_s, source: stdout_json, key: payload.op_wall_s, family: time_wall, direction: none, unit: s}
  - {name: extra_write_bytes_vs_direct, source: stdout_json, key: payload.extra_write_bytes_vs_direct, family: io, direction: none, unit: B}
  - {name: exdev_observed, source: stdout_json, key: payload.exdev_observed, family: other, direction: none}
  - {name: acl_diff_count, source: stdout_json, key: payload.acl_diff_count, family: other, direction: none, unit: count}
  - {name: xattr_diff_count, source: stdout_json, key: payload.xattr_diff_count, family: other, direction: none, unit: count}
  - {name: rename_retries, source: stdout_json, key: payload.rename_retries, family: other, direction: none, unit: count}
  - {name: spill_mode_octal, source: stdout_json, key: payload.spill_mode_octal, family: other, kind: string}
  - {name: reason_code_specific, source: stdout_json, key: payload.reason_code_specific, family: other, direction: none}
  - {name: kills_jsonl_sha256, source: stdout_json, key: payload.kills_jsonl_sha256, family: correctness, kind: string}

repetitions: 3
warmups: 0
seeds: {order: 1304001, bootstrap: 1304002, command: 1304003}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  min_cpus: 4
  requires:
    - /root/eb-research/target/scale-prod/release/ebound
    - /root/eb-research/target/harness/release/ebr-inspect-bytes
    - /root/eb-research/venv/bin/python
    - /usr/bin/time
    - inotifywait
    - setpriv
    - mkfs.xfs
    - mkfs.btrfs
  poll_interval_s: 1.0
  timeout_s: 21600

analysis:
  pairing: item_repetition
  report_metrics: [dest_objects_before_verify, verified_ok_partial_outputs, spill_leftover_bytes, ttff_s]

schema: ebr.spec.v1
experiment_id: EXP-SCALE-011
status: design-draft
notes: >
  Design draft until gate G-A (decision-method.md section 0.4); NEEDS_TOOLING: the binaries named in requires are built by the tooling listed in protocol.md.
question: >
  Does compressed output of zstd, xz/LZMA2 and JPEG XL depend on worker counts, single vs multi mode or job size, and does zstd dictionary training change across 1.5.x releases and thread counts?
hypothesis: >
  zstd output is invariant across worker counts >= 1 at fixed job size and differs from single-thread mode; xz with fixed block size is invariant for T >= 2; training is invariant across threads but not across all releases. One differing digest in a claimed group falsifies it.
decision_ids: [DEC-ACC-030, DEC-CMP-021, DEC-MOD-011, DEC-MOD-013]


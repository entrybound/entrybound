schema: ebr.spec.v1
experiment_id: EXP-CONF-009
status: designed
question: >
  When every attacker-facing parsing boundary is fuzzed to the objective's 72 CPU-hour ceiling (plus bypass and
  memory-ceiling arms), how many distinct reproducible crash, panic, OOM and timeout defects remain unresolved at each
  candidate adequacy criterion's stop point, and is every finding minimized, triaged and promoted?
hypothesis: >
  H1: unresolved_fuzz_findings_at_coverage_target = 0 for every target at the objective's stop rule; falsified by one
  deduplicated reproducible finding without a fix. H2: every finding has a regression entry, triage record and, where it
  exposes a format rule, a conformance case. H3: no finding is first detected after a candidate criterion's stop point.
decision_ids: [DEC-ECO-029, DEC-ECO-028, DEC-CRY-006, DEC-CRY-016, DEC-CRY-017, DEC-CMP-005, DEC-CMP-010, DEC-CMP-016,
  DEC-CMP-037, DEC-CON-018, DEC-INT-008, DEC-ACC-057, DEC-CRY-029, DEC-CRY-067, DEC-LEG-059, DEC-LEG-064, DEC-LEG-095,
  DEC-MOD-006, DEC-MOD-038, DEC-PLT-054]
notes: >
  Design pre-registration (Phase C-design); runs after gate G-A. One persistent campaign per candidate (repetitions 1;
  persistence is the design; seed variability is measured in EXP-CONF-008). The generated item is an anchor only; seed
  corpora are research/harness/fuzz/seed-corpora-v1.json (tuning items and generated cases; conventions CC7). Resumable:
  campaign.py resumes from the last hourly corpus checkpoint in the artifact directory. rss_limit_mb
  'status-quo-decoder-ceiling' resolves to 384 MiB plus the process baseline measured at campaign start. Findings are
  handled under conventions CC8 (private store for security-relevant bytes). CPU-saturating: never concurrent with timing.


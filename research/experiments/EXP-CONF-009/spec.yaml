command: >-
  /usr/bin/python3 research/harness/fuzz/tools/campaign.py
  --target {target} --mode {mode} --build clean --engine libfuzzer --budget-cpu-h {budget_cpu_h}
  --seed-base 2809171001 --rep 0 --fork 4 --rss-limit-mb {rss_limit_mb} --timeout-s 10 --checkpoints-cpu-h every-4
  --resume --source /root/eb-research/src/conf-fuzz-head --seed-corpora research/harness/fuzz/seed-corpora-v1.json
  --artifact-dir /root/eb-research/raw-artifacts/EXP-CONF-009/{candidate}
  --experiment-id EXP-CONF-009 --env-name wsl-ubuntu
shell: bash

corpus:
  generated:
    - {item_id: conf009-anchor, family: synthetic-anchor, generator: zeros-v1, bytes: 1, seed: 2809171001}

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: none, unit: s}
  - {name: cpu_s, source: resource, family: time_cpu, direction: none, unit: s}
  - {name: execs_total, source: stdout_json, key: payload.execs_total, family: other, direction: none, unit: count}
  - {name: regions_covered_final, source: stdout_json, key: payload.regions_covered_final, family: other, direction: none, unit: count}
  - {name: decided_codes_reached, source: stdout_json, key: payload.decided_codes_reached, family: other, direction: none, unit: count}
  - {name: decided_codes_attributed, source: stdout_json, key: payload.decided_codes_attributed, family: other, direction: none, unit: count}
  - {name: raw_findings, source: stdout_json, key: payload.raw_findings, family: other, direction: none, unit: count}
  - {name: dedup_findings, source: stdout_json, key: payload.dedup_findings, family: correctness, direction: minimize, unit: count}
  - {name: reproducible_findings, source: stdout_json, key: payload.reproducible_findings, family: correctness, direction: minimize, unit: count}
  - {name: corpus_entries_final, source: stdout_json, key: payload.corpus_entries_final, family: other, direction: none, unit: count}
  - {name: trace_sha256, source: stdout_json, key: payload.trace_sha256, family: correctness, kind: string}
  - {name: build_identity_sha256, source: stdout_json, key: payload.build_identity_sha256, family: correctness, kind: string}


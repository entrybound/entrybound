schema: ebr.spec.v1
experiment_id: EXP-RECON-004
status: pre-registered-design
question: >
  Per tuning item and profile, what artifact bytes, access declarations, required bits, audit bytes
  and declared decode requirements do real archives of each planner generation (v3-v6), each v6
  reconstruction filter, gate and activation variant, and each chunk-alignment variant produce, and
  which reconstruction design survives decision-method R1-R10 against the no-reconstruction reference?
hypothesis: >
  protocol.md section 3 (H1-H8): DEFLATE reconstruction equivalent to dropping it in balanced; JPEG
  regions beyond the T-01 band on F12 but not beyond the T4 minimum-gain band at corpus level; v5+v6
  savings share under 10 percent of v4's; signature gating non-inferior; minimal activation removes
  required bits from at least 90 percent of no-reconstruction archives; member-aligned CDC loses on F18;
  exact cost model admissible with 0 bytes error.
decision_ids: [DEC-CMP-018, DEC-CMP-026, DEC-CMP-023, DEC-CMP-042, DEC-CMP-012, DEC-CON-010, DEC-CON-005, DEC-CMP-016, DEC-CMP-038, DEC-CON-007]
notes: >
  NEEDS_TOOLING (ebr-recon variants/model, research planner and chunker overrides, per-chunk byte
  accounting). Tuning under this spec; validation look 1 uses an identical copy with splits: [validation]
  committed in the look-registration commit. Modelled candidates are computed by ebr-recon model after runs.


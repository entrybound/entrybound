  of each frozen W and S strategy per profile, paired with sq-table of the same
  profile, on the TS-1-V validation timing subset (dense/extreme on PSUB-64
  sub-items), WSL st-v.
hypothesis: >
  encode_wall_s of every S member is reported against the profile's T-03 band;
  guards per decision-method.md Appendix B.1. Template: the record replaces the
  candidate list with W and S per profile via
  research/planner/tools/make_timing_spec.py before planner look 1.
decision_ids: [DEC-CMP-032, DEC-CMP-033]


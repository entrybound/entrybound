command: >-
  /root/eb-research/target/planner-harness/release/ebr-planner time-select
  --item-path {item_path} --profile {profile} --strategy {strategy}
  --strategy-config /mnt/d/Projects/entrybound/entrybound/research/normalized/EXP-PLANNER-003/replay/strategy-configs.json
  --experiment-id EXP-PLANNER-003 --env-name wsl-ubuntu
shell: bash

corpus:
  manifest: research/planner/derived/ts1-validation.json
  splits: [validation]

metrics:
  - {name: encode_wall_s, source: stdout_json, key: encode_wall_s, family: time_wall, direction: minimize, unit: s}
  - {name: encode_cpu_s, source: stdout_json, key: encode_cpu_s, family: time_cpu, direction: minimize, unit: s}
  - {name: work_candidate_evaluations, source: stdout_json, key: work.candidate_evaluations, family: other, direction: none, unit: count}
  - {name: output_sha256, source: stdout_json, key: output_sha256, family: correctness, kind: string}
  - {name: wall_s, source: resource, family: time_wall, direction: minimize, unit: s}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 10
warmups: 2
seeds: {order: 260917031, bootstrap: 260917032, command: 260917033}
timing: true
order: randomized_blocks
raw_compression: gzip
record_warmups: true

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 4
  cpu_affinity: [2]
  scratch_root: /root/eb-research/scratch/ebr
  requires: [/root/eb-research/target/planner-harness/release/ebr-planner]
  timeout_s: 86400

guard:
  max_loadavg_1m: 2.0
  max_other_cpu_percent: 3.0
  sample_interval_s: 1.0
  max_wait_s: 300

analysis:
  baseline: sq-table--balanced
  pairing: item_repetition
  report_metrics: [encode_wall_s, encode_cpu_s]

notes: >
  Timing template (NEEDS_TOOLING: TP-07, runner additions of decision-method.md
  section 14 item 3, calibration section 4.7). repetitions is the tier minimum;
  the adaptive step/cap of section 4.6 is applied by the runner additions.
  Windows arm: spec-timing-windows.yaml generated by make_timing_spec.py with
  platform os [windows], affinity st-p {2}.

schema: ebr.spec.v1
experiment_id: EXP-PLANNER-003
status: design
question: >
  Within each profile's declared bounds, which deterministic Chunk-stage search
  strategy and which deterministic work budget attains the smallest
  artifact_bytes (materialized) with encode, decode, decode-memory and
  access-granularity guards intact, and what regret against the exhaustive
  oracle does each strategy leave?
hypothesis: >
  See research/experiments/EXP-PLANNER-003/protocol.md section 2 (successive
  halving k=2 non-inferior in dense/extreme at <=50% evaluations; no strategy
  distinguishably better in fast/balanced; learned integer selector within 1
  band unit of the bounded oracle at <=25% evaluations; a finite
  non-inferior evaluation budget exists per profile). This deterministic arm
  materializes every (strategy, profile) cell on PSUB-256 tuning sub-items.
decision_ids: [DEC-CMP-032, DEC-CMP-033]


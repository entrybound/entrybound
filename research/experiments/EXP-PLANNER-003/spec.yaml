command: >-
  /root/eb-research/target/planner-harness/release/ebr-planner materialize
  --item-path {item_path} --profile {profile} --layout indexed
  --assignment /root/eb-research/raw-side/EXP-PLANNER-003/assignments/{strategy}/{profile}/{item_id}.jsonl
  --experiment-id EXP-PLANNER-003 --env-name wsl-ubuntu
  --archive-out {scratch}/archive.eb
shell: bash

corpus:
  manifest: research/planner/derived/psub-256.json
  splits: [tuning]

metrics:
  - {name: artifact_bytes, source: stdout_json, key: artifact_bytes, family: size, direction: minimize, unit: B}
  - {name: modelled_artifact_bytes, source: stdout_json, key: modelled_artifact_bytes, family: size, direction: minimize, unit: B}
  - {name: reconciliation_delta_bytes, source: stdout_json, key: reconciliation_delta_bytes, family: correctness, direction: minimize, unit: B}
  - {name: access_granularity_bytes, source: stdout_json, key: access_granularity_bytes, family: size, direction: minimize, unit: B}
  - {name: declared_decode_memory_bytes, source: stdout_json, key: declared_decode_memory_bytes, family: other, direction: none, unit: B}
  - {name: work_candidate_evaluations, source: stdout_json, key: work.candidate_evaluations, family: other, direction: none, unit: count}
  - {name: work_bytes_examined, source: stdout_json, key: work.bytes_examined, family: other, direction: none, unit: B}
  - {name: artifact_sha256, source: path_sha256, path: "{scratch}/archive.eb", family: correctness}
  - {name: roundtrip_mismatches, source: stdout_json, key: roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: verified, source: stdout_json, key: verified, family: correctness, direction: maximize}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 2
warmups: 0
seeds: {order: 260917031, bootstrap: 260917032, command: 260917033}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 1
  scratch_root: /root/eb-research/scratch/ebr
  requires: [/root/eb-research/target/planner-harness/release/ebr-planner]
  timeout_s: 86400

analysis:
  baseline: sq-table--balanced
  pairing: item
  report_metrics: [artifact_bytes, reconciliation_delta_bytes, work_candidate_evaluations, access_granularity_bytes]

notes: >
  NEEDS_TOOLING (TP-02 materialize, TP-03 replay strategies/budgets, TP-15 PSUB-256).
  Deterministic arm; the decision analysis pairs each candidate with sq-table of the
  same profile (per-profile scopes, decision-method.md Appendix B.1), not with the
  spec-level baseline, which only satisfies the ebr schema.

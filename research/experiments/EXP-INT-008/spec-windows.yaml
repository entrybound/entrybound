schema: ebr.spec.v1
experiment_id: EXP-INT-008
status: design
question: >
  On Windows NTFS, does status quo sidecar creation bind a single coherent legacy source under
  concurrent modification, and do locator resolution policies stay confined against junction,
  case-fold and UNC-form locators?
hypothesis: >
  See research/experiments/EXP-INT-008/protocol.md section 2 (H2, H5), Windows arm.
notes: >
  D: only (never C:). Items mirrored to D:/eb-research/corpus with logical_tree_sha256
  re-verified before the run; ebr runs with --data-root D:/eb-research. NEEDS_TOOLING.
decision_ids: [DEC-INT-013, DEC-INT-014, DEC-INT-026, DEC-LEG-056]

candidates:
  - name: sq-content-bearing-sidecar
    params: {design: status-quo-content-bearing}
  - name: lock-or-rehash-snapshot
    params: {design: lock-or-rehash-snapshot}
  - name: external-refs-policy-matrix
    params: {design: external-reference-resolvers}

command:
  - C:/Python313/python.exe
  - D:/Projects/entrybound/entrybound/research/tools/integrity/sidecar_matrix.py
  - --experiment-id
  - EXP-INT-008
  - --env-name
  - windows-host
  - --item-path
  - "{item_path}"
  - --item-id
  - "{item_id}"
  - --candidate
  - "{candidate}"
  - --design
  - "{design}"
  - --mutations
  - none,renamed,truncated-1,member-byte,reencoded,toctou-swap
  - --hostile-fixtures
  - D:/Projects/entrybound/entrybound/research/experiments/EXP-INT-008/fixtures/hostile-locators.json
  - --windows-fixtures
  - junction-escape,case-fold-alias,unc-form,trailing-dot-space,ads-name
  - --concurrency-delays
  - "200"
  - --ebound
  - D:/eb-research/target/int-prod-win/release/ebound.exe
  - --detail-root
  - D:/eb-research/raw-detail/EXP-INT-008
  - --rep
  - "{rep}"
  - --work-dir
  - "{scratch}"
shell: pwsh

corpus:
  manifest: research/corpus/manifest.json
  splits: [tuning]
  item_ids:
    - f14-legacy-writer-matrix-tuning
    - f14-apache-maven-3916-bin-tarball
    - f11-pypi-binary-wheels-cp312

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: none, unit: s}
  - {name: detail_sha256, source: stdout_json, key: payload.detail_sha256, family: correctness, kind: string}
  - {name: confinement_escapes, source: stdout_json, key: payload.confinement_escapes, family: correctness, direction: minimize, unit: count}
  - {name: mixed_version_bindings, source: stdout_json, key: payload.mixed_version_bindings, family: correctness, direction: minimize, unit: count}
  - {name: localization_recall, source: stdout_json, key: payload.localization_recall_min, family: correctness, direction: maximize, unit: fraction}

repetitions: 2
warmups: 0
seeds: {order: 2026091774, bootstrap: 2026091775, command: 2026091776}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [windows]
  arch: [x86_64]
  emulated: false
  scratch_root: D:/eb-research/scratch/int-008
  requires:
    - D:/eb-research/target/int-prod-win/release/ebound.exe
  timeout_s: 86400

analysis:
  baseline: sq-content-bearing-sidecar
  pairing: item
  report_metrics: [confinement_escapes, mixed_version_bindings, localization_recall]

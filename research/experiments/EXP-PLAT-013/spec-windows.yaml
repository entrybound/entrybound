schema: ebr.spec.v1
experiment_id: EXP-PLAT-013
status: pre-registration-draft
question: Which NTFS reparse objects, attributes, hardlinks and descriptors occur non-admin, and how do
  status-quo pack/unpack and Windows tools handle them?
hypothesis: Junctions, AF_UNIX and LX symlink objects abort status-quo pack; dev trees contain junctions;
  symlink extraction without privilege aborts wholesale.

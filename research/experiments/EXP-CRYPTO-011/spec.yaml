  - {name: negatives_rejected, source: stdout_json, family: correctness, direction: none, key: payload.negatives_rejected}
  - {name: xcheck_agree, source: stdout_json, family: correctness, direction: none, key: payload.xcheck_agree}
repetitions: 2
warmups: 0
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: false
order: sequential
record_warmups: true
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/harness/release/ebr-crypto]
  timeout_s: 3600
analysis:
  baseline: full-suite
  pairing: item
  report_metrics: [kat_pass, negatives_rejected, xcheck_agree]

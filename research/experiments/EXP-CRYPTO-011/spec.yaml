schema: ebr.spec.v1
experiment_id: EXP-CRYPTO-011
status: designed
question: >
  Does the implementation pass the complete external primitive and construction vector sets and independent cross-checks required before production?
hypothesis: >
  Every applicable KAT passes, negatives are rejected, and independent implementations agree.
decision_ids: [DEC-CRY-014, DEC-CRY-021, DEC-CRY-051, DEC-CRY-048, DEC-CRY-106]
notes: >
  NEEDS_TOOLING: vector files + ebr-crypto vectors + xcheck drivers. FORMAL decision type.
candidates:
  - name: full-suite
    params: {set: 'all'}
command: >-
  /root/eb-research/target/harness/release/ebr-crypto vectors --item-path {item_path} --experiment-id EXP-CRYPTO-011 --env-name wsl-ubuntu --candidate {candidate} --seed {seed} --set {set}
shell: bash
corpus:
  generated:
    - {item_id: tiny-random, family: F20, generator: random-v1, bytes: 65536, seed: 20260917}
metrics:

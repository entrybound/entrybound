schema: ebr.spec.v1
experiment_id: EXP-SCALE-012
status: design-draft
notes: >
  Design draft until gate G-A (decision-method.md section 0.4); NEEDS_TOOLING: the binaries named in requires are built by the tooling listed in protocol.md. Each sample runs the design at the named worker count under the schedule seeds and load conditions of its design-matrix cell (protocol.md Replication, matrix.json) and reports conjunctive equality fields; per-schedule rows go to a details file whose SHA-256 is recorded.
question: >
  Which parallel designs for hashing, chunk analysis, sketching, candidate evaluation, compression, verification, fetching and queueing reproduce sequential outputs, identities, reports and error selection for every worker count and schedule within a declared queue bound?
hypothesis: >
  Ordinal-keyed pools with canonical emission are identical to the sequential reference at every worker count and schedule; intra-file CDC with overlap at least the maximum chunk size reproduces boundaries; reorder buffers stay within their declared bound; collect-in-order does not. One counterexample falsifies each claim.
decision_ids: [DEC-ACC-030, DEC-ACC-031, DEC-ACC-032, DEC-ACC-033, DEC-ACC-007, DEC-ACC-043, DEC-MOD-013, DEC-CMP-001, DEC-CMP-041]


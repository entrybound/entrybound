schema: ebr.spec.v1
experiment_id: EXP-PLANNER-007
status: design
question: >
  Windows host st-p template for planner look 1: encode and decode wall/CPU of the
  status-quo profiles (and, via make_timing_spec.py, the fitted DEC-CMP-035 profiles)
  on TS-1-V items staged to local NTFS outside the repository (TP-19). Same-direction
  support with WSL is required for cross-platform claims (decision-method.md 4.1).
hypothesis: >
  See research/experiments/EXP-PLANNER-007/protocol.md section 2. Candidate
  prefix enc- maps resource wall_s/cpu_s to encode_wall_s/encode_cpu_s and dec-
  to decode_wall_s/decode_cpu_s in the decision tooling; par- is the
  harness-against-ebound timing parity arm.
decision_ids: [DEC-CMP-036, DEC-CMP-035]

candidates:
  - name: enc-sq-fast
    params: {kind: sq, profile: fast, op: encode}
    command: "& 'D:/eb-research/target/planner-cli-win/release/ebound.exe' pack {item_path} {scratch}/archive.eb --layout indexed --profile fast | Out-Null"
  - name: dec-sq-fast
    params: {kind: sq, profile: fast, op: decode}
    command: "& 'D:/eb-research/target/planner-cli-win/release/ebound.exe' unpack D:/eb-research/derived/planner/ts1-archives-win/sq-fast/{item_id}.eb {scratch}/x | Out-Null"
  - name: enc-sq-balanced
    params: {kind: sq, profile: balanced, op: encode}
    command: "& 'D:/eb-research/target/planner-cli-win/release/ebound.exe' pack {item_path} {scratch}/archive.eb --layout indexed --profile balanced | Out-Null"
  - name: dec-sq-balanced
    params: {kind: sq, profile: balanced, op: decode}
    command: "& 'D:/eb-research/target/planner-cli-win/release/ebound.exe' unpack D:/eb-research/derived/planner/ts1-archives-win/sq-balanced/{item_id}.eb {scratch}/x | Out-Null"
  - name: enc-sq-dense
    params: {kind: sq, profile: dense, op: encode}
    command: "& 'D:/eb-research/target/planner-cli-win/release/ebound.exe' pack {item_path} {scratch}/archive.eb --layout indexed --profile dense | Out-Null"
  - name: dec-sq-dense
    params: {kind: sq, profile: dense, op: decode}
    command: "& 'D:/eb-research/target/planner-cli-win/release/ebound.exe' unpack D:/eb-research/derived/planner/ts1-archives-win/sq-dense/{item_id}.eb {scratch}/x | Out-Null"
  - name: enc-sq-extreme
    params: {kind: sq, profile: extreme, op: encode}
    command: "& 'D:/eb-research/target/planner-cli-win/release/ebound.exe' pack {item_path} {scratch}/archive.eb --layout indexed --profile extreme | Out-Null"
  - name: dec-sq-extreme
    params: {kind: sq, profile: extreme, op: decode}
    command: "& 'D:/eb-research/target/planner-cli-win/release/ebound.exe' unpack D:/eb-research/derived/planner/ts1-archives-win/sq-extreme/{item_id}.eb {scratch}/x | Out-Null"
shell: pwsh

corpus:
  manifest: research/planner/derived/ts1-validation-windows.json
  splits: [validation]

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: minimize, unit: s}
  - {name: cpu_s, source: resource, family: time_cpu, direction: minimize, unit: s}
  - {name: max_rss_bytes, source: resource, family: memory_peak, direction: minimize, unit: B}
  - {name: scratch_peak_bytes, source: scratch, family: scratch_peak, direction: minimize, unit: B}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 10
warmups: 2
seeds: {order: 260917071, bootstrap: 260917072, command: 260917073}
timing: true
order: randomized_blocks
raw_compression: gzip
record_warmups: true

platform:
  os: [windows]
  arch: [x86_64]
  emulated: false
  min_cpus: 4
  cpu_affinity: [2]
  timeout_s: 172800

guard:
  max_other_cpu_percent: 3.0
  sample_interval_s: 1.0
  max_wait_s: 300

analysis:
  baseline: enc-sq-fast
  pairing: item_repetition
  report_metrics: [wall_s, cpu_s, max_rss_bytes]

notes: >
  NEEDS_TOOLING: decision-method.md section 14 item 3 runner additions (cooldown,
  canary, covariates, per-core-class guard, adaptive rounds), section 4.7 calibration,
  TP-06/TP-16/TP-19. repetitions is the tier minimum; adaptive step and cap per
  section 4.6 via the runner additions. Look-1 variants generated by
  research/planner/tools/make_timing_spec.py with splits [validation]. Windows arm; fit-* encode requires a Windows harness build of TP-06.

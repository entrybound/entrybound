schema: ebr.spec.v1
experiment_id: EXP-CODEC-001-screen
status: pre-registration-draft (gate G-A pending; protocol.md section 1)
notes: 'Generated by make_specs.py. Stage A (screen, tuning split only; exploratory, never decision evidence). Flags marked TOOLING in protocol.md section 7.2 do not exist yet; runs refuse until built (CC-1).'
question: 'At production chunk scope (balanced, extreme and fast-eligible chunking), what stored bytes, window, container and round-trip result does every configuration of configs/universe-stageA.json give on an object-preserving 64 MiB sample of every tuning item?'
hypothesis: 'Screen only. Configurations advance to Stage B under the mechanical rule of protocol.md section 12.1. Controls: external zstd at window_log 20 reproduces production zstd payloads byte for byte; every configuration round-trips (HC-02).'
decision_ids: [DEC-CMP-008, DEC-CMP-009, DEC-CMP-045]
candidates:
  - name: screen-fast
    params: {profile: fast, subset: fast-eligible}
  - name: screen-balanced
    params: {profile: balanced, subset: all}
  - name: screen-extreme
    params: {profile: extreme, subset: all}
command: >-
  /root/eb-research/target/harness/release/ebr-codec chunk-matrix --item-path {item_path} --experiment-id EXP-CODEC-001-screen
  --env-name wsl-ubuntu --profile {profile} --production-chunking object
  --universe /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-CODEC-001/configs/universe-stageA.json
  --universe-subset {subset} --chunk-sample-bytes 67108864 --chunk-sample-seed 20260917
  --detail-out /root/eb-research/raw-detail/EXP-CODEC-001/stageA/{item_id}/{candidate}-r{rep}.jsonl.gz
  --summary-stdout
shell: bash
corpus:
  manifest: research/corpus/manifest.json
  splits: [tuning]
metrics:
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}
  - {name: sampled_plaintext_bytes, source: stdout_json, key: payload.sampled_plaintext_bytes, family: size, direction: none, unit: B}
  - {name: unique_chunk_count, source: stdout_json, key: payload.unique_chunk_count, family: other, direction: none, unit: count}
  - {name: configurations_run, source: stdout_json, key: payload.configurations_run, family: other, direction: none, unit: count}
  - {name: roundtrip_mismatches, source: stdout_json, key: payload.roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: window20_reconciliation_mismatches, source: stdout_json, key: payload.window20_reconciliation_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: matrix_digest_sha256, source: stdout_json, key: payload.matrix_digest_sha256, family: correctness, kind: string}
  - {name: detail_sha256, source: stdout_json, key: payload.detail_sha256, family: correctness, kind: string}
  - {name: max_rss_bytes, source: resource, family: memory_peak, direction: minimize, unit: B}
  - {name: wall_s, source: resource, family: time_wall, direction: minimize, unit: s}
repetitions: 2
warmups: 0
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/harness/release/ebr-codec, /root/eb-research/target/harness/release/ebr-planner]
  timeout_s: 21600
analysis:
  pairing: item
  report_metrics: [sampled_plaintext_bytes, roundtrip_mismatches, window20_reconciliation_mismatches]

  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/exp-chunk/release/ebr-cdcpack, /root/eb-research/target/exp-chunk/release/ebr-access, /root/eb-research/target/exp-chunk/release/ebr-origin]
  timeout_s: 14400

analysis:
  baseline: sq-balanced
  pairing: item
  report_metrics: [open_bytes_read, http_bytes_range_4k_mean, verified_range_fetch_bytes, http_requests_random_entry_mean, remote_random_entry_latency_s_np_cont_modelled]

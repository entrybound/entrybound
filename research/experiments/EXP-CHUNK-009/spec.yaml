schema: ebr.spec.v1
experiment_id: EXP-CHUNK-009
status: pre-registration-draft; NEEDS_TOOLING (ebr-access --mode archive with spawned loopback origin, latency model, ebr-cdcpack); arm D (deterministic bytes and requests)
question: >
  How do chunk size policies change the cost of local and remote access to INDEXED
  archives: bytes read to open, bytes and HTTP range requests per random entry and per
  4 KiB range, verified-range fetch bytes, and modelled remote latency per network profile;
  and (timing arms) local first/random entry latency and full extraction time?
hypothesis: >
  Arm D: http_bytes per 4 KiB random range grows roughly in proportion to target chunk
  size above 64 KiB, so the fast preset is DISTINGUISHABLE_WORSE than balanced on
  verified_range_fetch_bytes by more than 1 band unit, while http_requests per random
  entry is EQUIVALENT across sizes for entries smaller than the minimum chunk size; open
  bytes are dominated by Index size, which grows as chunk size falls. Falsification in
  protocol.md section 3.
decision_ids: [DEC-CMP-002, DEC-CMP-001, DEC-CMP-017]

candidates:
  - name: sq-fast
    params: {sizes: 'frozen:fast', codec_profile: fast}
  - name: sq-balanced
    params: {sizes: 'frozen:balanced', codec_profile: balanced}
  - name: sq-dense
    params: {sizes: 'frozen:dense', codec_profile: dense}
  - name: sq-extreme
    params: {sizes: 'frozen:extreme', codec_profile: extreme}
  - name: gear-norm-v1-t64k-balanced-codec
    params: {sizes: '16384/65536/262144', codec_profile: balanced}
  - name: gear-norm-v1-t256k-balanced-codec
    params: {sizes: '65536/262144/1048576', codec_profile: balanced}
  - name: gear-norm-v1-t1m-balanced-codec
    params: {sizes: '262144/1048576/4194304', codec_profile: balanced}
  - name: gear-norm-v1-t4m-balanced-codec
    params: {sizes: '1048576/4194304/16777216', codec_profile: balanced}
command: >-
  /root/eb-research/target/exp-chunk/release/ebr-cdcpack --item-path {item_path}
  --experiment-id EXP-CHUNK-009 --env-name wsl-ubuntu --algorithm gear-norm-v1
  --size-set {sizes} --selection proxy-frozen --codec-profile {codec_profile} --planner v6
  --layout indexed --archive-out {scratch}/a.eb > {scratch}/pack.json &&
  /root/eb-research/target/exp-chunk/release/ebr-access --mode archive --archive-path {scratch}/a.eb
  --experiment-id EXP-CHUNK-009 --env-name wsl-ubuntu --source-kind http-spawn-origin
  --sample-size 1000 --sample-seed 20260917 --large-entry-threshold-bytes 1048576
  --byte-ranges-per-large-entry 16 --byte-range-len 4096 --verified-range true
  --request-log-out /root/eb-research/results/EXP-CHUNK-009/{candidate}/{item_id}.requests.jsonl.gz
  --latency-model /mnt/d/Projects/entrybound/entrybound/research/methods/thresholds.json
  --connection-model /mnt/d/Projects/entrybound/entrybound/research/raw/EXP-NETEM-CAL/connection-model.json
shell: bash


metrics:
  - {name: open_bytes_read, source: stdout_json, key: payload.open.bytes_fetched, family: size, direction: minimize, unit: B}
  - {name: http_requests_open, source: stdout_json, key: payload.open.range_requests, family: other, direction: minimize, unit: count}
  - {name: http_requests_random_entry_mean, source: stdout_json, key: payload.random_entry.range_requests_mean, family: other, direction: minimize, unit: count}
  - {name: http_bytes_random_entry_mean, source: stdout_json, key: payload.random_entry.bytes_fetched_mean, family: size, direction: minimize, unit: B}
  - {name: http_bytes_range_4k_mean, source: stdout_json, key: payload.random_range_4k.bytes_fetched_mean, family: size, direction: minimize, unit: B}
  - {name: verified_range_fetch_bytes, source: stdout_json, key: payload.random_range_4k.verified_fetch_bytes_mean, family: size, direction: minimize, unit: B}
  - {name: verification_digest_ops, source: stdout_json, key: payload.random_range_4k.digest_ops_mean, family: other, direction: minimize, unit: count}
  - {name: remote_random_entry_latency_s_np_metro_modelled, source: stdout_json, key: payload.model.np_metro.random_entry_latency_s_mean, family: time_wall, direction: minimize, unit: s}
  - {name: remote_random_entry_latency_s_np_cont_modelled, source: stdout_json, key: payload.model.np_cont.random_entry_latency_s_mean, family: time_wall, direction: minimize, unit: s}
  - {name: remote_random_entry_latency_s_np_inter_modelled, source: stdout_json, key: payload.model.np_inter.random_entry_latency_s_mean, family: time_wall, direction: minimize, unit: s}
  - {name: remote_first_entry_latency_s_np_cont_modelled, source: stdout_json, key: payload.model.np_cont.first_entry_latency_s, family: time_wall, direction: minimize, unit: s}
  - {name: verified_fraction, source: stdout_json, key: payload.random_range_4k.verified_fraction, family: other, direction: maximize, unit: fraction}
  - {name: artifact_bytes, source: path_size, path: '{scratch}/a.eb', family: size, direction: minimize, unit: B}
  - {name: archive_sha256, source: path_sha256, path: '{scratch}/a.eb', family: correctness}
  - {name: request_log_sha256, source: path_sha256, path: '/root/eb-research/results/EXP-CHUNK-009/{candidate}/{item_id}.requests.jsonl.gz', family: correctness}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 2
warmups: 0
seeds: {order: 2026091791, bootstrap: 2026091792, command: 2026091793}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:

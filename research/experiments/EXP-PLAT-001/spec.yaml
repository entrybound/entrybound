    target: loop-vfat
- name: ntfs3g-windows-names
  params:
    target: ntfs3g-windows-names
- name: ntfs3g-xattr-streams
  params:
    target: ntfs3g-xattr-streams
- name: loop-ext4-casefold
  params:
    target: loop-ext4-casefold
- name: drvfs-mnt-d-control
  params:
    target: drvfs-mnt-d-control
- name: cifs-loopback-samba
  params:
    target: cifs-loopback-samba
- name: nfs4-loopback-knfsd
  params:
    target: nfs4-loopback-knfsd
command: bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-001/scripts/linux_capability_probe.sh

# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-001
status: pre-registration-draft
question: Which capability cells are available per Linux target and privilege context, and how accurate
  are non-writing predictors?
hypothesis: Capability vectors are deterministic per context; the query predictor agrees with write probes
  where the OS exposes a query; the static table misses at least one case.
decision_ids:
- DEC-PLT-062
- DEC-PLT-014
- DEC-PLT-003
- DEC-PLT-047
candidates:
- name: wsl-ext4
  params:
    target: wsl-ext4
- name: loop-ext4-i128
  params:
    target: loop-ext4-i128
- name: loop-xfs-bigtime
  params:
    target: loop-xfs-bigtime
- name: loop-xfs-nobigtime
  params:
    target: loop-xfs-nobigtime
- name: loop-btrfs
  params:
    target: loop-btrfs
- name: tmpfs
  params:
    target: tmpfs
- name: loop-vfat

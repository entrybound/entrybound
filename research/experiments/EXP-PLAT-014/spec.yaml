command: /root/eb-research/venv/bin/python /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-014/scripts/confinement_suite.py
  --backend {backend} --scenarios-from {item_id} --arms A,B,C,D,E,G --scratch {scratch} --detail-dir /mnt/d/Projects/entrybound/entrybound/research/raw/EXP-PLAT-014/detail

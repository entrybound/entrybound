- name: eb-statusquo-capstd
  params:
    backend: production
- name: proto-openat2-inroot-nosymlinks
  params:
    backend: openat2-inroot
- name: proto-openat2-beneath-nosymlinks-noxdev
  params:
    backend: openat2-beneath-noxdev
- name: proto-openat-nofollow-walk

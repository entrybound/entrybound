# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-014
status: pre-registration-draft
question: Do containment backends keep every extraction operation beneath the root under interleaving
  swaps, random races, chains, root swaps and injected mechanism failures, and do they report modes truthfully?
hypothesis: Status quo has no Linux escape but misreports under ENOSYS; lexical Safe admits an escaping
  chain; unlinkat-excl-retry overwrite is race-safe while rename-over is not.
decision_ids:
- DEC-PLT-005
- DEC-PLT-006
- DEC-PLT-004
- DEC-PLT-017
- DEC-PLT-041
- DEC-PLT-009
- DEC-PLT-039
- DEC-PLT-047
- DEC-PLT-034
- DEC-PLT-001
- DEC-INT-004
- DEC-MOD-038

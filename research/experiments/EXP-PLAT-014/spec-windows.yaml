    backend: ntcreatefile-walk
- name: tarexe-replay
  params:
    backend: tarexe
- name: 7zip-win-replay
  params:
    backend: sevenzip
- name: expand-archive-replay
  params:
    backend: expand-archive
- name: py313-win-replay

schema: ebr.spec.v1
experiment_id: EXP-PLAT-014
status: pre-registration-draft
question: Do Windows extraction backends stay inside the root under oplock-paused and random junction/rename
  swaps, and do Windows incumbents escape on replay cases?
hypothesis: Status quo escapes or misreports under at least one oplock-paused junction swap unless every
  component is opened reparse-aware.
decision_ids:
- DEC-PLT-005
- DEC-PLT-006
- DEC-PLT-004
- DEC-PLT-017
- DEC-PLT-041
- DEC-PLT-009
- DEC-PLT-039
- DEC-PLT-047
- DEC-PLT-034
- DEC-PLT-001
- DEC-INT-004
- DEC-MOD-038

schema: ebr.spec.v1
experiment_id: EXP-CONF-005
status: designed
question: >
  Arm C: is ebcc-gen regeneration of the exported conformance corpus byte-identical across repeated runs on WSL x86-64
  and on QEMU user-mode emulated linux/arm64, and can a non-Rust reader consume the exported corpus as inert data?
hypothesis: >
  H3: every regenerated case SHA-256 equals the committed manifest on every run and host; falsified by one differing
  case. H4: no case of at most 256 MiB requires generator execution to consume; falsified by one such case.
decision_ids: [DEC-ECO-042, DEC-ECO-012]
notes: >
  Design pre-registration (Phase C-design); runs after gate G-A. Conventions:
  research/experiments/_index/conformance-conventions.md. The single generated item is an anchor only (regeneration
  does not read it). The Windows-host arm is spec-windows.yaml; arm D (verifier adapters) is spec-adapters.yaml; arms A,
  B, E and F are scripted analyses described in protocol.md. EMULATED qualifier applies to the arm64 candidate.

candidates:
  - name: regen-wsl-x86_64
    params:
      gen_bin: /root/eb-research/target/harness/release/ebcc-gen
      runner_prefix: none
  - name: regen-linux-arm64-emulated
    params:
      gen_bin: /root/eb-research/target/harness/aarch64-unknown-linux-gnu/release/ebcc-gen
      runner_prefix: /usr/bin/qemu-aarch64-static
command: >-
  /usr/bin/python3 research/conformance/tools/regen_check.py
  --gen {gen_bin} --runner-prefix {runner_prefix} --seed 2809170401
  --out /root/eb-research/scratch/EXP-CONF-005/{candidate}/rep{rep}
  --compare research/conformance/corpus/ebcc-v1/manifest.json
  --consume-with /root/eb-research/independent-reader/ebir-v1/ebir
  --experiment-id EXP-CONF-005 --env-name wsl-ubuntu
shell: bash

corpus:
  generated:
    - item_id: conf005-anchor
      family: synthetic-anchor
      generator: zeros-v1
      bytes: 1
      seed: 2809170401

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: none, unit: s}
  - {name: cases_regenerated, source: stdout_json, key: payload.cases_regenerated, family: other, direction: none, unit: count}
  - {name: cases_sha256_mismatch, source: stdout_json, key: payload.cases_sha256_mismatch, family: correctness, direction: minimize, unit: count}
  - {name: hash_locked_cases, source: stdout_json, key: payload.hash_locked_cases, family: other, direction: none, unit: count}
  - {name: cases_needing_generator_to_consume, source: stdout_json, key: payload.cases_needing_generator_to_consume, family: other, direction: minimize, unit: count}
  - {name: corpus_bytes_exported, source: stdout_json, key: payload.corpus_bytes_exported, family: size, direction: none, unit: B}
  - {name: regenerated_manifest_sha256, source: stdout_json, key: payload.regenerated_manifest_sha256, family: correctness, kind: string}
  - {name: build_identity_sha256, source: stdout_json, key: payload.build_identity_sha256, family: correctness, kind: string}

repetitions: 2
warmups: 0
seeds: {order: 2026091728, bootstrap: 2026091729, command: 2809170401}
timing: false
order: sequential
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires:
    - /root/eb-research/target/harness/release/ebcc-gen
    - /usr/bin/qemu-aarch64-static
    - research/conformance/corpus/ebcc-v1/manifest.json
  timeout_s: 43200

analysis:
  baseline: regen-wsl-x86_64
  pairing: item
  report_metrics: [cases_sha256_mismatch, cases_needing_generator_to_consume, hash_locked_cases, corpus_bytes_exported]

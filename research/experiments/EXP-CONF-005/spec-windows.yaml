schema: ebr.spec.v1
experiment_id: EXP-CONF-005-WIN
status: designed
question: >
  Arm C (Windows host): is ebcc-gen regeneration of the exported conformance corpus byte-identical across repeated runs
  on the Windows 11 x86-64 host and identical to the committed manifest produced on WSL?
hypothesis: >
  H3 (Windows): every regenerated case SHA-256 equals the committed manifest on both runs; falsified by one differing
  case.
decision_ids: [DEC-ECO-042]
notes: >
  Design pre-registration (Phase C-design); runs after gate G-A on the Windows host with the Windows research venv.
  Scratch on local NTFS outside the repository (D:/eb-research/scratch). The generated item is an anchor only.

candidates:
  - name: regen-windows-x86_64
    params:
      gen_bin: D:/eb-research/target/harness/release/ebcc-gen.exe
command: >-
  C:/Python313/python.exe research/conformance/tools/regen_check.py
  --gen {gen_bin} --runner-prefix none --seed 2809170401
  --out D:/eb-research/scratch/EXP-CONF-005-WIN/{candidate}/rep{rep}
  --compare research/conformance/corpus/ebcc-v1/manifest.json
  --consume-with none --experiment-id EXP-CONF-005-WIN --env-name windows-host
shell: pwsh

corpus:
  generated:
    - item_id: conf005-anchor-win
      family: synthetic-anchor
      generator: zeros-v1
      bytes: 1
      seed: 2809170401

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: none, unit: s}
  - {name: cases_regenerated, source: stdout_json, key: payload.cases_regenerated, family: other, direction: none, unit: count}
  - {name: cases_sha256_mismatch, source: stdout_json, key: payload.cases_sha256_mismatch, family: correctness, direction: minimize, unit: count}
  - {name: hash_locked_cases, source: stdout_json, key: payload.hash_locked_cases, family: other, direction: none, unit: count}
  - {name: regenerated_manifest_sha256, source: stdout_json, key: payload.regenerated_manifest_sha256, family: correctness, kind: string}
  - {name: build_identity_sha256, source: stdout_json, key: payload.build_identity_sha256, family: correctness, kind: string}

repetitions: 2
warmups: 0
seeds: {order: 2026091728, bootstrap: 2026091729, command: 2809170401}
timing: false
order: sequential
raw_compression: gzip

platform:
  os: [windows]
  arch: [x86_64]
  emulated: false
  requires:
    - D:/eb-research/target/harness/release/ebcc-gen.exe
    - research/conformance/corpus/ebcc-v1/manifest.json
  timeout_s: 43200

analysis:
  baseline: regen-windows-x86_64
  pairing: item
  report_metrics: [cases_sha256_mismatch, hash_locked_cases]

command: >-
  /root/eb-research/target/planner-harness/release/ebr-planner replan --item-path {item_path} --generation {generation} --profile {profile}
  --policy {policy} --ebound /root/eb-research/target/planner-cli/release/ebound --scratch {scratch}
  --experiment-id EXP-PLANNER-010 --env-name wsl-ubuntu
shell: bash

corpus:
  manifest: research/planner/derived/g1-psub-64.json
  splits: [tuning]

metrics:
  - {name: source_artifact_bytes, source: stdout_json, key: source.artifact_bytes, family: size, direction: none, unit: B}
  - {name: artifact_bytes, source: stdout_json, key: result.artifact_bytes, family: size, direction: minimize, unit: B}
  - {name: lai_preserved, source: stdout_json, key: lai_equal, family: correctness, direction: maximize}
  - {name: pcr_equal, source: stdout_json, key: pcr_equal, family: correctness, direction: none}
  - {name: pci_equal, source: stdout_json, key: pci_equal, family: correctness, direction: none}
  - {name: identity_pattern_conforms, source: stdout_json, key: identity_pattern_conforms_spec_8_1, family: correctness, direction: maximize}
  - {name: result_pci, source: stdout_json, key: result.pci, family: correctness, kind: string}
  - {name: source_planner_id, source: stdout_json, key: source_planner_id, family: correctness, kind: string}
  - {name: result_planner_id, source: stdout_json, key: result_planner_id, family: correctness, kind: string}
  - {name: report_correct, source: stdout_json, key: report_matches_actual_change, family: correctness, direction: maximize}
  - {name: work_bytes_examined, source: stdout_json, key: work.bytes_examined, family: other, direction: none, unit: B}
  - {name: roundtrip_mismatches, source: stdout_json, key: roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 2
warmups: 0
seeds: {order: 260917101, bootstrap: 260917102, command: 260917103}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/planner-harness/release/ebr-planner, /root/eb-research/target/planner-cli/release/ebound]
  timeout_s: 86400

analysis:
  baseline: replan-v6-balanced-current
  pairing: item
  report_metrics: [artifact_bytes, lai_preserved, pci_equal]

notes: >
  NEEDS_TOOLING: TP-12 ebr-planner pack-generation/replan (source archive via
  PlannerVersion::plan of the generation, then the policy's replan: current =
  production ebound repack --profile; pinned/source = PlannerVersion::plan with
  the recorded generation; current-report = current plus a report of planner and
  PCR change), TP-15 G1-PSUB-64. LAI change is an HC-10 violation artifact.

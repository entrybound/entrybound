schema: ebr.spec.v1
experiment_id: EXP-PLANNER-010
status: design
question: >
  Replan matrix: for source archives packed with planner generation v2-v6 under
  each profile, what do repack policies current (ebound repack, status quo),
  pinned, source and current-report produce: LAI/PCR/AUX change pattern per
  SPEC section 8.1, PCI and PCR reproduction of the source, artifact_bytes delta,
  and replan work units?
hypothesis: >
  See research/experiments/EXP-PLANNER-010/protocol.md section 2 (H1.1, H1.2):
  current changes PCI for v2-v5 sources and preserves LAI everywhere; pinned
  reproduces source PCI exactly on the same build.
decision_ids: [DEC-CMP-040, DEC-INT-046]


# EXP-CON-004 spec.yaml. Pre-registered design (Phase C-design, container domain).
# Deterministic capability battery over every tuning item; remote latency of these layouts is not measured here (EXP-REMOTE-004 owns remote open cost).
# Conventions: research/experiments/_index/container-conventions.md. Do not run before gate G-A;
# runs before G-B are NOT_DECISION_GRADE. Tuning split only; validation looks are derived (CT-4).
schema: ebr.spec.v1
experiment_id: EXP-CON-004
status: pre-registered-design
question: Which integrity, access, bounding and canonicality guarantees can retrofit containers (tar with
  zstd:chunked or eStargz TOCs, ZIP with digest-carrying central directories, legacy archives with an
  ECF sidecar, dual publishing) deliver compared with the native ECF container on the same content, and
  at what metadata access cost?
hypothesis: 'H1: every retrofit candidate fails at least two capability tests that native-ecf-balanced-indexed
  passes (expected: declared bounds before payload, fail-closed unknown critical extensions, unique canonical
  encoding, truncation detected at every offset), while at least one retrofit matches native on random
  entry access and verified single-entry reads. Falsified if some retrofit passes every capability test
  native passes. See protocol.md section 2.'
decision_ids:
- DEC-CON-022
- DEC-CON-002
candidates:
- name: native-ecf-balanced-indexed
  params:
    container: native-ecf
    companion: none
- name: retrofit-tar-zstd-chunked-toc
  params:
    container: tar-zstd-chunked
    companion: none
- name: retrofit-estargz-toc
  params:
    container: estargz
    companion: none
- name: retrofit-zip-central-directory-digests
  params:
    container: zip-cd-digest-extra
    companion: none
- name: sidecar-tar-zstd-plus-ecf-sidecar
  params:
    container: tar-zstd
    companion: ecf-sidecar
- name: dual-publish-ecf-plus-tar-zstd
  params:
    container: native-ecf
    companion: dual-tar-zstd
- name: legacy-only-tar-zstd
  params:
    container: tar-zstd
    companion: none
- name: legacy-only-zip
  params:
    container: zip
    companion: none
command: bash /mnt/d/Projects/entrybound/entrybound/research/tools/container/retrofit/build_container.sh
  --item-path {item_path} --container {container} --companion {companion} --prod-cli /root/eb-research/target/prod-9e44608/release/ebound
  --pack-cache /mnt/d/Projects/entrybound/entrybound/research/tools/container/pack_cache.sh --out-dir
  {scratch}/c && python3 /mnt/d/Projects/entrybound/entrybound/research/tools/container/retrofit/capability_battery.py
  --built {scratch}/c --container {container} --companion {companion} --item-path {item_path} --truncation-offsets
  1000 --flips-per-region 200 --random-entries 1000 --workload-file research/experiments/EXP-REMOTE-002/workloads.json
  --seed {seed} --prod-cli /root/eb-research/target/prod-9e44608/release/ebound --experiment-id EXP-CON-004
  --env-name wsl-ubuntu

# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-011
status: pre-registration-draft
question: What ACL maxima, canonicalization behaviour and NFSv4 ACE bits occur on reachable Linux, knfsd
  and FreeBSD ZFS targets?
hypothesis: Maxima stay below 65,536 ACEs; the kernel refuses malformed values; observed NFSv4 bits stay
  inside the frozen masks.
decision_ids:
- DEC-PLT-002
- DEC-PLT-052
- DEC-PLT-054
- DEC-PLT-029
- DEC-PLT-036
candidates:
- name: maxima-ext4
  params:
    arm: maxima
    target: ext4
- name: maxima-ext4-ea-inode
  params:
    arm: maxima
    target: ext4-ea_inode
- name: maxima-xfs
  params:
    arm: maxima
    target: xfs
- name: maxima-btrfs
  params:
    arm: maxima
    target: btrfs
- name: maxima-tmpfs
  params:
    arm: maxima
    target: tmpfs
- name: maxima-ntfs3g
  params:
    arm: maxima
    target: ntfs3g
- name: canon-trivial
  params:
    arm: canon-trivial
    target: ext4
- name: canon-malformed-fuzz
  params:
    arm: canon-fuzz
    target: ext4
- name: eb-capture-canon
  params:
    arm: eb-capture
    target: ext4
- name: nfs4-knfsd-loopback
  params:
    arm: nfs4-knfsd
    target: ext4
- name: freebsd-zfs-qemu
  params:
    arm: freebsd-zfs
    target: zfs
command: bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-011/scripts/acl_arms.sh
  --arm {arm} --target {target} --item {item_path} --item-id {item_id} --scratch {scratch} --detail-dir
  /mnt/d/Projects/entrybound/entrybound/research/raw/EXP-PLAT-011/detail

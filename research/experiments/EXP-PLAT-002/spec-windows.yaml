# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-002
status: pre-registration-draft
question: How does NTFS on the Windows host treat each hostile name class, and which extractors avoid
  silent merges, overwrites, normalization or skips?
hypothesis: Win32 paths strip trailing dots/spaces and merge case pairs; verbatim paths preserve them;
  the status quo leaves at least one silent merge.
decision_ids:
- DEC-PLT-028
- DEC-PLT-048
- DEC-MOD-038
- DEC-PLT-059
- DEC-PLT-011
- DEC-MOD-010
- DEC-MOD-036
- DEC-LEG-015
- DEC-LEG-054
- DEC-LEG-077
- DEC-LEG-079
candidates:
- name: ntfs-win32
  params:
    mode: win32
- name: ntfs-verbatim
  params:
    mode: verbatim
- name: ntfs-casesensitive-dir
  params:
    mode: casesensitive
- name: drvfs-view
  params:
    mode: drvfs
- name: git-for-windows-checkout
  params:
    mode: git
command: '& D:/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-002/scripts/path_matrix.ps1
  -Mode {mode} -CasesFrom {item_id} -Scratch {scratch} -DetailDir D:/Projects/entrybound/entrybound/research/raw/EXP-PLAT-002/detail-windows'
shell: pwsh
corpus:
  generated:
  - item_id: plat002-cases-tuning
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260917
  - item_id: plat002-cases-validation
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260918
metrics:
- name: hostile_name_handling_fraction
  source: stdout_json
  key: payload.hostile_name_handling_fraction
  family: correctness
  direction: none
  unit: fraction
- name: restore_fidelity_fraction
  source: stdout_json
  key: payload.restore_fidelity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: hc05_mvt05_escapes
  source: stdout_json
  key: payload.hc05_mvt05_escapes
  family: correctness
  direction: minimize
  unit: count
- name: platform_coverage_count
  source: stdout_json
  key: payload.platform_coverage_count
  family: other
  direction: none
  unit: count
- name: observation_sha256
  source: stdout_json
  key: payload.observation_sha256
  family: correctness
  kind: string
repetitions: 2
warmups: 0
record_warmups: true
seeds:
  order: 20260917
  bootstrap: 20260917
  command: 20260917
timing: false
order: sequential
raw_compression: gzip
platform:
  os:
  - windows
  arch:
  - x86_64
  emulated: false
  requires:
  - pwsh
  - fsutil
  - tar.exe
  - D:/eb-research/target/production-win/release/ebound.exe
  timeout_s: 7200
  scratch_root: D:/eb-research/scratch/platform
analysis:
  baseline: ntfs-win32
  pairing: item
  report_metrics:
  - hostile_name_handling_fraction
  - restore_fidelity_fraction
  - hc05_mvt05_escapes
  - platform_coverage_count
env:
  TEMP: D:/eb-research/tmp
  TMP: D:/eb-research/tmp

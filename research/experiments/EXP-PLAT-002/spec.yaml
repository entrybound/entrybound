# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-002
status: pre-registration-draft
question: How does each Linux target treat each hostile name class, and which extractors and rule sets
  avoid silent merges, overwrites, normalization or skips?
hypothesis: Every non-POSIX-native target transforms or aliases at least one class; a per-target refusal
  table has zero misses and beats the portable superset on exact restores.
decision_ids:
- DEC-PLT-028
- DEC-PLT-048
- DEC-MOD-038
- DEC-PLT-059
- DEC-PLT-011
- DEC-MOD-010
- DEC-MOD-036
- DEC-LEG-015
- DEC-LEG-054
- DEC-LEG-077
- DEC-LEG-079

    target: ext4-casefold
command: /root/eb-research/venv/bin/python /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-002/scripts/path_matrix.py
  --target {target} --cases-from {item_id} --extractors ebound,gnutar,bsdtar,sevenzip,unzip,py312,py313,py314
  --scratch {scratch} --detail-dir /mnt/d/Projects/entrybound/entrybound/research/raw/EXP-PLAT-002/detail

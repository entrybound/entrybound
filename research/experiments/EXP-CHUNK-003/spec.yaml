schema: ebr.spec.v1
experiment_id: EXP-CHUNK-003
status: pre-registration-draft; NEEDS_TOOLING (ebr-chunk edit-sweep, version pairing manifests)
question: >
  How well do CDC constructions and sizes preserve chunk boundaries and limit new
  unique stored bytes under realistic edits (inserts, deletes and overwrites of 1 B to
  1 MiB, bursts, block moves, prepend/append) and across real consecutive versions
  (F17, F18), and does any construction degrade on adversarial periodic content?
hypothesis: >
  H1: every CDC candidate bounds new unique bytes per small edit (<= 4096 B) to at most
  3 x the configured maximum chunk size at p95, while fixed-size does not after
  insert/delete; spread-mask Gear and FastCDC resynchronize no later than gear-norm-v1;
  on F18 version pairs no algorithm differs from gear-norm-v1 by more than the T-01 band
  on pair dedup_stored_fraction at matched means. Falsification in protocol.md section 3.
decision_ids: [DEC-CMP-001, DEC-CMP-002, DEC-CMP-017]


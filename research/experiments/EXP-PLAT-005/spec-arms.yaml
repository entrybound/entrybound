# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-005
status: pre-registration-draft
question: How much AUX churn do copy variants and hardlink alias edits cause, and do legacy adapters assign
  different declarations to identical name bytes?
hypothesis: Copy variants change AUX only through declared host-dependent classes; one alias edit changes
  AUX of every member of the group under the path-derived construction.
decision_ids:
- DEC-MOD-049
- DEC-MOD-050
- DEC-CON-030
- DEC-MOD-002
- DEC-MOD-022
- DEC-MOD-030
- DEC-MOD-035
- DEC-MOD-028
- DEC-MOD-025
- DEC-MOD-019
- DEC-CON-010
- DEC-CRY-008
- DEC-PLT-003
- DEC-PLT-022
- DEC-PLT-049
- DEC-PLT-062

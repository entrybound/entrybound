- name: copy-sparse-always
  params:
    arm: copy
    variant: sparse-always
- name: copy-sparse-never
  params:
    arm: copy
    variant: sparse-never
- name: copy-cp-r
  params:
    arm: copy
    variant: cp-r
- name: copy-gnutar-roundtrip

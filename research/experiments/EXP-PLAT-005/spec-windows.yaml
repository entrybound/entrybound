schema: ebr.spec.v1
experiment_id: EXP-PLAT-005
status: pre-registration-draft
question: Which identity roots and feature bits differ when the same tree is packed on Windows NTFS after
  robocopy copy or git checkout?
hypothesis: LAI differs from Linux for trees with executables (F-0002) and 0x10000 is always required
  (F-0001).
decision_ids:
- DEC-MOD-049
- DEC-MOD-050
- DEC-CON-030
- DEC-MOD-002
- DEC-MOD-022
- DEC-MOD-030
- DEC-MOD-035
- DEC-MOD-028
- DEC-MOD-025
- DEC-MOD-019
- DEC-CON-010
- DEC-CRY-008
- DEC-PLT-003
- DEC-PLT-022
- DEC-PLT-049
- DEC-PLT-062
candidates:
- name: windows-ntfs-robocopy
  params:
    mode: robocopy
- name: windows-ntfs-git-checkout
  params:
    mode: git
command: '& D:/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-005/scripts/identity_capture.ps1
  -Mode {mode} -Item {item_path} -ItemId {item_id} -Scratch {scratch} -DetailDir D:/Projects/entrybound/entrybound/research/raw/EXP-PLAT-005/detail-windows'

# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-004
status: pre-registration-draft
question: Per class and Linux platform pair, what fraction of metadata do Entrybound and incumbents capture
  and restore exactly, and are all differences declared?
hypothesis: Status quo restores POSIX classes exactly under grants, captures 0 of NTFS-only classes, and
  leaves at least one undeclared difference; GNU tar pax is non-inferior on POSIX classes.
decision_ids:
- DEC-PLT-035
- DEC-PLT-024
- DEC-PLT-049
- DEC-PLT-016
- DEC-PLT-008
- DEC-PLT-055
- DEC-PLT-022
- DEC-PLT-025
- DEC-MOD-009
- DEC-MOD-035
- DEC-LEG-068

# EXP-CON-005 spec-windows.yaml. Pre-registered design (Phase C-design, container domain).
# Windows-host arm (st-p = {2}) over NTFS copies of small and medium tuning items (EXP-CON-007 staging).
# Conventions: research/experiments/_index/container-conventions.md. Do not run before gate G-A;
# runs before G-B are NOT_DECISION_GRADE. Tuning split only; validation looks are derived (CT-4).
schema: ebr.spec.v1
experiment_id: EXP-CON-005
status: pre-registered-design
question: How do production open, list, first-entry and random-entry latency and parser memory scale with
  entry count, layout and Index presence today, on the WSL and Windows hosts, and at which entry counts
  do the bootstrap default policies refuse legitimate archives?
hypothesis: 'H1: production open latency and alloc_peak_bytes__open grow at least linearly in entry count
  for INDEXED and STREAM (whole-manifest residency), and the bootstrap policy refuses benign archives
  below the 1e6 entry limit because the declared metadata bytes exceed 1 GiB. Falsified if open cost is
  sublinear or no benign archive below 1e6 entries is refused. See protocol.md section 2.'
decision_ids:
- DEC-CON-018
- DEC-CON-015
- DEC-CON-028
candidates:
- name: indexed-balanced
  params:
    layout: indexed
    profile: balanced
    enc: none
- name: stream-balanced
  params:
    layout: stream
    profile: balanced
    enc: none
- name: indexed-balanced-index-absent
  params:
    layout: indexed-noindex
    profile: balanced
    enc: none
- name: indexed-balanced-encrypted-password
  params:
    layout: indexed
    profile: balanced
    enc: password
command: '& D:\Projects\entrybound\entrybound\research\tools\container\pack_cache.ps1 -ItemPath {item_path}
  -Profile {profile} -Layout {layout} -Encrypt {enc} -PrintPathTo {scratch}\pack.path; if ($LASTEXITCODE
  -ne 0) {{ exit 1 }}; & D:\eb-research\target\harness\release\ebr-openers.exe --mode bench --archive-path-file
  {scratch}\pack.path --ops open,list,first-entry,random-entry --batch 1000 --random-sample 1000 --seed
  {seed} --prod-cli D:\eb-research\target\prod-9e44608\release\ebound.exe --prod-parity-ops list --experiment-id
  EXP-CON-005 --env-name windows-host'
shell: pwsh

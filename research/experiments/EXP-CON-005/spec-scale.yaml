  - linux
  arch:
  - x86_64
  emulated: false
  requires:
  - /root/eb-research/target/prod-9e44608/release/ebound
  - /root/eb-research/target/harness/release/ebr-openers
  - /mnt/d/Projects/entrybound/entrybound/research/tools/container/scale_probe.sh

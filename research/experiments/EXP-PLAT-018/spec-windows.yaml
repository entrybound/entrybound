# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-018
status: pre-registration-draft
question: Do Windows status-quo predicates and share modes detect or prevent seeded concurrent mutations
  during pack and random reads on NTFS D:?
hypothesis: Length plus mtime misses same-size rewrites; ChangeTime detects them; deny-write sharing blocks
  the writer.
decision_ids:
- DEC-CMP-028
- DEC-ACC-023
- DEC-LEG-056
- DEC-PLT-044
candidates:
- name: ntfs-d
  params:
    mode: plain
- name: ntfs-d-sharemode
  params:
    mode: sharemode
command: '& D:/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-018/scripts/instability_arms.ps1
  -Mode {mode} -SchedulesFrom {item_id} -Scratch {scratch}'
shell: pwsh
corpus:
  generated:
  - item_id: plat018-schedules-tuning
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260917
  - item_id: plat018-schedules-validation
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260918
metrics:
- name: hc07_mvt07d_mixed_version_entries
  source: stdout_json
  key: payload.hc07_mvt07d_mixed_version_entries
  family: correctness
  direction: minimize
  unit: count
- name: capture_fidelity_fraction
  source: stdout_json
  key: payload.capture_fidelity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: unstable_source_retry_cost_s
  source: stdout_json
  key: payload.unstable_source_retry_cost_s
  family: other
  direction: none
  unit: s
- name: events_detected_len_mtime
  source: stdout_json
  key: payload.events_detected_len_mtime
  family: other
  direction: none
- name: events_detected_changetime
  source: stdout_json
  key: payload.events_detected_changetime
  family: other
  direction: none
- name: events_total
  source: stdout_json
  key: payload.events_total
  family: other
  direction: none
- name: observation_sha256
  source: stdout_json
  key: payload.observation_sha256
  family: correctness
  kind: string
repetitions: 2
warmups: 0
record_warmups: true
seeds:
  order: 20260917
  bootstrap: 20260917
  command: 20260917
timing: false
order: sequential
raw_compression: gzip
platform:
  os:
  - windows
  arch:
  - x86_64
  emulated: false
  requires:
  - pwsh
  - D:/eb-research/target/production-win/release/ebound.exe
  timeout_s: 14400
  scratch_root: D:/eb-research/scratch/platform
analysis:
  baseline: ntfs-d
  pairing: item
  report_metrics:
  - hc07_mvt07d_mixed_version_entries
  - capture_fidelity_fraction
  - unstable_source_retry_cost_s
  - events_detected_len_mtime
  - events_detected_changetime
  - events_total
env:
  TEMP: D:/eb-research/tmp
  TMP: D:/eb-research/tmp

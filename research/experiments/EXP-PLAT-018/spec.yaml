- name: events_detected_len_mtime
  source: stdout_json
  key: payload.events_detected_len_mtime
  family: other
  direction: none
- name: events_detected_ctime
  source: stdout_json
  key: payload.events_detected_ctime
  family: other
  direction: none
- name: events_total
  source: stdout_json
  key: payload.events_total
  family: other
  direction: none
- name: observation_sha256
  source: stdout_json
  key: payload.observation_sha256
  family: correctness
  kind: string
repetitions: 2
warmups: 0
record_warmups: true

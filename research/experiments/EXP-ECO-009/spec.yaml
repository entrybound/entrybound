schema: ebr.spec.v1
experiment_id: EXP-ECO-009
status: design
question: >
  For each local server, CDN-like or object-store configuration, does the status-quo remote reader list,
  inspect and read entries correctly or refuse safely, and how do the DEC-ACC-015 client policies behave on
  the recorded transcripts, including mixed-revision cases? (protocol.md sections 1, 4)
hypothesis: >
  H1 the strict status quo refuses at least one configuration that serves correct ranges; H2 relaxed
  validators are safe against mixed revisions only with content verification; H4 no HTTP/3 request is used
  at runtime. Falsification in protocol.md section 2.
notes: >
  Design-stage spec. Servers bind to 127.0.0.1. Policy replay runs inside the sample
  (range_policy_probe.py) and is summarized as counts; the public read-only arm is script-driven.
decision_ids: [DEC-ACC-015, DEC-ECO-057, DEC-ACC-016]
candidates:
  - name: S01-nginx-default
    params: {server: S01}
  - name: S02-nginx-gzip-all
    params: {server: S02}
  - name: S03-nginx-etag-off
    params: {server: S03}
  - name: S04-apache-default
    params: {server: S04}
  - name: S05-apache-deflate-all
    params: {server: S05}
  - name: S06-caddy-default
    params: {server: S06}
  - name: S07-caddy-http3
    params: {server: S07}
  - name: S08-lighttpd-default
    params: {server: S08}
  - name: S09-python-http-server
    params: {server: S09}
  - name: S10-minio-public
    params: {server: S10}
  - name: S11-minio-presigned
    params: {server: S11}
  - name: S12-azurite-sas
    params: {server: S12}
  - name: S13-fake-gcs-public
    params: {server: S13}
  - name: S14-origin-strict
    params: {server: S14}
  - name: S15-origin-weak-etag
    params: {server: S15}
  - name: S16-origin-no-head
    params: {server: S16}
  - name: S17-origin-200-whole-body
    params: {server: S17}
  - name: S18-origin-etag-churn
    params: {server: S18}
  - name: S19-origin-redirect

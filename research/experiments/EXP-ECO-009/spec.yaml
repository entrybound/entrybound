command: >-
  /root/eb-research/venv/bin/python
  /mnt/d/Projects/entrybound/entrybound/research/tools/ecosystem/hosting/live_run.py
  --server {server} --item {item_path} --item-id {item_id}
  --ebound /root/eb-research/target/eco-head/release/ebound --policies all --scratch {scratch}
shell: bash
corpus:
  splits: [tuning]
  manifest: research/corpus/manifest.json
  item_ids:
    - f01-tuning-ripgrep-14-1-1-git
    - f04-tuning-sourcelike
    - f18-tuning-lz4-releases-1-9-to-1-10
    - f07-tuning-silesia-mr
metrics:
  - {name: operations_total, source: stdout_json, key: operations_total, family: other, direction: none, unit: count}
  - {name: operations_correct, source: stdout_json, key: operations_correct, family: correctness, direction: maximize, unit: count}
  - {name: operations_refused, source: stdout_json, key: operations_refused, family: other, direction: none, unit: count}
  - {name: unverified_bytes_reported_verified, source: stdout_json, key: unverified_bytes_reported_verified, family: correctness, direction: minimize, unit: count}
  - {name: http_requests, source: stdout_json, key: http_requests, family: other, direction: minimize, unit: count}
  - {name: http_bytes, source: stdout_json, key: http_bytes, family: size, direction: minimize, unit: B}
  - {name: policy_unsafe_count, source: stdout_json, key: policy_unsafe_count, family: correctness, direction: minimize, unit: count}
  - {name: actionable_refusals, source: stdout_json, key: actionable_refusals, family: other, direction: maximize, unit: count}
  - {name: http_protocol_used, source: stdout_json, key: http_protocol_used, family: other, kind: string}
  - {name: transcript_sha256, source: stdout_json, key: transcript_sha256, family: correctness, kind: string}
repetitions: 2
warmups: 0
seeds: {order: 2026091709, bootstrap: 2026091709, command: 2026091709}
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/eco-head/release/ebound, nginx, apache2, lighttpd, /root/eb-research/tools/caddy/caddy, /root/eb-research/tools/minio/minio]
  timeout_s: 1800
analysis:
  baseline: S01-nginx-default
  pairing: item
  report_metrics: [operations_correct, operations_refused, unverified_bytes_reported_verified, http_requests, http_bytes, policy_unsafe_count]

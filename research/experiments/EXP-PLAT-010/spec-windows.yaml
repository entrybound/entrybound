# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-010
status: pre-registration-draft
question: 'How are sparse files reported and restored on NTFS D: under the status quo?'
hypothesis: NTFS reports allocated ranges; status quo on Windows records no sparse map and restores logically.
decision_ids:
- DEC-PLT-045
- DEC-MOD-026
- DEC-MOD-002
- DEC-LEG-020
candidates:
- name: ntfs-d-restore
  params:
    policy: restore
- name: ntfs-d-logical
  params:
    policy: logical
command: '& D:/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-010/scripts/sparse_windows.ps1
  -Policy {policy} -Item {item_path} -ItemId {item_id} -Scratch {scratch}'
shell: pwsh
corpus:
  splits:
  - tuning
  - validation
  manifest: research/corpus/manifest.json
  item_ids:
  - f15-validation-edgecases
  - f15-tuning-dbprealloc
metrics:
- name: capture_fidelity_fraction
  source: stdout_json
  key: payload.capture_fidelity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: restore_fidelity_fraction
  source: stdout_json
  key: payload.restore_fidelity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: roundtrip_mismatches
  source: stdout_json
  key: payload.roundtrip_mismatches
  family: correctness
  direction: none
  unit: count
- name: observation_sha256
  source: stdout_json
  key: payload.observation_sha256
  family: correctness
  kind: string
repetitions: 2
warmups: 0
record_warmups: true
seeds:
  order: 20260917
  bootstrap: 20260917
  command: 20260917
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os:
  - windows
  arch:
  - x86_64
  emulated: false
  requires:
  - pwsh
  - fsutil
  - D:/eb-research/target/production-win/release/ebound.exe
  timeout_s: 7200
  scratch_root: D:/eb-research/scratch/platform
analysis:
  baseline: ntfs-d-restore
  pairing: item
  report_metrics:
  - capture_fidelity_fraction
  - restore_fidelity_fraction
  - roundtrip_mismatches
env:
  TEMP: D:/eb-research/tmp
  TMP: D:/eb-research/tmp
  EB_DATA_ROOT: //wsl.localhost/Ubuntu/root/eb-research

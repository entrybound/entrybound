schema: ebr.spec.v1
experiment_id: EXP-ECO-003
status: design
question: >
  Do feature-partitioned prototype builds preserve production pack bytes (default features) and
  production reader outcomes (read partitions), and which partitions fail closed on unsupported
  features? (protocol.md sections 1-2, H2 and H3; census and timing arms are separate)
hypothesis: >
  H2: P1-default pack output SHA-256 equals production for every item, profile and layout, and every
  read partition matches production (class, reason code, logical tree) or returns UNSUPPORTED with zero
  output; H3: the ruzstd reader decodes every production Zstandard frame bit-exactly. Any failure
  falsifies the prototype (fixed and re-run as a new build version).
notes: >
  Design-stage spec. Stored P0 archives (4 profiles x 2 layouts per item) are produced first by
  research/tools/ecosystem/partition/build_all.sh --store-p0-archives. The validation look uses
  spec-validation.yaml generated by make_specs.py with the protocol's validation list.
decision_ids: [DEC-ECO-016, DEC-ACC-016, DEC-ECO-041, DEC-ECO-038, DEC-CMP-008, DEC-CMP-007]
candidates:
  - name: P1-default
    params: {build: P1-default}
  - name: P1-read-baseline
    params: {build: P1-read-baseline}
  - name: P1-read-extended
    params: {build: P1-read-extended}
  - name: P1-read-remote
    params: {build: P1-read-remote}
  - name: P1-read-remote-min
    params: {build: P1-read-remote-min}
  - name: P1-read-baseline-ruzstd
    params: {build: P1-read-baseline-ruzstd}
  - name: B-store
    params: {build: B-store}
  - name: B-store-zstd
    params: {build: B-store-zstd}
  - name: B-store-zstd-lz4
    params: {build: B-store-zstd-lz4}
  - name: B-store-zstd-lzma2
    params: {build: B-store-zstd-lzma2}
command: >-
  /root/eb-research/venv/bin/python
  /mnt/d/Projects/entrybound/entrybound/research/tools/ecosystem/partition/probe_partition.py
  --build {build} --build-root /root/eb-research/target/eco003
  --p0-archives /root/eb-research/cache/eco003/p0/{item_id}
  --item {item_path} --item-id {item_id} --scratch {scratch}
shell: bash
corpus:
  splits: [tuning]
  manifest: research/corpus/manifest.json
  item_ids:
    - f01-tuning-ripgrep-14-1-1-git
    - f01-tuning-curl-8-19-0-git
    - f02-tuning-lz4-intree-make-build
    - f04-tuning-sourcelike
    - f05-tuning-gutenberg-books
    - f06-tuning-gen-structured-a-small
    - f07-tuning-gen-numeric-a-small
    - f08-tuning-gen-sqlite-tpch-small
    - f10-gen-redundant-binary-blobs
    - f13-tuning-nasa-ntrs-pdf-small
    - f18-tuning-lz4-releases-1-9-to-1-10
    - f19-tuning-real-home-snapshot
    - f20-tuning-real-libarchive-testsuite
    - f20-tuning-generated-malicious-structures
metrics:
  - {name: pack_identity_mismatches, source: stdout_json, key: pack_identity_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: reader_disagreements, source: stdout_json, key: reader_disagreements, family: correctness, direction: minimize, unit: count}
  - {name: unsupported_not_fail_closed, source: stdout_json, key: unsupported_not_fail_closed, family: correctness, direction: minimize, unit: count}
  - {name: roundtrip_mismatches, source: stdout_json, key: roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: archives_checked, source: stdout_json, key: archives_checked, family: other, direction: none, unit: count}
  - {name: result_sha256, source: stdout_json, key: result_sha256, family: correctness, kind: string}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}
repetitions: 2
warmups: 0
seeds: {order: 2026091703, bootstrap: 2026091703, command: 2026091703}
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/eco003/P1-default/release/ebound]
  timeout_s: 3600
analysis:
  baseline: P1-default
  pairing: item
  report_metrics: [pack_identity_mismatches, reader_disagreements, unsupported_not_fail_closed, roundtrip_mismatches]

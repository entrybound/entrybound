schema: ebr.spec.v1
experiment_id: EXP-CODEC-007-overhead
status: pre-registration-draft (gate G-A pending; timing gated on decision-method 14 items 3 and 4)
notes: 'Generated by make_specs.py. ebr-pack packs STREAM (production planner, --stream-window auto) and computes exact per-frame field size and in-process STREAM decode plus check CPU (TOOLING).'
question: 'What artifact_bytes and STREAM decode CPU would a per-frame stored-bytes digest (BLAKE3 or SHA-256) or CRC32C add on every tuning item at balanced and extreme?'
hypothesis: 'H1b-H1c: a 32-byte digest is equivalent on medium/large items and may exceed the relative band on small many-chunk items; BLAKE3 check CPU stays within one T-05 band unit; SHA-256 costs 1-3 band units on highly compressible items.'
decision_ids: [DEC-INT-008]
candidates:
  - name: none-balanced
    params: {digest: none, profile: balanced}
  - name: none-extreme
    params: {digest: none, profile: extreme}
  - name: crc32c-balanced
    params: {digest: crc32c, profile: balanced}
  - name: crc32c-extreme
    params: {digest: crc32c, profile: extreme}
  - name: blake3-balanced
    params: {digest: blake3, profile: balanced}
  - name: blake3-extreme
    params: {digest: blake3, profile: extreme}
  - name: sha256-balanced
    params: {digest: sha256, profile: balanced}
  - name: sha256-extreme
    params: {digest: sha256, profile: extreme}
command: >-
  /root/eb-research/target/harness/release/ebr-pack --item-path {item_path} --experiment-id EXP-CODEC-007-overhead --env-name wsl-ubuntu
  --profile {profile} --layout stream --stream-window auto --stream-digest-overhead {digest}
  --timing-mode in-process --sink memory --summary-stdout
shell: bash
corpus:
  manifest: research/corpus/manifest.json
  splits: [tuning]
metrics:
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}
  - {name: artifact_bytes, source: stdout_json, key: payload.artifact_bytes_with_field, family: size, direction: minimize, unit: B}
  - {name: stream_frame_count, source: stdout_json, key: payload.stream_frame_count, family: other, direction: none, unit: count}
  - {name: decode_cpu_s, source: stdout_json, key: payload.timed.stream_decode_plus_check_cpu_s, family: time_cpu, direction: minimize, unit: s}
  - {name: check_cpu_s, source: stdout_json, key: payload.timed.check_cpu_s, family: time_cpu, direction: minimize, unit: s}
  - {name: roundtrip_mismatches, source: stdout_json, key: payload.roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: ratio, source: derived, op: ratio, args: [artifact_bytes, input_bytes], family: size, direction: minimize}
repetitions: 10
warmups: 2
record_warmups: true
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: true
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  cpu_affinity: [2]
  requires: [/root/eb-research/target/harness/release/ebr-pack]
  timeout_s: 21600
guard:
  max_loadavg_1m: 2.0
  max_other_cpu_percent: 3.0
  max_wait_s: 300
analysis:
  baseline: none-balanced
  pairing: item_repetition
  report_metrics: [artifact_bytes, decode_cpu_s, check_cpu_s]

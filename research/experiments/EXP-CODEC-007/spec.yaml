schema: ebr.spec.v1
experiment_id: EXP-CODEC-007
status: pre-registration-draft (gate G-A pending)
notes: 'Generated by make_specs.py. Packs each item with the production ebound build (CC-2) and applies the single-frame rule checker (TOOLING) to every stored payload.'
question: 'Would a rule rejecting extra frames, skippable frames and trailing bytes refuse any codec payload production writes today, at any profile and layout?'
hypothesis: 'H1a: benign_false_refusal_fraction = 0 over every payload (binary census).'
decision_ids: [DEC-INT-008]
candidates:
  - name: fast-indexed
    params: {profile: fast, layout: indexed}
  - name: fast-stream
    params: {profile: fast, layout: stream}
  - name: balanced-indexed
    params: {profile: balanced, layout: indexed}
  - name: balanced-stream
    params: {profile: balanced, layout: stream}
  - name: dense-indexed
    params: {profile: dense, layout: indexed}
  - name: dense-stream
    params: {profile: dense, layout: stream}
  - name: extreme-indexed
    params: {profile: extreme, layout: indexed}
  - name: extreme-stream
    params: {profile: extreme, layout: stream}
command: >-
  /root/eb-research/target/production/release/ebound pack {item_path} {scratch}/a.eb --profile {profile} --layout {layout}
  --stream-window auto >/dev/null &&
  /root/eb-research/target/harness/release/ebr-codec single-frame-check --archive-path {scratch}/a.eb --experiment-id EXP-CODEC-007 --env-name wsl-ubuntu --summary-stdout
shell: bash
corpus:
  manifest: research/corpus/manifest.json
  splits: [tuning]
metrics:
  - {name: payloads, source: stdout_json, key: payload.payloads, family: other, direction: none, unit: count}
  - {name: refused_payloads, source: stdout_json, key: payload.refused_payloads, family: correctness, direction: minimize, unit: count}
  - {name: benign_false_refusal_fraction, source: stdout_json, key: payload.benign_false_refusal_fraction, family: other, direction: minimize, unit: fraction}
  - {name: archive_sha256, source: path_sha256, path: '{scratch}/a.eb', family: correctness}
repetitions: 2
warmups: 0
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/production/release/ebound, /root/eb-research/target/harness/release/ebr-codec]
  timeout_s: 172800
analysis:
  pairing: item
  report_metrics: [refused_payloads, benign_false_refusal_fraction]

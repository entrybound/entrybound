schema: ebr.spec.v1
experiment_id: EXP-CODEC-007-refusal
status: pre-registration-draft (gate G-A pending; timing gated on decision-method 14 items 3 and 4)
notes: 'Generated by make_specs.py. Items: hostile STREAM archives from gen_stream_hostile.py (seeded; lock file; manifest stream-hostile-manifest.json, split=generated), including F20 bomb items repacked as STREAM. Allocator build for refusal_alloc_peak_bytes.'
question: 'How much CPU, memory and input does a STREAM reader consume before rejecting hostile frames under each DEC-INT-008 candidate, and is every rejection a distinguishable failure?'
hypothesis: 'H1d: status-quo hardened decoders stop within budgets but spend at least one T-05 band unit more refusal CPU than a stored-bytes digest check; CRC32C does not reject crafted frames with valid CRCs; no hostile frame yields OK.'
decision_ids: [DEC-INT-008]
candidates:
  - name: hardened-decoders-and-budgets
    params: {cand: hardened-decoders-and-budgets}
  - name: stream-stored-bytes-digest-blake3
    params: {cand: stream-stored-bytes-digest-blake3}
  - name: stream-stored-bytes-digest-sha256
    params: {cand: stream-stored-bytes-digest-sha256}
  - name: per-frame-crc32c
    params: {cand: per-frame-crc32c}
  - name: enforce-single-frame-no-trailing
    params: {cand: enforce-single-frame-no-trailing}
command: >-
  /root/eb-research/target/harness-alloc/release/ebr-codec stream-refusal --archive-path {item_path} --experiment-id EXP-CODEC-007-refusal
  --env-name wsl-ubuntu --candidate {cand} --summary-stdout
shell: bash
corpus:
  manifest: research/experiments/EXP-CODEC-007/stream-hostile-manifest.json
  splits: [generated]
metrics:
  - {name: refusal_cpu_s, source: stdout_json, key: payload.refusal_cpu_s, family: time_cpu, direction: minimize, unit: s}
  - {name: refusal_alloc_peak_bytes, source: stdout_json, key: payload.refusal_alloc_peak_bytes, family: memory_peak, direction: minimize, unit: B}
  - {name: refusal_bytes_read, source: stdout_json, key: payload.refusal_bytes_read, family: size, direction: minimize, unit: B}
  - {name: ok_on_hostile, source: stdout_json, key: payload.ok_on_hostile, family: correctness, direction: minimize, unit: count}
  - {name: outcome_class, source: stdout_json, key: payload.outcome_class, family: correctness, kind: string}
repetitions: 10
warmups: 2
record_warmups: true
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: true
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  cpu_affinity: [2]
  requires: [/root/eb-research/target/harness-alloc/release/ebr-codec]
  timeout_s: 21600
guard:
  max_loadavg_1m: 2.0
  max_other_cpu_percent: 3.0
  max_wait_s: 300
analysis:
  baseline: hardened-decoders-and-budgets
  pairing: item_repetition
  report_metrics: [refusal_cpu_s, refusal_alloc_peak_bytes, ok_on_hostile]

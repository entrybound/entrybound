schema: ebr.spec.v1
experiment_id: EXP-CHUNK-001
status: pre-registration-draft (gate G-A pending; see protocol.md section 1)
question: >
  At the four frozen production CDC presets, how do the existing research CDC
  algorithms (fixed-size baseline, FastCDC 2016/2020 at NC-1..3, Rabin, Buzhash,
  AE, RAM, TTTD) compare with gear-norm-v1 on within-item exact-chunk dedup,
  chunk-size distribution, boundary stability under small edits and chunk-level
  random-access amplification, on tuning items with at most 64 files?
hypothesis: >
  Tuning screen (exploratory, R3/R4 without multiplicity control). H1: at matched
  realized mean chunk size, gear-norm-v1 is not distinguishable from the best
  alternative on dedup_stored_fraction in most families, but at least one alternative
  beats it by more than the T-01 band on low-entropy or periodic content (F15, F16,
  F20 gear-extremes). Negative control: fixed-size preserves almost no boundaries
  after insert/delete edits. Falsified per protocol.md section 3.
decision_ids: [DEC-CMP-001, DEC-CMP-002]


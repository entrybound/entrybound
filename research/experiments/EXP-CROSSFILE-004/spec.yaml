# EXP-CROSSFILE-004 ebr spec generated by research/experiments/EXP-CROSSFILE-001/make_crossfile_specs.py
# Pre-registration design (see protocol.md). Do not edit by hand; regenerate.
schema: ebr.spec.v1
experiment_id: EXP-CROSSFILE-004
status: pre-registration-design
question: Which lookback values and prefix window should each profile allow, is chained prefix lookback sufficient
  versus leader-only, restarts, caps, larger/LDM windows and bounded-solid blocks, and are declared access costs
  direct or transitive?
hypothesis: 'H1a: status-quo declarations under-state transitive closure (declared_cost_accuracy fails) for groups
  longer than max_lookback+1; H1b: k in {1,2} captures >= 70% of the k=8 byte gain and k=16/32 adds < 1 T-01 band
  unit; H1c: restart-n4 or cap-group-len8 keeps >= 80% of the k=4 gain with bounded closure; H1d: only transitive/dictionary-inclusive
  blast definitions reach recall 1; H0: lookback > 0 gains nothing beyond band over dictionaries.'
decision_ids:
- DEC-CMP-027
- DEC-ACC-025
- DEC-INT-002
- DEC-ACC-001
- DEC-CMP-013
- DEC-CON-004

# EXP-CON-007 spec.yaml. Pre-registered design (Phase C-design, container domain).
# READY: needs only ebound-prod, harness ebr-inspect-bytes and ebr-pack, and jq. WSL ext4 host. Join key cell links rows to EXP-PLANNER-001.
# Conventions: research/experiments/_index/container-conventions.md. Do not run before gate G-A;
# runs before G-B are NOT_DECISION_GRADE. Tuning split only; validation looks are derived (CT-4).
schema: ebr.spec.v1
experiment_id: EXP-CON-007
status: pre-registered-design
question: Beyond the planner-domain census (EXP-PLANNER-001), which feature bits do encrypted archives,
  legacy conversions with provenance and preservation, and Windows-packed archives require, and under
  each feature-tier assignment policy what fraction of real archives would a minimal or older reader have
  to refuse?
hypothesis: 'H1: every Windows-packed archive requires 0x10000 (F-0001) and every converted archive requires
  0x2000 (and 0x4000 when preserving), so under the status-quo all-incompat policy a reader lacking auxiliary-metadata
  support refuses 100% of Windows-packed and converted archives, while an auxiliary-as-compat policy refuses
  none of them for content extraction. Falsified by any Windows-packed archive without 0x10000 or any
  conversion without 0x2000. See protocol.md section 2.'
decision_ids:
- DEC-CON-010
- DEC-MOD-024
candidates:
- name: balanced-indexed-join-key
  params:
    mode: pack
    profile: balanced
    layout: indexed
    enc: none
- name: balanced-indexed-encrypted
  params:
    mode: pack
    profile: balanced
    layout: indexed
    enc: password
- name: convert-strict-zip-members
  params:
    mode: convert-strict
    profile: balanced
    layout: indexed
    enc: none
- name: convert-preserve-zip-members
  params:
    mode: convert-preserve
    profile: balanced
    layout: indexed
    enc: none
command: bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-CON-007/census_row.sh --mode
  {mode} --item-path {item_path} --out {scratch}/a.eb --profile {profile} --layout {layout} --encrypt
  {enc} --ebound /root/eb-research/target/prod-9e44608/release/ebound --inspect-bytes /root/eb-research/target/harness/release/ebr-inspect-bytes

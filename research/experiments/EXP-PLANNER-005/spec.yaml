schema: ebr.spec.v1
experiment_id: EXP-PLANNER-005
status: design
question: >
  Under each profile's v6 codec stage, what real artifact_bytes, section bytes,
  access granularity and chunk counts does each chunking policy (frozen
  FAST/BALANCED/DENSE/EXTREME_V2, DEC-CMP-002 reference classes, min/max ratio
  and window-matched variants) and each granularity (archive-wide, per
  category, per size class, per object, global single, DwarFS-style) produce,
  so that chunking selection rules (DEC-CMP-004), granularity (DEC-CMP-003),
  per-profile lists (DEC-CMP-002) and uniform-vs-per-category binding
  (DEC-MOD-039) can be analysed offline without further packing?
hypothesis: >
  See research/experiments/EXP-PLANNER-005/protocol.md section 2 (proxy agrees
  with end-to-end selection on >=80% of sub-items in dense/extreme; corrected
  constants non-inferior; multi-chunker granularities fail the T4 minimum gain;
  2K/8K/64K class breaches the chunk-count limit or loses; single global policy
  costs >1 band unit in dense/extreme).
decision_ids: [DEC-CMP-004, DEC-CMP-003, DEC-CMP-002, DEC-MOD-039]


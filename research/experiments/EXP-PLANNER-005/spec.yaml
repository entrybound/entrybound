command: >-
  /root/eb-research/target/planner-harness/release/ebr-planner chunking-matrix --item-path {item_path} --chunking {chunking} --codec-stage {stage} --granularity {granularity} --categoriser signature-v0 --granularity-map /mnt/d/Projects/entrybound/entrybound/research/normalized/EXP-PLANNER-005/replay/granularity-maps.json --layout indexed --experiment-id EXP-PLANNER-005 --env-name wsl-ubuntu --archive-out {scratch}/archive.eb
shell: bash

corpus:
  manifest: research/planner/derived/psub-256.json
  splits: [tuning]

metrics:
  - {name: artifact_bytes, source: stdout_json, key: artifact_bytes, family: size, direction: minimize, unit: B}
  - {name: modelled_declaration_bytes, source: stdout_json, key: modelled_declaration_bytes, family: size, direction: minimize, unit: B}
  - {name: research_only_multi_chunker, source: stdout_json, key: research_only_multi_chunker, family: correctness, direction: none}
  - {name: proxy_cost_status_quo, source: stdout_json, key: proxy_cost_status_quo, family: size, direction: none, unit: B}
  - {name: proxy_cost_sampled, source: stdout_json, key: proxy_cost_sampled, family: size, direction: none, unit: B}
  - {name: index_bytes, source: stdout_json, key: byte_accounting.index_bytes, family: size, direction: minimize, unit: B}
  - {name: diag_chunk_payload_bytes, source: stdout_json, key: byte_accounting.chunk_payload_bytes, family: size, direction: none, unit: B}
  - {name: metadata_bytes, source: derived, op: difference, args: [artifact_bytes, diag_chunk_payload_bytes], family: size, direction: minimize, unit: B}
  - {name: access_granularity_bytes, source: stdout_json, key: access_granularity_bytes, family: size, direction: minimize, unit: B}
  - {name: dedup_stored_fraction, source: stdout_json, key: dedup_stored_fraction, family: size, direction: minimize, unit: ratio}
  - {name: diag_unique_chunk_count, source: stdout_json, key: unique_chunk_count, family: other, direction: none, unit: count}
  - {name: diag_logical_chunk_references, source: stdout_json, key: logical_chunk_references, family: other, direction: none, unit: count}
  - {name: diag_cross_category_duplicate_bytes, source: stdout_json, key: cross_category_duplicate_bytes, family: size, direction: none, unit: B}
  - {name: work_bytes_examined, source: stdout_json, key: work.bytes_examined, family: other, direction: none, unit: B}
  - {name: identity_pcr, source: stdout_json, key: pcr, family: correctness, kind: string}
  - {name: artifact_sha256, source: path_sha256, path: "{scratch}/archive.eb", family: correctness}
  - {name: roundtrip_mismatches, source: stdout_json, key: roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 2
warmups: 0
seeds: {order: 260917051, bootstrap: 260917052, command: 260917053}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 1
  scratch_root: /root/eb-research/scratch/ebr
  requires: [/root/eb-research/target/planner-harness/release/ebr-planner]
  timeout_s: 86400

analysis:
  baseline: BALANCED_V2--balanced
  pairing: item
  report_metrics: [artifact_bytes, metadata_bytes, access_granularity_bytes, dedup_stored_fraction]


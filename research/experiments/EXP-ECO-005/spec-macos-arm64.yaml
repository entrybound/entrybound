schema: ebr.spec.v1
experiment_id: EXP-ECO-005-MACOS-ARM64
status: blocked
question: >
  On aarch64-apple-darwin, are pack outputs, identity roots (LAI, PCR, AUX) and the six frozen export
  profiles byte-identical across toolchains, and is PCR equal to the x86-64 results of EXP-ECO-004?
  (protocol.md H1-H3)
hypothesis: >
  H2 PCR equals the x86-64 PCR for every tuning cell with only documented macOS metadata-class LAI/AUX
  differences; H3 frozen export profile bytes equal the x86-64 bytes. Any unexplained difference
  falsifies the hypothesis.
notes: >
  BLOCKED design spec: no macOS host (PLATFORM_BLOCKED). Items are APFS materializations under
  /Users/Shared/eb-research/corpus-mac/<item_id> made from WSL pax tarballs; the manifest selects ids only.
decision_ids: [DEC-ECO-073, DEC-MOD-011, DEC-LEG-008, DEC-ECO-003, DEC-ECO-041]
candidates:
  - name: tc-1.98.1
    params: {tc: 1.98.1}
  - name: tc-1.94
    params: {tc: '1.94'}
  - name: tc-stable-latest
    params: {tc: stable-latest}
command: >-
  python3 /Users/Shared/eb-research/entrybound/research/tools/ecosystem/release/pack_matrix.py
  --ebound /Users/Shared/eb-research/target/eco005/{tc}/release/ebound
  --item /Users/Shared/eb-research/corpus-mac/{item_id} --item-id {item_id} --scratch {scratch}
shell: bash
corpus:

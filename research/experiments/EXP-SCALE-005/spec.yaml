    - /root/eb-research/venv/bin/python
    - taskset
  poll_interval_s: 1.0
  timeout_s: 21600

analysis:
  pairing: item_repetition
  report_metrics: [distinct_pci, repack_pci_equal_direct, replan_pci_equal, enc_ciphertext_differs]

schema: ebr.spec.v1
experiment_id: EXP-ECO-008-DECODE
status: design
question: >
  Is ebound unpack non-inferior to zstd -d | tar -x on decode_wall_s and peak_rss_bytes for CI hand-off
  artifacts? (protocol.md H2)
hypothesis: >
  H2 ebound unpack of a fast STREAM archive is NON_INFERIOR on decode_wall_s. Falsified by DISTINGUISHABLE_WORSE.
notes: >
  Design-stage timing spec (st-v). Artifacts are produced once by prepare.sh outside timing. The roundtrip_ok
  check gates every sample (objective section 3.0).
decision_ids: [DEC-ECO-004]
candidates:
  - name: inc-tar-zstd3-long30-t1
    command: >-
      mkdir -p {scratch}/out && zstd -d -T1 --long=30 -q -c /root/eb-research/cache/eco008/inc-tar-zstd3-long30-t1/{item_id}.bin | tar -xf - -C {scratch}/out
  - name: inc-tar-lz4-t1
    command: >-
      mkdir -p {scratch}/out && lz4 -d -q -c /root/eb-research/cache/eco008/inc-tar-lz4-t1/{item_id}.bin | tar -xf - -C {scratch}/out
  - name: ebound-fast-stream
    command: >-
      /root/eb-research/target/eco-head/release/ebound unpack /root/eb-research/cache/eco008/ebound-fast-stream/{item_id}.bin {scratch}/out
  - name: ebound-fast-indexed
    command: >-
      /root/eb-research/target/eco-head/release/ebound unpack /root/eb-research/cache/eco008/ebound-fast-indexed/{item_id}.bin {scratch}/out
  - name: ebound-balanced-indexed
    command: >-
      /root/eb-research/target/eco-head/release/ebound unpack /root/eb-research/cache/eco008/ebound-balanced-indexed/{item_id}.bin {scratch}/out
shell: bash
corpus:
  splits: [tuning]
  manifest: research/corpus/manifest.json
  item_ids:
    - f01-tuning-curl-8-19-0-git
    - f01-tuning-zstd-v1-5-7-full-clone
    - f02-tuning-lz4-intree-make-build
    - f02-tuning-zstd-cmake-build
    - f03-tuning-fzf-go-mod-vendor
    - f03-tuning-ripgrep-cargo-vendor
    - f03-tuning-typescript-npm-node-modules
    - f04-tuning-sourcelike
    - f04-tuning-maildir
    - f04-tuning-real-netbsd-pkgsrc
    - f18-tuning-ripgrep-commit-snapshots
metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: minimize, unit: s}
  - {name: cpu_s, source: resource, family: time_cpu, direction: minimize, unit: s}
  - {name: max_rss_bytes, source: resource, family: memory_peak, direction: minimize, unit: B}
  - {name: scratch_peak_bytes, source: scratch, family: scratch_peak, direction: minimize, unit: B}
  - {name: io_write_bytes, source: resource, family: io, direction: minimize, unit: B}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}
  - name: roundtrip_ok
    source: check
    command: /root/eb-research/venv/bin/python /mnt/d/Projects/entrybound/entrybound/research/tools/ecosystem/ci/tree_equal.py {item_path} {scratch}/out
    family: correctness
    direction: maximize
repetitions: 10
warmups: 2
record_warmups: true
seeds: {order: 2026091718, bootstrap: 2026091718, command: 2026091718}
timing: true
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 8
  cpu_affinity: [2]
  requires: [/root/eb-research/target/eco-head/release/ebound, tar, zstd, lz4, taskset, sha256sum]
  timeout_s: 3600
guard:
  max_loadavg_1m: 2.0
  max_other_cpu_percent: 3.0
  max_wait_s: 300
analysis:
  baseline: inc-tar-zstd3-long30-t1
  pairing: item_repetition
  report_metrics: [wall_s, cpu_s, max_rss_bytes]

schema: ebr.spec.v1
experiment_id: EXP-CHUNK-002
status: pre-registration-draft; NEEDS_TOOLING (ebr-chunk tree-dedup and new algorithms); Stage A spec
question: >
  Over whole tuning trees (archive-wide exact-chunk dedup across files), how do all
  CDC constructions under consideration (gear-norm-v1, spread-mask Gear NC-1..3,
  FastCDC-2016, Rabin, Buzhash incl. Borg/casync windows, AE, RAM, TTTD, SeqCDC,
  VectorCDC/VRAM scalar rule, Chonkers, fixed-size baseline) compare on unique stored
  bytes, chunk-size distribution and per-category dedup at matched realized mean
  chunk size across a target grid (Stage A), and which survivors form Stage B's size
  grid?
hypothesis: >
  Stage A tuning screen. H1: at matched realized means, spread-mask Gear NC-2 is
  within the T-01 band of gear-norm-v1 on dedup_stored_fraction at corpus level and
  better by >= 1 band unit on low-entropy families (F15, F16, F20); hashless AE/RAM/
  SeqCDC lose >= 1 band unit on F10/F15/F16/F20; per-file chunking of F17/F18 is
  insensitive to algorithm (within band) at targets <= 512 KiB. Falsification in
  protocol.md section 3.
decision_ids: [DEC-CMP-001, DEC-CMP-002, DEC-CMP-003, DEC-MOD-039]


schema: ebr.spec.v1
experiment_id: EXP-EVAL-002
status: pre-registered-design
question: >
  How large is the whole Entrybound system (REF-PROD ebound built at 9e44608, every profile and
  layout, encrypted and retrofit arms) in artifact_bytes, fixed overhead, determinism, round-trip
  exactness and single-file self-containment, before comparison against the capability-matched
  specialist incumbents of archetypal-objective.md 1.3? (Tuning pilot shard: small tuning items;
  research/experiments/EXP-EVAL-002/protocol.md.)
hypothesis: >
  H1-H5 of protocol.md: dense/extreme are non-inferior to the per-item better of solid 7z and
  tar.xz at the CC-01 declared-cost tolerance; balanced INDEXED beats 7z non-solid on F01-F06 and
  F17-F18; dense is non-inferior on F17/F18 to long-window zstd and solid 7z; small-tier fixed
  overhead is at most 512 B; native .eb beats the tar.zst+sidecar retrofit. Round-trip mismatches
  are 0, unencrypted arms are repeat-hash deterministic, and encrypted arms never repeat bytes.
decision_ids: [DEC-CMP-011, DEC-ECO-070, DEC-ECO-031, DEC-ECO-069, DEC-CON-022, DEC-ECO-043, DEC-CRY-042]

command: >-
  bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-EVAL-002/refprod_sample.sh
  --ebound /root/eb-research/target/refprod/release/ebound
  --inspect /root/eb-research/target/harness/release/ebr-inspect-bytes
  --item {item_path} --scratch {scratch} --profile {profile} --layout {layout}
  --encrypt {encrypt} --pad {pad}
shell: bash

candidates:
  - {name: refprod-fast-indexed, params: {profile: fast, layout: indexed, encrypt: "false", pad: none}}
  - {name: refprod-balanced-indexed, params: {profile: balanced, layout: indexed, encrypt: "false", pad: none}}
  - {name: refprod-dense-indexed, params: {profile: dense, layout: indexed, encrypt: "false", pad: none}}
  - {name: refprod-extreme-indexed, params: {profile: extreme, layout: indexed, encrypt: "false", pad: none}}
  - {name: refprod-fast-stream, params: {profile: fast, layout: stream, encrypt: "false", pad: none}}
  - {name: refprod-balanced-stream, params: {profile: balanced, layout: stream, encrypt: "false", pad: none}}
  - {name: refprod-dense-stream, params: {profile: dense, layout: stream, encrypt: "false", pad: none}}
  - {name: refprod-extreme-stream, params: {profile: extreme, layout: stream, encrypt: "false", pad: none}}
  - {name: refprod-balanced-indexed-enc-bucketed, params: {profile: balanced, layout: indexed, encrypt: "true", pad: bucketed}}
  - {name: refprod-balanced-indexed-enc-none, params: {profile: balanced, layout: indexed, encrypt: "true", pad: none}}
  - {name: refprod-balanced-indexed-enc-max, params: {profile: balanced, layout: indexed, encrypt: "true", pad: max}}
  - name: retrofit-tarzstd19-sidecar
    params: {profile: balanced, layout: indexed, encrypt: "false", pad: none}
    command: >-
      bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-EVAL-002/retrofit_sample.sh
      --ebound /root/eb-research/target/refprod/release/ebound --item {item_path} --scratch {scratch}
  - name: concat-stream-min
    params: {profile: none, layout: none, encrypt: "false", pad: none}
    command: >-
      python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/concat_stream_min.py
      --item {item_path} --scratch {scratch}


metrics:
  - {name: output_bytes, source: path_size, path: "{scratch}/artifact.eb", family: size, direction: minimize, unit: B}
  - {name: artifact_sha256, source: path_sha256, path: "{scratch}/artifact.eb", family: correctness}
  - {name: artifact_bytes, source: stdout_json, key: artifact_bytes, family: size, direction: minimize, unit: B}
  - {name: metadata_bytes, source: stdout_json, key: metadata_bytes, family: size, direction: minimize, unit: B}
  - {name: index_bytes, source: stdout_json, key: index_bytes, family: size, direction: minimize, unit: B}
  - {name: dictionary_bytes, source: stdout_json, key: dictionary_bytes, family: size, direction: minimize, unit: B}
  - {name: side_data_bytes, source: stdout_json, key: side_data_bytes, family: size, direction: minimize, unit: B}
  - {name: named_bucket_total_bytes, source: stdout_json, key: named_bucket_total_bytes, family: correctness, direction: none, unit: B}
  - {name: concat_min_bytes, source: stdout_json, key: concat_min_bytes, family: size, direction: none, unit: B}
  - {name: roundtrip_ok, source: stdout_json, key: roundtrip_ok, family: correctness, direction: maximize}
  - {name: self_contained_ok, source: stdout_json, key: self_contained_ok, family: correctness, direction: maximize}
  - {name: verify_outcome, source: stdout_json, key: verify_outcome, family: correctness, kind: string}
  - {name: refusal_reason_code, source: stdout_json, key: refusal_reason_code, family: correctness, kind: string}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}
  - {name: ratio, source: derived, op: ratio, args: [artifact_bytes, input_bytes], family: size, direction: minimize}

repetitions: 2
warmups: 0
seeds: {order: 20260918, bootstrap: 20260918, command: 20260918}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires:
    - /root/eb-research/target/refprod/release/ebound
    - /root/eb-research/target/harness/release/ebr-inspect-bytes
    - zstd
    - xz
    - brotli
    - gzip
    - unshare
  timeout_s: 7200

analysis:
  baseline: refprod-balanced-indexed
  pairing: item
  report_metrics: [artifact_bytes, metadata_bytes, roundtrip_ok, self_contained_ok, ratio]

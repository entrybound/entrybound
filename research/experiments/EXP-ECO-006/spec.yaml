schema: ebr.spec.v1
experiment_id: EXP-ECO-006
status: design
question: >
  Do directory-input adoption workflows (W02, W04-W07, W09, W10, W12, W13) complete under their mechanical
  criteria, with how many commands and flags versus incumbent pipelines, and with correct handling of the
  pre-registered fault cases? (protocol.md sections 1, 4, 7)
hypothesis: >
  H1 status-quo variants complete W02, W04, W06, W12 and fail W09 directory diff and W10 add by design;
  H2 ebound publish needs fewer flags than the reproducible tar plus zip incantation; H4 every injected
  fault gives a non-zero class-mapped exit, an actionable message and no final-name partial output;
  H5 publish on vfat or 9P completes or refuses before writing. Falsification in protocol.md section 2.
notes: >
  Design-stage spec. Step files research/tools/ecosystem/workflows/steps/<W>/<variant>.sh are the counted
  command sequences and are committed before any run. Variants not applicable to an item print applicable=0.
  W03 reader checks run inside W02 samples; W14 is derived by derive_w14.py.
decision_ids: [DEC-ECO-002, DEC-ECO-004, DEC-ECO-019, DEC-ECO-043, DEC-ECO-057, DEC-ECO-065, DEC-ECO-075, DEC-CON-022, DEC-ACC-008, DEC-INT-037, DEC-LEG-010, DEC-LEG-017, DEC-LEG-018, DEC-LEG-029, DEC-LEG-036, DEC-LEG-038, DEC-MOD-043, DEC-PLT-037]

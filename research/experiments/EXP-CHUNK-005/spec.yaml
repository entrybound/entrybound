schema: ebr.spec.v1
experiment_id: EXP-CHUNK-005
status: pre-registration-draft; NEEDS_TOOLING (ebr-cdcpack granularity/selection modes, categorisers, constants fit, size-sets.json from EXP-CHUNK-004)
question: >
  Which chunking-parameter selection rule (frozen plaintext proxy, corrected constants,
  end-to-end complete cost, sampled compressed proxy, first member, weighted objective)
  and which parameter granularity (global, archive-wide per profile, per file-size class,
  per content category under two deterministic categorisers, per ContentObject) minimise
  complete archive bytes at bounded selection work, and what does mixed-parameter
  chunking cost in cross-category dedup and identity binding?
hypothesis: >
  H1: the frozen 164/40-byte proxy mis-ranks list members on a measurable share of
  archives, but end-to-end selection is not DISTINGUISHABLE_BETTER than the frozen
  proxy on artifact_bytes against the T1 band at corpus level; per-category and
  per-object granularity do not beat archive-wide selection against their tier band
  (T2 or higher). Falsification in protocol.md section 3.
decision_ids: [DEC-CMP-003, DEC-CMP-004, DEC-MOD-039, DEC-CMP-002]


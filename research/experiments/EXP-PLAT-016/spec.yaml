# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-016
status: pre-registration-draft
question: Which Linux platform capabilities are available through safe, exact, no-follow Rust APIs, and
  what does each FFI alternative cost?
hypothesis: Safe exact APIs exist for statx btime, SEEK_DATA/HOLE, renameat2, openat2, O_TMPFILE and fd
  xattrs; symlink mode changes cannot avoid following.
decision_ids:
- DEC-PLT-040
- DEC-PLT-030
- DEC-PLT-057
- DEC-PLT-017
- DEC-PLT-029
- DEC-PLT-042
- DEC-CRY-108

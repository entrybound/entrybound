- name: safe-probe
  params:
    route: safe
- name: ffi-probe
  params:
    route: ffi
command: bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-016/scripts/api_rows.sh
  --route {route} --scratch {scratch} --detail-dir /mnt/d/Projects/entrybound/entrybound/research/raw/EXP-PLAT-016/detail

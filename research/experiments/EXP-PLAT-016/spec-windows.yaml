# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-016
status: pre-registration-draft
question: Which Windows platform capabilities are available through safe, exact, no-follow Rust APIs without
  elevation, and what does each FFI alternative cost?
hypothesis: Creation time and read-only are settable safely; descriptor, reparse, ADS enumeration, allocated
  ranges and file IDs need unsafe inside dependencies or FFI.
decision_ids:
- DEC-PLT-040
- DEC-PLT-030
- DEC-PLT-057
- DEC-PLT-017
- DEC-PLT-029
- DEC-PLT-042
- DEC-CRY-108
- DEC-PLT-033
- DEC-PLT-049
- DEC-PLT-055
- DEC-PLT-003
- DEC-PLT-014
- DEC-PLT-016
- DEC-PLT-031
- DEC-PLT-044
- DEC-PLT-045
- DEC-PLT-037
- DEC-INT-003
- DEC-ACC-026
- DEC-CMP-028
candidates:
- name: safe-probe-win
  params:
    route: safe
- name: ffi-probe-win
  params:
    route: ffi
command: '& D:/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-016/scripts/api_rows.ps1 -Route
  {route} -Scratch {scratch} -DetailDir D:/Projects/entrybound/entrybound/research/raw/EXP-PLAT-016/detail-windows'
shell: pwsh
corpus:
  generated:
  - item_id: plat016-trigger
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260917
metrics:
- name: capture_fidelity_fraction
  source: stdout_json
  key: payload.capture_fidelity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: restore_fidelity_fraction
  source: stdout_json
  key: payload.restore_fidelity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: hc05_mvt05_escapes
  source: stdout_json
  key: payload.hc05_mvt05_escapes
  family: correctness
  direction: minimize
  unit: count
- name: rows_exact_safe
  source: stdout_json
  key: payload.rows_exact_safe
  family: other
  direction: none
- name: rows_exact_ffi_only
  source: stdout_json
  key: payload.rows_exact_ffi_only
  family: other
  direction: none
- name: rows_unavailable
  source: stdout_json
  key: payload.rows_unavailable
  family: other
  direction: none
- name: observation_sha256
  source: stdout_json
  key: payload.observation_sha256
  family: correctness
  kind: string
repetitions: 2
warmups: 0
record_warmups: true
seeds:
  order: 20260917
  bootstrap: 20260917
  command: 20260917
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os:
  - windows
  arch:
  - x86_64
  emulated: false
  requires:
  - pwsh
  - fsutil
  - D:/eb-research/target/harness-win/release/ebr-platform-probe.exe
  - D:/eb-research/target/prototypes-ffi/release/ebr-platform-probe-ffi.exe
  timeout_s: 3600
  scratch_root: D:/eb-research/scratch/platform
analysis:
  baseline: safe-probe-win
  pairing: item
  report_metrics:
  - capture_fidelity_fraction
  - restore_fidelity_fraction
  - hc05_mvt05_escapes
  - rows_exact_safe
  - rows_exact_ffi_only
  - rows_unavailable
env:
  TEMP: D:/eb-research/tmp
  TMP: D:/eb-research/tmp
  CARGO_HOME: D:/eb-research/cargo-home

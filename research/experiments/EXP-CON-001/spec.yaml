# EXP-CON-001 spec.yaml. Pre-registered design (Phase C-design, container domain).
# Deterministic pass over every tuning item (real trees packed by ebound-prod, REF-PROD balanced INDEXED).
# Conventions: research/experiments/_index/container-conventions.md. Do not run before gate G-A;
# runs before G-B are NOT_DECISION_GRADE. Tuning split only; validation looks are derived (CT-4).
schema: ebr.spec.v1
experiment_id: EXP-CON-001
status: pre-registered-design
question: Which physical manifest representation and canonical record encoding minimize manifest bytes
  per entry, bytes and requests to open, look up and list, and parser memory, from 1e3 to 1e7 entries,
  while staying canonical, single-authority and round-trip exact?
hypothesis: 'H1: on entry-heavy families and at >=1e5 synthetic entries, at least one non-status-quo representation
  is DISTINGUISHABLE_BETTER than m0-flat-tlv-u64 on metadata_bytes_per_entry by at least the T3 minimum-gain
  band, and paged or segmented representations cut open_bytes_read__lookup_mean by more than 1 band unit
  at >=1e5 entries. Falsified if every alternative is EQUIVALENT or INCONCLUSIVE with demonstrated power,
  or fails the correctness screens. See protocol.md section 2.'
decision_ids:

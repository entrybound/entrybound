schema: ebr.spec.v1
experiment_id: EXP-SCALE-008
status: design-draft
notes: >
  Design draft until gate G-A (decision-method.md section 0.4); NEEDS_TOOLING: the binaries named in requires are built by the tooling listed in protocol.md. Phase M (memory, identity, staging outcomes). Phase F (fault scenarios) and phase T (timing) specs are generated from EXP-SCALE-004 scenarios and this template before they run.
question: >
  Which read, verify, repack and staging designs bound memory for archives larger than RAM while keeping verification honest, identities exact and crash behaviour safe?
hypothesis: >
  Range-reader and two-phase INDEXED verification are M08.3-bounded and detect TOCTOU replacement; streamed repack preserves LAI/AUX/PCR; per-entry verified staging never exposes unverified final objects; cumulative staging accounting falsely refuses a 70 GiB archive.
decision_ids: [DEC-ACC-062, DEC-ACC-060, DEC-ACC-048, DEC-ACC-004, DEC-ACC-059, DEC-ACC-006, DEC-ACC-053, DEC-ACC-055, DEC-INT-039, DEC-INT-043, DEC-ACC-022, DEC-CON-026]


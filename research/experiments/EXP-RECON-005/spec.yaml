shell: bash

corpus:
  splits: [tuning]
  manifest: research/experiments/EXP-RECON-005/items-target-tuning.jsonl

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: minimize, unit: s}
  - {name: cpu_s, source: resource, family: time_cpu, direction: minimize, unit: s}
  - {name: max_rss_bytes, source: resource, family: memory_peak, direction: minimize, unit: B}
  - {name: scratch_peak_bytes, source: scratch, family: scratch_peak, direction: minimize, unit: B}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}
  - {name: in_process_pack_seconds, source: stdout_json, key: payload.pack_seconds, family: time_wall, direction: minimize, unit: s}
  - {name: latency_p50_s, source: stdout_json, key: payload.latency_p50_s, family: time_wall, direction: minimize, unit: s}
  - {name: latency_p95_s, source: stdout_json, key: payload.latency_p95_s, family: time_wall, direction: minimize, unit: s}
  - {name: verification_cpu_share, source: stdout_json, key: payload.verification_cpu_share, family: other, direction: none, unit: fraction}
  - name: sample_correct
    source: check
    command: "/root/eb-research/tools/EXP-RECON-005/bin/ebr-recon sample-check --op {op} --variant {variant} --profile {profile} --item-id {item_id} --item-path {item_path} --scratch {scratch} --expect-sha256-table /mnt/d/Projects/entrybound/entrybound/research/normalized/EXP-RECON-004/artifact-sha256.csv"
    family: correctness
    direction: maximize
  - {name: throughput_bps, source: derived, op: rate, args: [input_bytes, wall_s], family: throughput, direction: maximize}

repetitions: 10
warmups: 2
record_warmups: true
seeds: {order: 20260923, bootstrap: 20260923, command: 20260923}
timing: true
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 4
  cpu_affinity: [2]
  scratch_root: /root/eb-research/scratch/EXP-RECON-005
  requires:
    - /root/eb-research/tools/EXP-RECON-005/bin/ebound
    - /root/eb-research/tools/EXP-RECON-005/bin/ebr-recon
    - /root/eb-research/tools/EXP-RECON-005/bin/ebr-access
  timeout_s: 14400

guard:
  max_loadavg_1m: 2.0
  max_other_cpu_percent: 3.0
  sample_interval_s: 1.0
  max_wait_s: 600

analysis:
  baseline: pack-gen-v6-ebound-balanced
  pairing: item_repetition
  report_metrics: [wall_s, cpu_s, max_rss_bytes, latency_p50_s, throughput_bps]

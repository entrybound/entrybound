schema: ebr.spec.v1
experiment_id: EXP-RECON-005
status: pre-registered-design
question: >
  Target items: how do reconstruction candidates compare on pack, unpack, verify and random-entry
  latency under decision-grade WSL timing (st-v), and are research-build pack timings equivalent
  to the production ebound build?
hypothesis: >
  protocol.md section 3 (H1-H6): gating equivalent on encode CPU; reconstruction non-inferior at corpus
  level but worse on F12; JPEG-region decode and access worse beyond band; subprocess isolation
  non-inferior at corpus level; research and production v6 pack timings equivalent.
decision_ids: [DEC-CMP-018, DEC-CMP-026, DEC-CMP-023, DEC-CMP-012, DEC-CMP-037, DEC-CMP-042, DEC-CMP-044]
notes: >
  NEEDS_TOOLING plus calibration and runner-addition gates. Items come from select_items.py manifests
  committed before the first timing run. Checks are untimed and gate samples (common section 8.4).


schema: ebr.spec.v1
experiment_id: EXP-REMOTE-006
status: designed-needs-tooling
notes: >
  Phase C-design pre-registration (remote domain). Emulated timing arm at NP-CONT;
  spec-NP-METRO.yaml and spec-NP-INTER.yaml are generated by make_profile_specs.py
  (profile substitution only). subset-manifest.jsonl is written by make_subset.py
  (rows copied from research/corpus/manifest.json for the seeded tuning subset)
  before the run and does not exist at design time. Modelled latency (the primary
  value) is computed by latency_model.py multi from the same plans. Needs T1, T2,
  T3, T5 and a calibrated NP-CONT profile from EXP-REMOTE-001.
question: >
  Which remote fetch concurrency model minimizes task latency for single-entry,
  many-entry and whole-archive reads while keeping outputs and reports deterministic?
hypothesis: >
  Eight connections or HTTP/2 with 16 streams beat serial fetch by at least 3 band
  units on many-entry and whole-archive tasks at NP-CONT and NP-INTER; no candidate
  helps single small entries; report fields are identical across repetitions.
decision_ids: [DEC-ACC-043]

candidates:
  - {name: status-quo-serial-blocking, params: {executor: serial-production, profile: NP-CONT}}
  - {name: fixed-n-connections-2, params: {executor: "h1:2", profile: NP-CONT}}
  - {name: fixed-n-connections-4, params: {executor: "h1:4", profile: NP-CONT}}
  - {name: fixed-n-connections-8, params: {executor: "h1:8", profile: NP-CONT}}
  - {name: fixed-n-connections-16, params: {executor: "h1:16", profile: NP-CONT}}
  - {name: adaptive-aimd, params: {executor: "aimd:2:16", profile: NP-CONT}}
  - {name: http2-multiplexing-16, params: {executor: "h2:16", profile: NP-CONT}}
  - {name: http2-multiplexing-100, params: {executor: "h2:100", profile: NP-CONT}}
  - {name: multi-range-single-request, params: {executor: "multirange:16", profile: NP-CONT}}
command: >-
  bash /root/eb-research/stage/EXP-REMOTE-006/repo/research/experiments/EXP-REMOTE-006/run_emulated.sh
  --item-path {item_path} --item-id {item_id} --config balanced-plain --scratch {scratch}
  --rep {rep} --seed {seed} --executor {executor} --profile {profile}
  --plans /root/eb-research/raw-detail/EXP-REMOTE-006/plans
  --workload-subset WL-RAND1,WL-SUBTREE,WL-LARGE,WL-FULL
  --proxy-args "--shared-link true --setup-rtt-multiple 2.0 --loss-p 0"
  --calibration /root/eb-research/stage/EXP-REMOTE-006/repo/research/normalized/EXP-REMOTE-001/decision/calibration-verdicts.json
shell: bash

corpus:
  splits: [tuning]
  manifest: research/experiments/EXP-REMOTE-006/subset-manifest.jsonl

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: minimize, unit: s}
  - {name: cpu_s, source: resource, family: time_cpu, direction: minimize, unit: s}
  - {name: roundtrip_ok, source: stdout_json, key: payload.roundtrip_ok, family: correctness, direction: maximize, unit: binary}
  - {name: report_field_digest, source: stdout_json, key: payload.report_field_sha256, family: correctness, kind: string}
  - {name: calibrated_profile, source: stdout_json, key: payload.profile_calibration_pass, family: correctness, direction: maximize, unit: binary}
  - {name: remote_task_latency_s__WL_SUBTREE, source: stdout_json, key: payload.wl.WL-SUBTREE.emulated_s, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_FULL, source: stdout_json, key: payload.wl.WL-FULL.emulated_s, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_LARGE, source: stdout_json, key: payload.wl.WL-LARGE.emulated_s, family: time_wall, direction: minimize, unit: s}
  - {name: remote_random_entry_latency_s, source: stdout_json, key: payload.wl.WL-RAND1.emulated_median_s, family: time_wall, direction: minimize, unit: s}
  - {name: http_requests__WL_SUBTREE, source: stdout_json, key: payload.wl.WL-SUBTREE.http_requests, family: other, direction: minimize, unit: count}
  - {name: http_bytes__WL_SUBTREE, source: stdout_json, key: payload.wl.WL-SUBTREE.http_bytes, family: size, direction: minimize, unit: B}
  - {name: client_cpu_s__WL_SUBTREE, source: stdout_json, key: payload.wl.WL-SUBTREE.client_cpu_s, family: time_cpu, direction: minimize, unit: s}
  - {name: inflight_peak_bytes, source: stdout_json, key: payload.scoped_peak_bytes, family: memory_peak, direction: minimize, unit: B}

repetitions: 10
warmups: 2
record_warmups: true
seeds: {order: 20261002, bootstrap: 20261003, command: 20261004}
timing: true
order: randomized_blocks
raw_compression: gzip

guard:
  max_loadavg_1m: 5.0
  max_other_cpu_percent: 3.0
  sample_interval_s: 1.0
  max_wait_s: 300

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  cpu_affinity: [2, 3, 4, 5]
  min_cpus: 8
  requires:
    - /root/eb-research/target/harness/release/ebr-remote
    - /root/eb-research/target/harness/release/ebr-origin
    - /root/eb-research/target/harness/release/ebr-netem-proxy
  timeout_s: 7200

analysis:
  baseline: status-quo-serial-blocking
  pairing: item_repetition
  report_metrics: [remote_task_latency_s__WL_SUBTREE, remote_task_latency_s__WL_FULL, remote_random_entry_latency_s, client_cpu_s__WL_SUBTREE]

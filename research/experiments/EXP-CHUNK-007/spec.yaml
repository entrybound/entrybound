schema: ebr.spec.v1
experiment_id: EXP-CHUNK-007
status: pre-registration-draft; NEEDS_TOOLING (scope_model.py over EXP-CHUNK-004 occurrence tables, ebr-chunk tree-dedup concatenated scope, xattr census, counting allocator for the index-memory arm)
question: >
  Which deduplication scope maximises net bytes saved (unique bytes saved minus frame,
  Index and reference metadata) across realistic trees, where does chunk dedup metadata
  cost exceed its benefit (break-even file size), what do windowed and streamed scopes lose,
  and what does dedup indirection cost single-entry extraction?
hypothesis: >
  H1: exact-chunk archive-wide dedup (status quo) is not DISTINGUISHABLE_WORSE than any
  expressible alternative on artifact_bytes at corpus level; whole-file-only and
  per-ContentObject scopes are DISTINGUISHABLE_WORSE on F17/F18; tiny-object inlining
  below 4 KiB is DISTINGUISHABLE_BETTER on F04/F19 against its tier band; windowed dedup
  at 256 MiB loses less than the T-01 band except on F17. Falsification in protocol.md
  section 3.
decision_ids: [DEC-CMP-017, DEC-CRY-025, DEC-ACC-029]


status: pre-registration-draft (gate G-A pending; timing gated on decision-method 14 items 3 and 4)
notes: 'Generated by make_specs.py. In-process compress timing via export-ladder (production encoder crates) for the DEC-LEG-027 candidate parameter sets; the same invocation spawns the reference reader (gzip/zstd/xz/bzip2 -dc, unzip -p) and times it as a child process (T-04 process floor), emitting one JSON line. Tuning small+medium items; large-tier timing of status quo and max-ratio is spec-timing-large (derived mechanically, committed before any run).'
question: 'What compress wall/CPU time (in-process) and reader decode wall time do the DEC-LEG-027 candidate parameter sets cost per wrapper?'
hypothesis: 'H1b: zstd 19 is more than 10 T-03 band units slower to compress than zstd 9; xz 9 versus xz 6 differs by under 3 band units.'

schema: ebr.spec.v1
experiment_id: EXP-CODEC-008-readers
status: pre-registration-draft (gate G-A pending)
notes: 'Generated by make_specs.py. For each variant the command builds the variant (export-ladder) and runs every pinned reader via read_variant.sh under GNU time; outcomes are deterministic, memory per reader is from GNU time only (R1-16). Java readers run on the Windows host arm (identity_windows.ps1).'
question: 'Which pinned consumer readers accept each frozen, seekable and multi-block export variant, with what peak memory, and which decode in parallel?'
hypothesis: 'H1c-H1d: every reader accepts multi-member gzip, BGZF, multi-block xz and zstd seekable frames (export_acceptance_fraction = 1); xz 9 exports need more reader memory than xz 6 beyond the T-06 band.'
decision_ids: [DEC-LEG-027, DEC-CMP-024]
candidates:
  - name: gzip-frozen
    params: {wrapper: gzip, level: '6', variant: 'none'}
  - name: zstd-frozen
    params: {wrapper: zstd, level: '9', variant: 'none'}
  - name: xz-frozen
    params: {wrapper: xz, level: '6', variant: 'none'}
  - name: xz-l9
    params: {wrapper: xz, level: '9', variant: 'none'}
  - name: bzip2-frozen
    params: {wrapper: bzip2, level: '9', variant: 'none'}
  - name: zip-frozen
    params: {wrapper: zip, level: '6', variant: 'none'}
  - name: gzip-multimember-8m
    params: {wrapper: gzip, level: '6', variant: 'members:8388608'}
  - name: gzip-bgzf
    params: {wrapper: gzip, level: '6', variant: 'bgzf'}
  - name: xz-multiblock-8m
    params: {wrapper: xz, level: '6', variant: 'blocks:8388608'}
  - name: xz-multiblock-64m
    params: {wrapper: xz, level: '6', variant: 'blocks:67108864'}
  - name: zstd-seekable-8m
    params: {wrapper: zstd, level: '9', variant: 'seekable:8388608'}
command: >-
  /root/eb-research/target/harness/release/ebr-codec export-ladder --tar /root/eb-research/cache/EXP-CODEC-008/tar/{item_id}.tar --zip-source /root/eb-research/cache/EXP-CODEC-008/tar/{item_id}.zipsrc
  --wrapper {wrapper} --level {level} --variant {variant} --out {scratch}/export.bin --summary-stdout >/dev/null &&
  bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-CODEC-008/read_variant.sh
  {scratch}/export.bin {wrapper} all --expect /root/eb-research/cache/EXP-CODEC-008/tar/{item_id}.tar
shell: bash
corpus:
  manifest: research/corpus/manifest.json
  splits: [tuning]
metrics:
  - {name: readers, source: stdout_json, key: payload.readers, family: other, direction: none, unit: count}
  - {name: export_acceptance_fraction, source: stdout_json, key: payload.export_acceptance_fraction, family: other, direction: maximize, unit: fraction}
  - {name: peak_rss_bytes, source: stdout_json, key: payload.worst_reader_max_rss_bytes, family: memory_peak, direction: minimize, unit: B}
  - {name: parallel_decode_readers, source: stdout_json, key: payload.parallel_decode_readers, family: other, direction: maximize, unit: count}
  - {name: outcome_digest_sha256, source: stdout_json, key: payload.outcome_digest_sha256, family: correctness, kind: string}
repetitions: 2
warmups: 0
seeds: {order: 20260917, bootstrap: 20260917, command: 20260917}
timing: false
order: randomized_blocks
raw_compression: gzip
platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires: [/root/eb-research/target/harness/release/ebr-codec, gzip, pigz, xz, zstd, bzip2, 7z, bsdtar, tar, bgzip, python3]
  timeout_s: 172800
analysis:
  baseline: gzip-frozen
  pairing: item
  report_metrics: [export_acceptance_fraction, peak_rss_bytes, parallel_decode_readers]

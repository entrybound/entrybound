schema: ebr.spec.v1
experiment_id: EXP-PLAT-020
status: pre-registration-draft
question: How do Windows OpenSSH and ebound handle key files readable by other principals, and what ACL
  does a new ebound key file inherit on D:?
hypothesis: Windows OpenSSH refuses keys readable by other principals; ebound does not check; new key
  files inherit non-owner read ACEs.
decision_ids:
- DEC-CRY-108
- DEC-PLT-042
candidates:
- name: openssh-win
  params:
    tool: openssh
- name: ebound-win
  params:
    tool: ebound
- name: acl-census
  params:
    tool: acl-census
command: '& D:/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-020/scripts/key_perm_incumbents.ps1
  -Tool {tool} -Scratch {scratch}'

schema: ebr.spec.v1
experiment_id: EXP-PLAT-006
status: pre-registration-draft
question: What granularity, range and out-of-range behaviour do Linux filesystems show, and does Entrybound
  capture and restore timestamps exactly or declare every difference?
hypothesis: Granularities differ by filesystem; at least one target clamps silently; the five-class registry
  misses 2-second sources.
decision_ids:
- DEC-PLT-050
- DEC-PLT-051
- DEC-PLT-049
- DEC-MOD-050
- DEC-PLT-003
- DEC-LEG-088

# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-006
status: pre-registration-draft
question: 'What granularity and range does NTFS D: show through .NET and std FileTimes, and does Entrybound
  capture and restore timestamps exactly?'
hypothesis: NTFS stores 100 ns from 1601 to 30828; creation time is settable without elevation; status
  quo does not restore creation time.
decision_ids:
- DEC-PLT-050
- DEC-PLT-051
- DEC-PLT-049
- DEC-MOD-050
- DEC-PLT-003
- DEC-LEG-088
candidates:
- name: ntfs-d-dotnet
  params:
    mode: dotnet
- name: ntfs-d-std-filetimes
  params:
    mode: std
command: '& D:/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-006/scripts/timestamp_probe.ps1
  -Mode {mode} -LadderFrom {item_id} -Scratch {scratch}'
shell: pwsh
corpus:
  generated:
  - item_id: plat006-ladder-tuning
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260917
  - item_id: plat006-ladder-validation
    family: synthetic-trigger
    generator: zeros-v1
    bytes: 1
    seed: 20260918
metrics:
- name: capture_fidelity_fraction
  source: stdout_json
  key: payload.capture_fidelity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: restore_fidelity_fraction
  source: stdout_json
  key: payload.restore_fidelity_fraction
  family: other
  direction: maximize
  unit: fraction
- name: hc07_mvt07a_undeclared_differences
  source: stdout_json
  key: payload.hc07_mvt07a_undeclared_differences
  family: correctness
  direction: minimize
  unit: count
- name: granularity_ns
  source: stdout_json
  key: payload.granularity_ns
  family: other
  direction: none
- name: silent_clamps
  source: stdout_json
  key: payload.silent_clamps
  family: other
  direction: none
- name: observation_sha256
  source: stdout_json
  key: payload.observation_sha256
  family: correctness
  kind: string
repetitions: 2
warmups: 0
record_warmups: true
seeds:
  order: 20260917
  bootstrap: 20260917
  command: 20260917
timing: false
order: sequential
raw_compression: gzip
platform:
  os:
  - windows
  arch:
  - x86_64
  emulated: false
  requires:
  - pwsh
  - D:/eb-research/target/production-win/release/ebound.exe
  timeout_s: 3600
  scratch_root: D:/eb-research/scratch/platform
analysis:
  baseline: ntfs-d-dotnet
  pairing: item
  report_metrics:
  - capture_fidelity_fraction
  - restore_fidelity_fraction
  - hc07_mvt07a_undeclared_differences
  - granularity_ns
  - silent_clamps
env:
  TEMP: D:/eb-research/tmp
  TMP: D:/eb-research/tmp

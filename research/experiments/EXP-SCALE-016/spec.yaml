command: >-
  /root/eb-research/venv/bin/python /mnt/d/Projects/entrybound/entrybound/research/tools/scale/storage_cell.py --candidate {candidate} --item {item_path}
  --item-id {item_id} --roots /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-SCALE-016/storage-roots.json --seed {seed} --scratch {scratch}
shell: bash

corpus:
  manifest: research/corpus/manifest.json
  splits: [tuning]
  families: [F03, F04, F05, F13]

metrics:
  - {name: decode_wall_s, source: stdout_json, key: payload.decode_wall_s, family: time_wall, direction: minimize, unit: s}
  - {name: stream_unpack_wall_s, source: stdout_json, key: payload.stream_unpack_wall_s, family: time_wall, direction: minimize, unit: s}
  - {name: verify_wall_s, source: stdout_json, key: payload.verify_wall_s, family: time_wall, direction: minimize, unit: s}
  - {name: decode_cpu_s, source: stdout_json, key: payload.decode_cpu_s, family: time_cpu, direction: minimize, unit: s}
  - {name: fs_write_ops, source: stdout_json, key: payload.fs_write_ops, family: io, direction: minimize, unit: count}
  - {name: identity_equal_ref, source: stdout_json, key: payload.identity_equal_ref, family: correctness, direction: none}
  - {name: storage_class, source: stdout_json, key: payload.storage_class, family: other, kind: string}

repetitions: 10
warmups: 2
seeds: {order: 1316001, bootstrap: 1316002, command: 1316003}
timing: true
order: randomized_blocks
raw_compression: gzip

guard:
  max_loadavg_1m: 9.0
  max_other_cpu_percent: 3.0
  sample_interval_s: 1.0
  max_wait_s: 300

platform:
  os: [linux]
  arch: [x86_64]
  min_cpus: 8
  requires:
    - /root/eb-research/target/scale-par/release/ebr-par
    - ripunzip
    - /root/eb-research/venv/bin/python
  poll_interval_s: 1.0
  timeout_s: 14400

analysis:
  pairing: item_repetition
  report_metrics: [decode_wall_s, verify_wall_s]

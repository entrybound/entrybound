schema: ebr.spec.v1
experiment_id: EXP-SCALE-016
status: design-draft
notes: >
  BLOCKED: requires HDD, SATA SSD, SMB and NFS storage on a separate host and a bandwidth-limited link (protocol.md). Template validated at design time; storage mount roots come from research/experiments/EXP-SCALE-016/storage-roots.json on the executing host. Design draft until gate G-A.
question: >
  How do sequential and identity-passing parallel extraction and verification designs perform across HDD, SATA SSD, SMB, NFS and a bandwidth-limited share?
hypothesis: >
  Parallel per-entry extraction is distinguishably slower than sequential on HDD for many-small-file archives; separate CPU and I/O pools are non-inferior to the best fixed setting on every storage class. Falsified by confirmatory verdicts per storage class.
decision_ids: [DEC-ACC-033, DEC-ACC-034, DEC-ACC-002]


schema: ebr.spec.v1
experiment_id: EXP-CODEC-003
status: pre-registration-draft (gate G-A pending; counting allocator and bound H are decision-method 14 item 17)
notes: 'Generated by make_specs.py. Binary built with the ebr-alloc counting allocator feature into target/harness-alloc (TOOLING, protocol 7.1). One configuration per process.'
question: 'For each decode configuration, what is the exact allocator peak above R0_max, how is it attributed (state, output, transform intermediate, other), and how tight is each candidate definition of the declared decode requirement?'
hypothesis: 'H1a-H1f of protocol.md section 3: zstd window-20 decode exceeds the declared 4 MiB set only when output buffers are counted; LZMA2 stays within lzma2_get_memory_usage plus output; PPMd, brotli large-window and bsc decode memory is bounded by a declarable formula (H1d); window series equivalent for single-segment chunk frames (H1c). Binary oracle: bound_exceedances = 0 under each candidate definition that claims to be an upper bound.'
decision_ids: [DEC-CMP-045, DEC-CMP-008, DEC-CMP-009, DEC-CMP-043, DEC-CON-004]

schema: ebr.spec.v1
experiment_id: EXP-REMOTE-003
status: designed-needs-tooling
notes: >
  Phase C-design pre-registration (remote domain). Arm (a): production-policy
  coalescing candidates run through the production client on balanced-plain
  archives cached by EXP-REMOTE-002 (deterministic counts, bytes and modelled
  latency; timing false). Variant specs for fast/dense/extreme/encrypted configs
  are generated by make_variant_specs.py (config substitution only). Simulated
  and prototype candidates run through fetchsim (protocol.md section 7 (b));
  emulated corroboration uses spec-emulated.yaml generated after tuning.
question: >
  Which range-coalescing policy minimizes modelled remote task latency without
  disproportionate byte waste across canonical network profiles and user tasks?
hypothesis: >
  Header-with-payload merging beats the 4 KiB same-purpose status quo on
  NP-CONT and NP-INTER for many-entry tasks; no fixed gap wins at all profiles.
decision_ids: [DEC-ACC-046, DEC-ACC-003, DEC-CMP-006]

candidates:
  - {name: status-quo-4k-same-purpose, params: {gap: 4096, config: balanced-plain}}
  - {name: no-coalescing, params: {gap: 0, config: balanced-plain}}
  - {name: fixed-gap-16k, params: {gap: 16384, config: balanced-plain}}
  - {name: fixed-gap-64k, params: {gap: 65536, config: balanced-plain}}
  - {name: fixed-gap-256k, params: {gap: 262144, config: balanced-plain}}
  - {name: fixed-gap-1m, params: {gap: 1048576, config: balanced-plain}}
  - {name: fixed-gap-4m, params: {gap: 4194304, config: balanced-plain}}
  - {name: chunk-size-proportional-gap-1, params: {gap: chunk-median-x1, config: balanced-plain}}
command: >-
  bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-REMOTE-002/run_trace.sh
  --item-path {item_path} --item-id {item_id} --config {config} --scratch {scratch}
  --rep {rep} --seed {seed} --policy-coalesce-gap {gap}
  --workloads /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-REMOTE-002/workloads.json
  --workload-subset WL-FIRST,WL-RAND1,WL-RANDK16,WL-SUBTREE,WL-LARGE,WL-ZIPF,WL-SEQALL
  --connection-model /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-REMOTE-001/connection-model.json
  --sources http-loopback
  --differential-reference-gap 4096
  --detail-root /root/eb-research/raw-detail/EXP-REMOTE-003
shell: bash

corpus:
  splits: [tuning]
  manifest: research/corpus/manifest.json

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: minimize, unit: s}
  - {name: roundtrip_ok, source: stdout_json, key: payload.roundtrip_ok, family: correctness, direction: maximize, unit: binary}
  - {name: report_mismatches, source: stdout_json, key: payload.differential.report_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: trace_sha256, source: stdout_json, key: payload.trace_sha256, family: correctness, kind: string}
  - {name: detail_sha256, source: stdout_json, key: payload.detail_sha256, family: correctness, kind: string}
  - {name: remote_task_latency_s__WL_SUBTREE__NP_LAN, source: stdout_json, key: payload.wl.WL-SUBTREE.model.NP-LAN, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_SUBTREE__NP_METRO, source: stdout_json, key: payload.wl.WL-SUBTREE.model.NP-METRO, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_SUBTREE__NP_CONT, source: stdout_json, key: payload.wl.WL-SUBTREE.model.NP-CONT, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_SUBTREE__NP_INTER, source: stdout_json, key: payload.wl.WL-SUBTREE.model.NP-INTER, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_RANDK16__NP_LAN, source: stdout_json, key: payload.wl.WL-RANDK16.model.NP-LAN, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_RANDK16__NP_METRO, source: stdout_json, key: payload.wl.WL-RANDK16.model.NP-METRO, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_RANDK16__NP_CONT, source: stdout_json, key: payload.wl.WL-RANDK16.model.NP-CONT, family: time_wall, direction: minimize, unit: s}
  - {name: remote_task_latency_s__WL_RANDK16__NP_INTER, source: stdout_json, key: payload.wl.WL-RANDK16.model.NP-INTER, family: time_wall, direction: minimize, unit: s}
  - {name: remote_random_entry_latency_s__NP_LAN, source: stdout_json, key: payload.wl.WL-RAND1.model_median.NP-LAN, family: time_wall, direction: minimize, unit: s}
  - {name: remote_random_entry_latency_s__NP_METRO, source: stdout_json, key: payload.wl.WL-RAND1.model_median.NP-METRO, family: time_wall, direction: minimize, unit: s}
  - {name: remote_random_entry_latency_s__NP_CONT, source: stdout_json, key: payload.wl.WL-RAND1.model_median.NP-CONT, family: time_wall, direction: minimize, unit: s}
  - {name: remote_random_entry_latency_s__NP_INTER, source: stdout_json, key: payload.wl.WL-RAND1.model_median.NP-INTER, family: time_wall, direction: minimize, unit: s}
  - {name: remote_first_entry_latency_s__NP_CONT, source: stdout_json, key: payload.wl.WL-FIRST.model.NP-CONT, family: time_wall, direction: minimize, unit: s}
  - {name: http_bytes__WL_SUBTREE, source: stdout_json, key: payload.wl.WL-SUBTREE.http_bytes, family: size, direction: minimize, unit: B}
  - {name: http_bytes__WL_RANDK16, source: stdout_json, key: payload.wl.WL-RANDK16.http_bytes, family: size, direction: minimize, unit: B}
  - {name: http_bytes__WL_RAND1, source: stdout_json, key: payload.wl.WL-RAND1.http_bytes_median, family: size, direction: minimize, unit: B}
  - {name: http_requests__WL_SUBTREE, source: stdout_json, key: payload.wl.WL-SUBTREE.http_requests, family: other, direction: minimize, unit: count}
  - {name: http_requests__WL_RANDK16, source: stdout_json, key: payload.wl.WL-RANDK16.http_requests, family: other, direction: minimize, unit: count}
  - {name: http_requests__WL_RAND1, source: stdout_json, key: payload.wl.WL-RAND1.http_requests_median, family: other, direction: minimize, unit: count}
  - {name: wasted_bytes__WL_SUBTREE, source: stdout_json, key: payload.wl.WL-SUBTREE.wasted_bytes, family: size, direction: minimize, unit: B}
  - {name: slow_start_robust__WL_SUBTREE, source: stdout_json, key: payload.wl.WL-SUBTREE.model_arms_same_order, family: correctness, direction: none, unit: binary}

repetitions: 2
warmups: 0
seeds: {order: 20260923, bootstrap: 20260924, command: 20260925}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  requires:
    - /root/eb-research/target/harness/release/ebr-remote
    - /root/eb-research/target/harness/release/ebr-origin
  timeout_s: 14400

analysis:
  baseline: status-quo-4k-same-purpose
  pairing: item
  report_metrics: [remote_task_latency_s__WL_SUBTREE__NP_CONT, remote_task_latency_s__WL_RANDK16__NP_INTER, http_bytes__WL_SUBTREE, http_requests__WL_SUBTREE, report_mismatches]

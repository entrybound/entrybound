# ebr spec (schema ebr.spec.v1) -- Phase C-design pre-registration DRAFT, platform domain.
# Not executable as decision evidence until the gates in protocol.md are met; scripts named in
# `command` are specified in protocol.md (Commands) and are written before the first run.
schema: ebr.spec.v1
experiment_id: EXP-PLAT-017
status: pre-registration-draft
question: Do commit strategies with and without directory fsync leave a consistent destination at every
  replayed crash point?
hypothesis: Without directory fsync at least one replayed prefix loses a reported publish on ext4 or XFS;
  with it none.
decision_ids:
- DEC-PLT-037
- DEC-INT-003
- DEC-INT-039
- DEC-PLT-011
- DEC-ACC-053
- DEC-PLT-018
candidates:
- name: hardlink-nofsync
  params:
    strategy: hardlink
    fsync: nofsync
- name: hardlink-dirfsync
  params:
    strategy: hardlink
    fsync: dirfsync
- name: rename-noreplace-nofsync
  params:
    strategy: rename-noreplace
    fsync: nofsync
- name: rename-noreplace-dirfsync
  params:
    strategy: rename-noreplace
    fsync: dirfsync
- name: tmpfile-linkat-nofsync
  params:
    strategy: tmpfile-linkat
    fsync: nofsync
- name: tmpfile-linkat-dirfsync
  params:
    strategy: tmpfile-linkat
    fsync: dirfsync
- name: excl-direct-nofsync
  params:
    strategy: excl-direct
    fsync: nofsync
- name: excl-direct-dirfsync
  params:
    strategy: excl-direct
    fsync: dirfsync
command: bash /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-PLAT-017/scripts/logwrites_replay.sh
  --strategy {strategy} --fsync {fsync} --fixture-from {item_id} --scratch {scratch}
shell: bash

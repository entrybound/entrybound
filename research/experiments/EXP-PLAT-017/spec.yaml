schema: ebr.spec.v1
experiment_id: EXP-PLAT-017
status: pre-registration-draft
question: Which commit primitives and status-quo output commands work on each Linux target, and are spill
  files private and cleaned up?
hypothesis: Hardlink publish fails on vfat/exFAT/cifs; renameat2 NOREPLACE works on ext4/XFS/btrfs/tmpfs;
  spill files are 0644 and remain after SIGKILL.

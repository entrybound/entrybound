schema: ebr.spec.v1
experiment_id: EXP-CONF-002
status: designed
question: >
  On the native conformance corpus, on archives production packs from small tuning items, and on a structure-aware
  single-byte mutation corpus of those archives, do the production reader paths and the clean-room readers produce
  identical outcome tuples, and which default-written archives can a minimal L-base reader not read?
hypothesis: >
  H1: no production-versus-ebir disagreement remains that triage does not attribute to ebir (reader_disagreements = 0);
  H2: ebir v1 matches expected class and documented code on every baseline-scope conformance case
  (cleanroom_pass_fraction = 1); H3: ebir at L-base reads every default-written archive. Each is falsified by one
  counterexample.
decision_ids: [DEC-ECO-032, DEC-ECO-060, DEC-CON-002, DEC-CON-003, DEC-CON-012, DEC-CON-025, DEC-CON-026, DEC-CON-030,
  DEC-ECO-038, DEC-INT-020, DEC-INT-040, DEC-INT-042, DEC-LEG-004, DEC-MOD-004, DEC-MOD-006, DEC-MOD-027, DEC-MOD-041]
notes: >
  Design pre-registration (Phase C-design); runs only after gate G-A; NOT_DECISION_GRADE until G-B. Conventions:
  research/experiments/_index/conformance-conventions.md. Items come from items-manifest.jsonl, generated by
  research/conformance/tools/pack_bases.py: ebcc-v1 family bundles (split conformance) and deterministic ebound-head
  packs of the named small tuning items (split tuning, one directory per item). The validation look is
  spec-validation.yaml and must be registered in research/decisions/validation-looks.jsonl before it runs.

candidates:
  - name: corpus-pass-ebir-v1
    params: {mode: corpus-pass, other_bin: /root/eb-research/independent-reader/ebir-v1/ebir, other_id: EBIR-V1, classes: none}
  - name: mutation-ebir-v1
    params: {mode: mutation, other_bin: /root/eb-research/independent-reader/ebir-v1/ebir, other_id: EBIR-V1, classes: "M1,M2,M3"}
  - name: framing-ebir-py-v1
    params: {mode: mutation-framing, other_bin: /root/eb-research/independent-reader/ebir-py-v1/ebir_py.sh, other_id: EBIR-PY-V1, classes: M1}
  - name: fragmentation-ebir-v1
    params: {mode: fragmentation, other_bin: /root/eb-research/independent-reader/ebir-v1/ebir, other_id: EBIR-V1, classes: none}
  - name: corpus-pass-ebir-v2
    params: {mode: corpus-pass, other_bin: /root/eb-research/independent-reader/ebir-v2/ebir, other_id: EBIR-V2, classes: none}
  - name: mutation-ebir-v2
    params: {mode: mutation, other_bin: /root/eb-research/independent-reader/ebir-v2/ebir, other_id: EBIR-V2, classes: "M1,M2,M3"}
command: >-
  /root/eb-research/target/harness/release/ebcc-diff
  --mode {mode} --input {item_path} --item-id {item_id}
  --prod /root/eb-research/target/harness/release/ebcc-readtuple --prod-ebound-build head
  --other {other_bin} --other-id {other_id} --classes {classes} --mutation-seed 2809170001 --jobs 28
  --expectations research/conformance/corpus/ebcc-v1/manifest.json
  --artifact-dir /root/eb-research/raw-artifacts/EXP-CONF-002/{candidate}/{item_id}/rep{rep}
  --experiment-id EXP-CONF-002 --env-name wsl-ubuntu
shell: bash

corpus:
  manifest: research/experiments/EXP-CONF-002/items-manifest.jsonl
  splits: [conformance, tuning]

metrics:
  - {name: wall_s, source: resource, family: time_wall, direction: none, unit: s}
  - {name: inputs_total, source: stdout_json, key: payload.inputs_total, family: other, direction: none, unit: count}
  - {name: reader_disagreements, source: stdout_json, key: payload.disagreements_total, family: correctness, direction: minimize, unit: count}
  - {name: disagreement_clusters, source: stdout_json, key: payload.disagreement_clusters, family: other, direction: none, unit: count}
  - {name: detail_only_disagreements, source: stdout_json, key: payload.detail_only_disagreements, family: other, direction: none, unit: count}
  - {name: baseline_cases, source: stdout_json, key: payload.baseline_cases, family: other, direction: none, unit: count}
  - {name: baseline_cases_passed, source: stdout_json, key: payload.baseline_cases_passed, family: other, direction: none, unit: count}
  - {name: unsupported_feature_bits, source: stdout_json, key: payload.unsupported_feature_bits, family: other, direction: none, unit: count}
  - {name: decided_pairs_reached, source: stdout_json, key: payload.decided_pairs_reached, family: other, direction: none, unit: count}
  - {name: decided_pairs_total, source: stdout_json, key: payload.decided_pairs_total, family: other, direction: none, unit: count}
  - {name: prod_nondeterministic_inputs, source: stdout_json, key: payload.prod_nondeterministic_inputs, family: correctness, direction: minimize, unit: count}
  - {name: other_nondeterministic_inputs, source: stdout_json, key: payload.other_nondeterministic_inputs, family: correctness, direction: minimize, unit: count}
  - {name: artifact_sha256, source: stdout_json, key: payload.artifact_sha256, family: correctness, kind: string}
  - {name: build_identity_sha256, source: stdout_json, key: payload.build_identity_sha256, family: correctness, kind: string}

repetitions: 2
warmups: 0
seeds: {order: 2026091728, bootstrap: 2026091729, command: 2809170001}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 32
  requires:
    - /root/eb-research/target/harness/release/ebcc-diff
    - /root/eb-research/target/harness/release/ebcc-readtuple
    - /root/eb-research/independent-reader/ebir-v1/ebir
    - research/conformance/corpus/ebcc-v1/manifest.json
  timeout_s: 172800

analysis:
  baseline: corpus-pass-ebir-v1
  pairing: item
  report_metrics: [reader_disagreements, disagreement_clusters, baseline_cases_passed, baseline_cases,
    unsupported_feature_bits, decided_pairs_reached, prod_nondeterministic_inputs, other_nondeterministic_inputs]

  - {name: dedup_stored_fraction, source: stdout_json, key: payload.keys.dedup_stored_fraction_mean, family: size, direction: minimize, unit: ratio}
  - {name: dedup_stored_fraction_key_min, source: stdout_json, key: payload.keys.dedup_stored_fraction_min, family: size, direction: none, unit: ratio}
  - {name: dedup_stored_fraction_key_max, source: stdout_json, key: payload.keys.dedup_stored_fraction_max, family: size, direction: none, unit: ratio}
  - {name: mean_chunk_bytes, source: stdout_json, key: payload.keys.mean_chunk_bytes_mean, family: other, direction: none, unit: B}
  - {name: forced_max_fraction, source: stdout_json, key: payload.keys.forced_max_fraction_mean, family: other, direction: minimize, unit: fraction}
  - {name: modelled_cost_bytes_frozen_constants, source: stdout_json, key: payload.keys.modelled_cost_bytes_frozen_constants_mean, family: size, direction: minimize, unit: B}
  - {name: boundary_coincidence_with_reference, source: stdout_json, key: payload.keys.boundary_coincidence_with_reference_mean, family: other, direction: none, unit: fraction}
  - {name: keyed_boundary_sets_distinct, source: stdout_json, key: payload.keys.distinct_boundary_set_count, family: correctness, direction: maximize, unit: count}
  - {name: algorithm_id, source: stdout_json, key: payload.algorithm_id, family: correctness, kind: string}
  - {name: result_sha256, source: stdout_json, key: payload.result_sha256, family: correctness, kind: string}
  - {name: detail_sha256, source: path_sha256, path: '/root/eb-research/results/EXP-CHUNK-006/{candidate}/{item_id}.detail.jsonl.gz', family: correctness}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}


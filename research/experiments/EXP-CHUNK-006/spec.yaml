schema: ebr.spec.v1
experiment_id: EXP-CHUNK-006
status: pre-registration-draft; NEEDS_TOOLING (keyed boundary modes in ebr-chunk tree-dedup/edit-sweep; ebr-pack --chunk-boundary/--pad; mvt14e subcommand); arm D spec
question: >
  Under encrypted creation, what do the keyed boundary constructions (status-quo secret
  Gear table default, PHTE/AES-128 opt-in, and keyed variants of candidate successor
  chunkers) cost in exact-chunk dedup and edit locality relative to unkeyed chunking,
  do they pass the HC-14 keyed-boundary mechanical test, and what do encrypted archives
  cost per padding mode (and without dedup)?
hypothesis: >
  Arm D: every keyed construction's key-averaged dedup_stored_fraction is within the
  T-01 band of unkeyed gear-norm-v1 at the same sizes on every family except F20, with
  between-key spread inside the band; hashless constructions under a keyed byte
  permutation lose >= 1 band unit on at least one family. Falsification and the HC-14
  arm K hypotheses are in protocol.md section 3.
decision_ids: [DEC-CRY-023, DEC-CMP-001, DEC-CRY-025, DEC-CMP-017]

candidates:
  - name: unkeyed-gear-norm-v1-balanced
    params: {algo: gear-norm-v1, boundary_mode: none, min: 131072, target: 524288, max: 2097152}
  - name: unkeyed-gear-norm-v1-dense
    params: {algo: gear-norm-v1, boundary_mode: none, min: 65536, target: 262144, max: 1048576}
  - name: secret-gear-table-balanced
    params: {algo: gear-norm-v1, boundary_mode: secret-gear-table, min: 131072, target: 524288, max: 2097152}
  - name: secret-gear-table-dense
    params: {algo: gear-norm-v1, boundary_mode: secret-gear-table, min: 65536, target: 262144, max: 1048576}
  - name: phte-aes128-balanced
    params: {algo: gear-norm-v1, boundary_mode: phte-aes128, min: 131072, target: 524288, max: 2097152}
  - name: phte-aes128-dense
    params: {algo: gear-norm-v1, boundary_mode: phte-aes128, min: 65536, target: 262144, max: 1048576}
  - name: keyed-gear-spread-nc2-balanced
    params: {algo: gear-spread-nc2, boundary_mode: secret-gear-table, min: 131072, target: 524288, max: 2097152}
  - name: keyed-gear-spread-nc2-dense
    params: {algo: gear-spread-nc2, boundary_mode: secret-gear-table, min: 65536, target: 262144, max: 1048576}
  - name: keyed-buzhash-w64-balanced
    params: {algo: buzhash-w64, boundary_mode: keyed-table, min: 131072, target: 524288, max: 2097152}
  - name: keyed-buzhash-w64-dense
    params: {algo: buzhash-w64, boundary_mode: keyed-table, min: 65536, target: 262144, max: 1048576}
  - name: keyed-rabin-w64-balanced
    params: {algo: rabin-w64, boundary_mode: keyed-polynomial, min: 131072, target: 524288, max: 2097152}
  - name: keyed-rabin-w64-dense
    params: {algo: rabin-w64, boundary_mode: keyed-polynomial, min: 65536, target: 262144, max: 1048576}
  - name: keyed-permute-ae-w1-balanced
    params: {algo: ae-w1, boundary_mode: keyed-byte-permutation, min: 131072, target: 524288, max: 2097152}
  - name: keyed-permute-ae-w1-dense
    params: {algo: ae-w1, boundary_mode: keyed-byte-permutation, min: 65536, target: 262144, max: 1048576}
  - name: keyed-permute-ram-balanced
    params: {algo: ram, boundary_mode: keyed-byte-permutation, min: 131072, target: 524288, max: 2097152}
  - name: keyed-permute-ram-dense
    params: {algo: ram, boundary_mode: keyed-byte-permutation, min: 65536, target: 262144, max: 1048576}
  - name: fixed-size-balanced
    params: {algo: fixed-size, boundary_mode: none, min: 131072, target: 524288, max: 2097152}
  - name: fixed-size-dense
    params: {algo: fixed-size, boundary_mode: none, min: 65536, target: 262144, max: 1048576}
command: >-
  /root/eb-research/target/exp-chunk/release/ebr-chunk tree-dedup
  --item-path {item_path} --experiment-id EXP-CHUNK-006 --env-name wsl-ubuntu
  --algorithm {algo} --min {min} --target {target} --max {max}
  --boundary-mode {boundary_mode} --key-count 16 --key-seed-base 20260917
  --scope archive --reference-algorithm gear-norm-v1
  --detail-out /root/eb-research/results/EXP-CHUNK-006/{candidate}/{item_id}.detail.jsonl.gz
shell: bash


  - name: ebound-compat-libarchive
    params: {mode: "compat:zip/libarchive-bsdtar@3.8.8"}
    command: >-
      /root/eb-research/venv/bin/python research/tools/legacy/ebound_import.py
      --experiment EXP-LEGACY-001 --build /root/eb-research/target/legacy-head/release/ebound --mode {mode}
      --case-set {item_path} --item-id {item_id} --rep {rep} --scratch {scratch}
      --artifacts-root /root/eb-research/raw-artifacts/EXP-LEGACY-001
  - name: ebound-preserve-all-profiles
    params: {mode: "preserve:all-zip-profiles"}
    command: >-
      /root/eb-research/venv/bin/python research/tools/legacy/ebound_import.py
      --experiment EXP-LEGACY-001 --build /root/eb-research/target/legacy-head/release/ebound --mode {mode}
      --case-set {item_path} --item-id {item_id} --rep {rep} --scratch {scratch}

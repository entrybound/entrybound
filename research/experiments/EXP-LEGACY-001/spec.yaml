  - {name: python-zipfile-3.13.5-linux, params: {runtime_id: python-zipfile-3.13.5-linux}}
  - {name: python-zipfile-3.12.3-linux, params: {runtime_id: python-zipfile-3.12.3-linux}}
  - {name: python-zipfile-3.14-linux, params: {runtime_id: python-zipfile-3.14-linux}}
  - {name: java-zipfile-21.0.12.1-win, params: {runtime_id: java-zipfile-21.0.12.1-win}}
  - {name: java-zipinputstream-21.0.12.1-win, params: {runtime_id: java-zipinputstream-21.0.12.1-win}}
  - {name: java-zip-21.0.12-linux, params: {runtime_id: java-zip-21.0.12-linux}}
  - {name: java-zip-17-linux, params: {runtime_id: java-zip-17-linux}}
  - {name: java-zip-25-linux, params: {runtime_id: java-zip-25-linux}}
  - {name: commons-compress-1.28.0, params: {runtime_id: commons-compress-1.28.0}}
  - {name: libarchive-3.8.8-win, params: {runtime_id: libarchive-3.8.8-win}}
  - {name: libarchive-3.8.8-linux, params: {runtime_id: libarchive-3.8.8-linux}}
  - {name: libarchive-3.7.2-linux, params: {runtime_id: libarchive-3.7.2-linux}}
  - {name: infozip-unzip-6.00-linux, params: {runtime_id: infozip-unzip-6.00-linux}}

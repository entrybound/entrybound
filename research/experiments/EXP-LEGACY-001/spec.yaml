schema: ebr.spec.v1
experiment_id: EXP-LEGACY-001
status: designed
question: >
  For pre-registered ZIP primitive cases and tuning/validation ZIP-family archives, what do pinned ZIP runtimes
  (listing, content selection, extraction, errors) and Entrybound import modes (strict, four frozen compat
  profiles, compat+preserve) observe, where do they diverge, and do frozen compat rules agree with their anchors?
hypothesis: >
  H1 Windows anchors reproduce tools/zip-compat/observed-outcomes-v1.json and Linux builds reproduce Windows on C0;
  H2 each frozen profile agrees with its anchor on 100% of tuning cases; H3 strict refuses or records every
  ambiguous case; H4 Go, .NET and 7-Zip each add >= 3 distinguishing cases; H5 at least one adjacent-version pair
  drifts; H6 at least one C14 compat revalidation case is projected unchecked under the status quo.
  See protocol.md section 2 for falsification conditions.
decision_ids: [DEC-ECO-047, DEC-LEG-001, DEC-LEG-012, DEC-LEG-031, DEC-LEG-032, DEC-LEG-070, DEC-LEG-077, DEC-LEG-078,
  DEC-LEG-079, DEC-LEG-080, DEC-LEG-081, DEC-LEG-082, DEC-LEG-083, DEC-LEG-084, DEC-LEG-085, DEC-LEG-086,
  DEC-LEG-087, DEC-LEG-089, DEC-LEG-090, DEC-LEG-092, DEC-LEG-094, DEC-LEG-095, DEC-LEG-102, DEC-LEG-103,
  DEC-LEG-104, DEC-LEG-105, DEC-INT-022, DEC-PLT-010]
notes: >
  Design pre-registration (Phase C-design). Not runnable until gate G-A holds and the tooling named in protocol.md
  section 7 exists. Cases and real items come from cases-manifest.jsonl written by materialize_cases.py; it never
  contains held-out rows. Canonical metrics are computed by research/tools/legacy/matrix.py from the committed
  observation artifacts; the stdout metrics below are per-sample summaries only.
cwd: /mnt/d/Projects/entrybound/entrybound
shell: bash
env:
  PYTHONPATH: research/tools
  EB_LEGACY_LOCK: research/experiments/_legacy/runtime-lock.json

command: >-
  /root/eb-research/venv/bin/python research/tools/legacy/run_matrix.py
  --experiment EXP-LEGACY-001 --format zip --runtime {runtime_id}
  --case-set {item_path} --item-id {item_id} --split {split} --rep {rep} --seed {seed}
  --scratch {scratch} --artifacts-root /root/eb-research/raw-artifacts/EXP-LEGACY-001
  --sandbox bwrap --ops list,read,extract


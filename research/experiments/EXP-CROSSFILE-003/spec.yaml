schema: ebr.spec.v1
experiment_id: EXP-CROSSFILE-003
status: pre-registration-design
question: What dictionary policy and minimum-benefit rule should v1 use, and must acceptance charge decoder memory
  and random/remote fetch cost in addition to record bytes under the 128-byte margin? (plus post-v1 LZMA2/LZ4/transform-before-dictionary
  arms)
hypothesis: 'H1a: charge-access-k1 costs < 1 T-01 band unit of artifact_bytes and cuts cold dictionary-member http_bytes
  by >= 1 T-11 band unit on F04/F05; H1b: the production working set (sum of all Dictionaries) is loose beyond T-23
  on archives with >= 4 Dictionaries; H1c: COVER/fastCOVER or 2x dictionaries gain >= 1 band unit on F04/F06; H1d:
  no LZMA2/LZ4/transform arm clears the k=3 minimum gain; H0: all EQUIVALENT to sq-abs128.'

schema: ebr.spec.v1
experiment_id: EXP-RECON-001
status: pre-registered-design
question: >
  On every tuning item, what does the status-quo production planner (v6, the only generation
  `ebound pack` emits) do with DEFLATE and JPEG reconstruction in each profile, layout and
  encryption cell: which objects it selects or rejects and why, what it declares (feature bits,
  decode requirements, access cost), what the recorded savings are, and does every cell round-trip
  exactly and deterministically?
hypothesis: >
  See protocol.md section 3 (H1a-H1e). In short: zero round-trip mismatches (HC-02); unencrypted
  output repeat-hash identical (HC-13); feature bits 0x4 and 0x8 set on at least 90 percent of
  non-fast unencrypted archives regardless of selections; at least one (profile, layout) cell with
  fewer than 5 DEFLATE-reconstruction path exercises (MVT-02(e) HC_UNVERIFIED); no reconstruction
  path exercised in encrypted cells.
decision_ids: [DEC-CMP-018, DEC-CMP-026, DEC-CMP-023, DEC-CMP-016, DEC-CMP-012, DEC-CON-004, DEC-CON-005, DEC-CON-010]
notes: >
  Status quo characterization plus binary HC screens; no candidate comparison, no W/S, no
  validation look (validation runs of this spec are part of the first registered look of the
  decisions above, see protocol.md section 6). Run prepare.sh first.

candidates:
  - {name: fast-indexed-plain, params: {profile: fast, layout: indexed, encrypt: "false"}}
  - {name: balanced-indexed-plain, params: {profile: balanced, layout: indexed, encrypt: "false"}}
  - {name: dense-indexed-plain, params: {profile: dense, layout: indexed, encrypt: "false"}}
  - {name: extreme-indexed-plain, params: {profile: extreme, layout: indexed, encrypt: "false"}}
  - {name: fast-stream-plain, params: {profile: fast, layout: stream, encrypt: "false"}}
  - {name: balanced-stream-plain, params: {profile: balanced, layout: stream, encrypt: "false"}}
  - {name: dense-stream-plain, params: {profile: dense, layout: stream, encrypt: "false"}}
  - {name: extreme-stream-plain, params: {profile: extreme, layout: stream, encrypt: "false"}}
  - {name: balanced-indexed-enc, params: {profile: balanced, layout: indexed, encrypt: "true"}}
  - {name: dense-indexed-enc, params: {profile: dense, layout: indexed, encrypt: "true"}}
  - {name: extreme-indexed-enc, params: {profile: extreme, layout: indexed, encrypt: "true"}}
command: >-
  python3 /mnt/d/Projects/entrybound/entrybound/research/experiments/EXP-RECON-001/recon_sample.py
  --item-path {item_path} --item-id {item_id} --profile {profile} --layout {layout}
  --encrypt {encrypt} --scratch {scratch}/s --bin-dir /root/eb-research/tools/EXP-RECON-001/bin
  --detail-dir /root/eb-research/results/EXP-RECON-001/detail --rep {rep}
shell: bash

corpus:
  splits: [tuning]
  manifest: research/corpus/manifest.json


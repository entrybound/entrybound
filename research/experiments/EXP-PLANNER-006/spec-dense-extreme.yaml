schema: ebr.spec.v1
experiment_id: EXP-PLANNER-006
status: design
question: >
  How does materialized artifact_bytes (with access granularity, declared
  decode requirements, section bytes and work units) respond to each SPEC
  section 6.0a profile parameter and to the arm parameters (window log,
  cross-file scope, ordering, planning window, adaptive planning, decoder
  ceilings, eligibility mirroring) one at a time around each profile's status
  quo, and how do the fitted thirteen-parameter, reduced, weighted and
  lexicographic profile definitions compare with the frozen tables?
hypothesis: >
  See research/experiments/EXP-PLANNER-006/protocol.md section 2 (H1.1-H1.10).
decision_ids: [DEC-CMP-035, DEC-CMP-045, DEC-CMP-016, DEC-CMP-006, DEC-CMP-013, DEC-CMP-019, DEC-CRY-028, DEC-ACC-003, DEC-ACC-029]


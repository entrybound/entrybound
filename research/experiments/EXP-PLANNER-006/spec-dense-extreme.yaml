corpus:
  manifest: research/planner/derived/g1-psub-64.json
  splits: [tuning]

metrics:
  - {name: artifact_bytes, source: stdout_json, key: artifact_bytes, family: size, direction: minimize, unit: B}
  - {name: modelled_only, source: stdout_json, key: modelled_only, family: correctness, direction: none}
  - {name: access_granularity_bytes, source: stdout_json, key: access_granularity_bytes, family: size, direction: minimize, unit: B}
  - {name: declared_decode_memory_bytes, source: stdout_json, key: declared_decode_memory_bytes, family: other, direction: none, unit: B}
  - {name: declared_window_bytes, source: stdout_json, key: declared_window_bytes, family: other, direction: none, unit: B}
  - {name: dictionary_bytes, source: stdout_json, key: byte_accounting.dictionary_bytes, family: size, direction: minimize, unit: B}
  - {name: index_bytes, source: stdout_json, key: byte_accounting.index_bytes, family: size, direction: minimize, unit: B}
  - {name: diag_chunk_payload_bytes, source: stdout_json, key: byte_accounting.chunk_payload_bytes, family: size, direction: none, unit: B}
  - {name: metadata_bytes, source: derived, op: difference, args: [artifact_bytes, diag_chunk_payload_bytes], family: size, direction: minimize, unit: B}
  - {name: pack_outcome_ok, source: stdout_json, key: pack_outcome_ok, family: correctness, direction: maximize}
  - {name: unsupported_parameter_count, source: stdout_json, key: unsupported_parameter_count, family: correctness, direction: minimize, unit: count}
  - {name: work_candidate_evaluations, source: stdout_json, key: work.candidate_evaluations, family: other, direction: none, unit: count}
  - {name: work_bytes_examined, source: stdout_json, key: work.bytes_examined, family: other, direction: none, unit: B}
  - {name: artifact_sha256, source: path_sha256, path: "{scratch}/archive.eb", family: correctness}
  - {name: roundtrip_mismatches, source: stdout_json, key: roundtrip_mismatches, family: correctness, direction: minimize, unit: count}
  - {name: input_bytes, source: input, family: size, direction: none, unit: B}

repetitions: 2
warmups: 0
seeds: {order: 260917061, bootstrap: 260917062, command: 260917063}
timing: false
order: randomized_blocks
raw_compression: gzip

platform:
  os: [linux]
  arch: [x86_64]
  emulated: false
  min_cpus: 1
  scratch_root: /root/eb-research/scratch/ebr
  requires: [/root/eb-research/target/planner-harness/release/ebr-planner]
  timeout_s: 172800

analysis:
  baseline: sq--dense
  pairing: item
  report_metrics: [artifact_bytes, access_granularity_bytes, declared_decode_memory_bytes, work_candidate_evaluations]

notes: >
  NEEDS_TOOLING as spec.yaml. dense and extreme on G1-PSUB-64 (one PSUB-64 sub-item per tuning
  independence group). 100 candidates.

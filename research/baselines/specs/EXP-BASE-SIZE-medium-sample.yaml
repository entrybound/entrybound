- name: tarbrotli-q11
  params:
    quality: 11
    format: tar+brotli
  command: tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C {item_path} . | brotli
    -q 11 -c > {scratch}/artifact.bin && python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py

    level: 9
    format: dwarfs
  command: rm -f {scratch}/artifact.bin && mkdwarfs -i {item_path} -o {scratch}/artifact.bin -l9 >/dev/null
    2>&1 && python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py

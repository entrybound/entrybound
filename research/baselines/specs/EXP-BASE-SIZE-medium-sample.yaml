    {scratch}/artifact.bin
  env:
    RESTIC_PASSWORD: ebr-baseline-research-only
- name: dwarfs-l7
  params:
    level: 7
    format: dwarfs
  command: rm -f {scratch}/artifact.bin && mkdwarfs -i {item_path} -o {scratch}/artifact.bin -l7 >/dev/null

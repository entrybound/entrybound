- name: wim-lzx
  params:
    format: wim
  command: rm -f {scratch}/artifact.bin && wimcapture {item_path} {scratch}/artifact.bin --compress=LZX
    --no-acls >/dev/null && python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py

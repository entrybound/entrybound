  command: tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf - -C {item_path} . | gzip
    -9 -n > {scratch}/artifact.bin && python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py

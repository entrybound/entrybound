  command: cd {item_path} && 7z a -t7z -mx=9 -snl -bd -y {scratch}/artifact.bin . >/dev/null && python3
    /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py {scratch}/artifact.bin
- name: 7z-mx9-nosolid
  params:
    level: 9
    format: sevenzip
  command: cd {item_path} && 7z a -t7z -mx=9 -ms=off -snl -bd -y {scratch}/artifact.bin . >/dev/null &&

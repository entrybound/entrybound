- name: borg-repo
  params:
    format: borg
  command: rm -rf {scratch}/artifact.bin && borg init --encryption=none {scratch}/artifact.bin >/dev/null
    && borg create --compression zstd,19 {scratch}/artifact.bin::onlyarchive {item_path} >/dev/null &&
    python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py {scratch}/artifact.bin
- name: restic-repo
  params:
    format: restic
  command: rm -rf {scratch}/artifact.bin && restic init --repo {scratch}/artifact.bin -q && restic backup

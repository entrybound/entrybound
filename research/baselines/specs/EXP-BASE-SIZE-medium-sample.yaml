metrics:
- name: output_bytes
  source: path_size
  path: '{scratch}/artifact.bin'
  family: size
  direction: minimize
  unit: B
- name: artifact_kind
  source: stdout_json
  key: artifact_kind
  family: correctness
  kind: string
- name: artifact_sha256
  source: stdout_json
  key: artifact_sha256
  family: correctness
  kind: string
- name: artifact_tree_sha256
  source: stdout_json
  key: artifact_tree_sha256
  family: correctness
  kind: string
- name: artifact_logical_tree_sha256
  source: stdout_json
  key: artifact_logical_tree_sha256
  family: correctness
  kind: string
- name: input_bytes
  source: input
  family: size
  direction: none
  unit: B
- name: ratio
  source: derived
  op: ratio
  args:
  - output_bytes
  - input_bytes
  family: size
  direction: minimize
- name: roundtrip_ok
  source: check
  command: python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/roundtrip_check.py
    {item_path} {scratch}/artifact.bin {format} {scratch}/extracted {scratch}/roundtrip.json --detail-log
    /mnt/d/Projects/entrybound/entrybound/research/raw/EXP-BASE-SIZE/roundtrip-detail.jsonl --candidate
    {candidate} --item-id {item_id} --rep {rep}
  family: correctness
  direction: maximize
repetitions: 2
warmups: 0
seeds:
  order: 20260917
  bootstrap: 20260917
timing: false
order: randomized_blocks
raw_compression: none
platform:
  os:
  - linux
  arch:
  - x86_64
  requires:
  - 7z
  - borg
  - brotli
  - gzip
  - lz4
  - mkdwarfs
  - mksquashfs
  - pigz
  - pixz
  - restic
  - tar
  - wimcapture
  - xz
  - zip
  - zpaq
  - zstd
  timeout_s: 1800
analysis:
  report_metrics:
  - output_bytes
  - ratio
  - roundtrip_ok

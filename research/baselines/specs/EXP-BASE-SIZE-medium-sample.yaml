schema: ebr.spec.v1
experiment_id: EXP-BASE-SIZE
status: baselines
question: For each pinned incumbent container/compressor configuration, what artifact size, determinism
  and round-trip fidelity does it achieve on the tuning+validation corpus, with timing disabled (research/PROGRESS.md
  quiet-machine constraint)?
hypothesis: 'No specific hypothesis: this is a descriptive measurement pass (baselines/configs.json) feeding
  the domain experiments in Phase C, not a decision test.'
decision_ids: []
candidates:
- name: zip-6
  params:
    level: 6
    format: zip
  command: cd {item_path} && zip -6 -r -X -y -q {scratch}/artifact.bin . ; test -f {scratch}/artifact.bin
    || mv {scratch}/artifact.bin.zip {scratch}/artifact.bin ; python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py
    {scratch}/artifact.bin
- name: zip-9
  params:
    level: 9
    format: zip
  command: cd {item_path} && zip -9 -r -X -y -q {scratch}/artifact.bin . ; test -f {scratch}/artifact.bin
    || mv {scratch}/artifact.bin.zip {scratch}/artifact.bin ; python3 /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py
    {scratch}/artifact.bin
- name: 7z-zip-9
  params:
    level: 9
    format: zip
  command: cd {item_path} && 7z a -tzip -mx=9 -snl -bd -y {scratch}/artifact.bin . >/dev/null && python3
    /mnt/d/Projects/entrybound/entrybound/research/baselines/probes/finalize_artifact.py {scratch}/artifact.bin
- name: targz-gzip-6
